name: Build OpenClaw LXC Ubuntu 24.04 LTS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "模板版本号"
        required: true
        default: "auto"
      openclaw_version:
        description: "OpenClaw 版本，例如 latest 或具体版本"
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: openclaw-lxc-ubuntu2404-${{ inputs.version }}-${{ inputs.openclaw_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            ubuntu-keyring \
            ca-certificates \
            curl \
            wget \
            gnupg \
            gzip \
            xz-utils \
            zstd \
            tar \
            jq \
            file \
            openssl \
            coreutils \
            util-linux \
            acl \
            attr \
            python3 \
            gh

          debootstrap --version
          gh --version
          python3 --version

      - name: Build and publish OpenClaw Ubuntu 24.04 LXC
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          VERSION="${INPUT_VERSION:-auto}"
          OPENCLAW_VERSION="${INPUT_OPENCLAW_VERSION:-latest}"

          if [ "$VERSION" = "auto" ]; then
            VERSION="$(date -u +'%Y.%m.%d-%H%M')"
          fi

          if ! printf '%s\n' "$VERSION" |
            grep -Eq '^[A-Za-z0-9._-]+$'
          then
            echo "错误：version 只能包含字母、数字、点、下划线和横线"
            exit 1
          fi

          if [ -z "$OPENCLAW_VERSION" ]; then
            echo "错误：OpenClaw 版本不能为空"
            exit 1
          fi

          IMAGE_PREFIX="openclaw-lxc-ubuntu2404"
          IMAGE_NAME="${IMAGE_PREFIX}-${VERSION}.tar.gz"

          WORK_DIR="$PWD/work"
          ROOTFS="$WORK_DIR/rootfs"
          DIST_DIR="$PWD/dist"

          INSTALL_SCRIPT="$WORK_DIR/install-inside-ubuntu2404.sh"
          MANAGER_SCRIPT="$WORK_DIR/openclaw-lxc-manager"

          mkdir -p "$WORK_DIR"
          mkdir -p "$DIST_DIR"

          cleanup_mounts() {
            set +e

            if [ -n "${ROOTFS:-}" ] && [ -d "$ROOTFS" ]; then
              sudo umount -R -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/sys" 2>/dev/null || true

              sudo umount -lf "$ROOTFS/dev/pts" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            fi
          }

          trap cleanup_mounts EXIT INT TERM

          echo "=================================================="
          echo "[1/9] 生成容器内部管理脚本"
          echo "=================================================="

          export GENERATED_MANAGER_PATH="$MANAGER_SCRIPT"

          python3 - <<'PY_MANAGER'
          import os
          from pathlib import Path

          path = Path(os.environ["GENERATED_MANAGER_PATH"])

          content = r"""#!/usr/bin/env bash
          set -Eeuo pipefail

          STATE_DIR="/root/.openclaw"
          CONFIG_FILE="$STATE_DIR/openclaw.json"
          ENV_FILE="$STATE_DIR/.env"
          MARKER_FILE="$STATE_DIR/.lxc-initialized"
          INFO_FILE="/root/openclaw-info.txt"
          BACKUP_DIR="/root/.openclaw-backups"
          BUILD_INFO_FILE="/etc/openclaw-build-info.json"
          UI_PROFILE_FILE="/etc/openclaw-control-ui-profile"
          GATEWAY_COMMAND_FILE="/etc/openclaw-gateway-command"
          LOCK_FILE="/run/openclaw-lxc-manager.lock"

          GATEWAY_PORT="18789"
          GATEWAY_BIND="lan"
          NET_IFACE="eth0"

          TEST_PID=""

          export HOME="/root"
          export OPENCLAW_HOME="/root"
          export OPENCLAW_STATE_DIR="$STATE_DIR"
          export OPENCLAW_CONFIG_PATH="$CONFIG_FILE"
          export OPENCLAW_SERVICE_REPAIR_POLICY="external"
          export OPENCLAW_NO_RESPAWN="1"
          export OPENCLAW_DANGEROUS_FULL_TOOLS="1"
          export OPENCLAW_HIDE_BANNER="1"

          log() {
            printf '%s\n' "$*"
          }

          die() {
            printf '错误：%s\n' "$*" >&2
            exit 1
          }

          require_root() {
            if [ "$(id -u)" != "0" ]; then
              die "该命令必须使用 root 运行"
            fi
          }

          acquire_lock() {
            mkdir -p /run
            exec 9>"$LOCK_FILE"
            flock -x 9
          }

          ensure_directories() {
            mkdir -p "$STATE_DIR/workspace"
            mkdir -p "$STATE_DIR/agents/main/sessions"
            mkdir -p "$STATE_DIR/agents/main/agent"
            mkdir -p "$BACKUP_DIR"

            chown -R root:root "$STATE_DIR" "$BACKUP_DIR"
            chmod 700 "$STATE_DIR" "$BACKUP_DIR"
          }

          read_env_value() {
            local key="$1"

            if [ ! -s "$ENV_FILE" ]; then
              return 0
            fi

            grep -m1 "^${key}=" "$ENV_FILE" 2>/dev/null |
              cut -d= -f2- ||
              true
          }

          write_env_value() {
            local key="$1"
            local value="$2"
            local temporary_file

            mkdir -p "$(dirname "$ENV_FILE")"
            touch "$ENV_FILE"

            temporary_file="$(mktemp)"

            grep -v "^${key}=" "$ENV_FILE" \
              >"$temporary_file" 2>/dev/null ||
              true

            printf '%s=%s\n' "$key" "$value" >>"$temporary_file"

            mv "$temporary_file" "$ENV_FILE"

            chown root:root "$ENV_FILE"
            chmod 600 "$ENV_FILE"
          }

          ensure_gateway_token() {
            local token

            token="$(
              read_env_value OPENCLAW_GATEWAY_TOKEN
            )"

            if [ -z "$token" ] ||
              [ "$token" = "GENERATE_ON_FIRST_BOOT" ] ||
              [ "${#token}" -lt 16 ]
            then
              token="$(openssl rand -hex 32)"
            fi

            write_env_value \
              OPENCLAW_GATEWAY_TOKEN \
              "$token"

            write_env_value \
              OPENCLAW_GATEWAY_PORT \
              "$GATEWAY_PORT"

            write_env_value \
              OPENCLAW_GATEWAY_BIND \
              "$GATEWAY_BIND"

            printf '%s' "$token"
          }

          export_config_environment() {
            local gateway_token
            local provider_key

            gateway_token="$(
              read_env_value OPENCLAW_GATEWAY_TOKEN
            )"

            provider_key="$(
              read_env_value OPENCLAW_PROVIDER_API_KEY
            )"

            if [ -n "$gateway_token" ]; then
              export OPENCLAW_GATEWAY_TOKEN="$gateway_token"
            else
              unset OPENCLAW_GATEWAY_TOKEN 2>/dev/null || true
            fi

            if [ -n "$provider_key" ]; then
              export OPENCLAW_PROVIDER_API_KEY="$provider_key"
            else
              unset OPENCLAW_PROVIDER_API_KEY 2>/dev/null || true
            fi
          }

          ensure_valid_json() {
            ensure_directories

            if [ ! -s "$CONFIG_FILE" ] ||
              ! jq empty "$CONFIG_FILE" >/dev/null 2>&1
            then
              printf '{}\n' >"$CONFIG_FILE"
            fi

            chown root:root "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"
          }

          get_ipv4() {
            ip -o -4 addr show \
              dev "$NET_IFACE" \
              scope global \
              2>/dev/null |
              awk '{print $4}' |
              cut -d/ -f1 |
              head -n1 ||
              true
          }

          build_allowed_origins() {
            local ipv4
            local host_name

            ipv4="$(get_ipv4)"

            host_name="$(
              hostname 2>/dev/null ||
                printf 'OpenClaw'
            )"

            jq -nc \
              --arg port "$GATEWAY_PORT" \
              --arg ip "$ipv4" \
              --arg hostname "$host_name" \
              '
              [
                "http://127.0.0.1:" + $port,
                "http://localhost:" + $port,
                "http://" + $hostname + ":" + $port
              ]
              +
              (
                if $ip == "" then
                  []
                else
                  ["http://" + $ip + ":" + $port]
                end
              )
              | unique
              '
          }

          validate_config() {
            export_config_environment

            HOME="/root" \
            OPENCLAW_HOME="/root" \
            OPENCLAW_STATE_DIR="$STATE_DIR" \
            OPENCLAW_CONFIG_PATH="$CONFIG_FILE" \
              openclaw config validate
          }

          verify_gateway_service_policy() {
            local restart_policy
            local prevent_status
            local service_environment

            restart_policy="$(
              systemctl show openclaw-gateway.service \
                -p Restart \
                --value 2>/dev/null ||
                true
            )"

            prevent_status="$(
              systemctl show openclaw-gateway.service \
                -p RestartPreventExitStatus \
                --value 2>/dev/null ||
                true
            )"

            service_environment="$(
              systemctl show openclaw-gateway.service \
                -p Environment \
                --value 2>/dev/null ||
                true
            )"

            if [ "$restart_policy" != "always" ]; then
              die "Gateway systemd 策略错误：Restart 必须为 always，当前为 ${restart_policy:-未设置}"
            fi

            case " $prevent_status " in
              *" 78 "*)
                ;;
              *)
                die "Gateway systemd 策略错误：缺少 RestartPreventExitStatus=78"
                ;;
            esac

            case " $service_environment " in
              *" OPENCLAW_NO_RESPAWN=1 "*)
                ;;
              *)
                die "Gateway systemd 策略错误：缺少 OPENCLAW_NO_RESPAWN=1"
                ;;
            esac
          }

          apply_required_config() {
            local token_reference
            local temporary_config

            ensure_directories
            ensure_valid_json
            ensure_gateway_token >/dev/null

            token_reference='${OPENCLAW_GATEWAY_TOKEN}'
            temporary_config="$(mktemp)"

            jq \
              --arg tokenReference "$token_reference" \
              --arg bind "$GATEWAY_BIND" \
              --argjson port "$GATEWAY_PORT" \
              '
              .gateway = (
                if (.gateway? | type) == "object" then
                  .gateway
                else
                  {}
                end
              ) |

              del(.gateway.controlUi) |

              .gateway.mode = "local" |
              .gateway.port = $port |
              .gateway.bind = $bind |

              .gateway.auth = (
                if (.gateway.auth? | type) == "object" then
                  .gateway.auth
                else
                  {}
                end
              ) |

              .gateway.auth.mode = "token" |
              .gateway.auth.token = $tokenReference |

              .tools = (
                if (.tools? | type) == "object" then
                  .tools
                else
                  {}
                end
              ) |

              .tools.profile = "full" |

              .tools.elevated = (
                if (.tools.elevated? | type) == "object" then
                  .tools.elevated
                else
                  {}
                end
              ) |

              .tools.elevated.enabled = true |
              del(.tools.elevated.allowFrom) |

              .tools.exec = (
                if (.tools.exec? | type) == "object" then
                  .tools.exec
                else
                  {}
                end
              ) |

              .tools.exec.security = "full" |
              .tools.exec.ask = "off" |
              .tools.exec.host = "gateway" |

              del(.tools.allow) |
              del(.tools.deny) |

              .agents = (
                if (.agents? | type) == "object" then
                  .agents
                else
                  {}
                end
              ) |

              .agents.defaults = (
                if (.agents.defaults? | type) == "object" then
                  .agents.defaults
                else
                  {}
                end
              ) |

              del(.agents.defaults.tools) |

              .agents.defaults.sandbox = (
                if (.agents.defaults.sandbox? | type) == "object" then
                  .agents.defaults.sandbox
                else
                  {}
                end
              ) |

              .agents.defaults.sandbox.mode = "off"
              ' "$CONFIG_FILE" >"$temporary_config"

            mv "$temporary_config" "$CONFIG_FILE"

            chown root:root "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"
          }

          apply_ui_profile() {
            local profile
            local origins
            local temporary_config

            profile="${1:-none}"
            origins="$(build_allowed_origins)"
            temporary_config="$(mktemp)"

            case "$profile" in
              full)
                jq \
                  --argjson origins "$origins" \
                  '
                  .gateway.controlUi = (
                    if (.gateway.controlUi? | type) == "object" then
                      .gateway.controlUi
                    else
                      {}
                    end
                  ) |

                  .gateway.controlUi.enabled = true |
                  .gateway.controlUi.allowedOrigins = $origins |
                  .gateway.controlUi.allowInsecureAuth = true |
                  .gateway.controlUi.dangerouslyDisableDeviceAuth = true |
                  .gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback = true
                  ' "$CONFIG_FILE" >"$temporary_config"
                ;;

              basic)
                jq \
                  --argjson origins "$origins" \
                  '
                  .gateway.controlUi = (
                    if (.gateway.controlUi? | type) == "object" then
                      .gateway.controlUi
                    else
                      {}
                    end
                  ) |

                  .gateway.controlUi.enabled = true |
                  .gateway.controlUi.allowedOrigins = $origins |
                  del(.gateway.controlUi.allowInsecureAuth) |
                  del(.gateway.controlUi.dangerouslyDisableDeviceAuth) |
                  del(.gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback)
                  ' "$CONFIG_FILE" >"$temporary_config"
                ;;

              none)
                jq \
                  'del(.gateway.controlUi)' \
                  "$CONFIG_FILE" >"$temporary_config"
                ;;

              *)
                rm -f "$temporary_config"
                die "未知 Control UI 配置模式：$profile"
                ;;
            esac

            mv "$temporary_config" "$CONFIG_FILE"

            chown root:root "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"
          }

          get_ui_profile() {
            local profile

            profile="none"

            if [ -s "$UI_PROFILE_FILE" ]; then
              profile="$(
                tr -d '[:space:]' <"$UI_PROFILE_FILE"
              )"
            fi

            case "$profile" in
              full|basic|none)
                printf '%s' "$profile"
                ;;
              *)
                printf 'none'
                ;;
            esac
          }

          choose_ui_profile() {
            local required_config

            required_config="$(mktemp)"
            cp "$CONFIG_FILE" "$required_config"

            apply_ui_profile full

            if validate_config \
              >/tmp/openclaw-ui-full-validation.log 2>&1
            then
              printf 'full\n' >"$UI_PROFILE_FILE"
              chmod 644 "$UI_PROFILE_FILE"

              rm -f "$required_config"

              log "Control UI 配置模式：full"
              return 0
            fi

            cp "$required_config" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            apply_ui_profile basic

            if validate_config \
              >/tmp/openclaw-ui-basic-validation.log 2>&1
            then
              printf 'basic\n' >"$UI_PROFILE_FILE"
              chmod 644 "$UI_PROFILE_FILE"

              rm -f "$required_config"

              log "Control UI 配置模式：basic"
              return 0
            fi

            cp "$required_config" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            apply_ui_profile none

            if validate_config \
              >/tmp/openclaw-ui-none-validation.log 2>&1
            then
              printf 'none\n' >"$UI_PROFILE_FILE"
              chmod 644 "$UI_PROFILE_FILE"

              rm -f "$required_config"

              log "Control UI 配置模式：default"
              return 0
            fi

            cp "$required_config" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            rm -f "$required_config"

            cat /tmp/openclaw-ui-full-validation.log 2>/dev/null || true
            cat /tmp/openclaw-ui-basic-validation.log 2>/dev/null || true
            cat /tmp/openclaw-ui-none-validation.log 2>/dev/null || true

            die "当前 OpenClaw 版本的 Control UI 配置无法通过校验"
          }

          apply_full_config() {
            local profile

            profile="$(get_ui_profile)"

            apply_required_config
            apply_ui_profile "$profile"

            chown -R root:root "$STATE_DIR"
            chmod 700 "$STATE_DIR"
            chmod 600 "$CONFIG_FILE" "$ENV_FILE"
          }

          verify_permission_config() {
            if ! jq -e '
              .gateway.mode == "local" and
              .gateway.port == 18789 and
              .gateway.bind == "lan" and
              .gateway.auth.mode == "token" and
              .gateway.auth.token == "${OPENCLAW_GATEWAY_TOKEN}" and
              .tools.profile == "full" and
              .tools.elevated.enabled == true and
              .tools.exec.security == "full" and
              .tools.exec.ask == "off" and
              .tools.exec.host == "gateway" and
              .agents.defaults.sandbox.mode == "off" and
              (.tools.allow? | not) and
              (.tools.deny? | not)
            ' "$CONFIG_FILE" >/dev/null
            then
              die "OpenClaw 配置没有达到完整权限要求"
            fi
          }

          build_init() {
            ensure_directories
            ensure_gateway_token >/dev/null
            ensure_valid_json

            apply_required_config

            if ! validate_config \
              >/tmp/openclaw-required-validation.log 2>&1
            then
              cat /tmp/openclaw-required-validation.log >&2 || true
              die "当前 OpenClaw 版本不接受必要配置"
            fi

            choose_ui_profile

            if ! validate_config \
              >/tmp/openclaw-build-final-validation.log 2>&1
            then
              cat /tmp/openclaw-build-final-validation.log >&2 || true
              die "构建配置最终校验失败"
            fi

            verify_permission_config

            touch "$MARKER_FILE"

            chown root:root "$MARKER_FILE"
            chmod 600 "$MARKER_FILE"

            refresh_info
          }

          firstboot() {
            ensure_directories
            verify_gateway_service_policy

            if [ -f "$MARKER_FILE" ] &&
              [ -s "$ENV_FILE" ] &&
              [ -s "$CONFIG_FILE" ] &&
              jq empty "$CONFIG_FILE" >/dev/null 2>&1
            then
              refresh_info
              return 0
            fi

            ensure_gateway_token >/dev/null
            apply_full_config

            if ! validate_config \
              >/tmp/openclaw-firstboot-validation.log 2>&1
            then
              cat /tmp/openclaw-firstboot-validation.log >&2 || true
              die "OpenClaw 首次启动配置校验失败"
            fi

            verify_permission_config

            touch "$MARKER_FILE"

            chown root:root "$MARKER_FILE"
            chmod 600 "$MARKER_FILE"

            refresh_info
          }

          template_reset() {
            local temporary_config

            ensure_valid_json

            temporary_config="$(mktemp)"

            jq '
              .gateway.auth.mode = "token" |
              .gateway.auth.token = "${OPENCLAW_GATEWAY_TOKEN}" |

              if (
                (.gateway.controlUi? | type) == "object" and
                (.gateway.controlUi.allowedOrigins? | type) == "array"
              ) then
                .gateway.controlUi.allowedOrigins = [
                  "http://127.0.0.1:18789",
                  "http://localhost:18789",
                  "http://OpenClaw:18789"
                ]
              else
                .
              end
              ' "$CONFIG_FILE" >"$temporary_config"

            mv "$temporary_config" "$CONFIG_FILE"

            rm -f "$ENV_FILE"
            rm -f "$MARKER_FILE"
            rm -f "$INFO_FILE"

            chown -R root:root "$STATE_DIR"
            chmod 700 "$STATE_DIR"
            chmod 600 "$CONFIG_FILE"
          }

          refresh_info() {
            local ipv4
            local token
            local installed_version
            local gateway_mode

            ensure_directories

            ipv4="$(get_ipv4)"

            token="$(
              read_env_value OPENCLAW_GATEWAY_TOKEN
            )"

            installed_version="未知"

            if [ -s "$BUILD_INFO_FILE" ]; then
              installed_version="$(
                jq -r '.openclawVersion // "未知"' \
                  "$BUILD_INFO_FILE" 2>/dev/null ||
                  printf '未知'
              )"
            fi

            gateway_mode="未选择"

            if [ -s "$GATEWAY_COMMAND_FILE" ]; then
              gateway_mode="$(
                tr -d '[:space:]' <"$GATEWAY_COMMAND_FILE"
              )"
            fi

            {
              echo "============================================================"
              echo "OpenClaw LXC Ubuntu 24.04 LTS"
              echo "============================================================"
              echo "OpenClaw 版本："
              echo "  $installed_version"
              echo

              if [ -n "$ipv4" ]; then
                echo "访问地址："
                echo "  http://$ipv4:$GATEWAY_PORT"
                echo "  ws://$ipv4:$GATEWAY_PORT"
              else
                echo "访问地址："
                echo "  未检测到 eth0 IPv4"
              fi

              echo
              echo "Gateway Token："
              echo "  ${token:-未生成}"

              echo
              echo "Gateway 运行模式："
              echo "  $gateway_mode"

              echo
              echo "第一次使用："
              echo "  1. 运行 openclaw-api-setup"
              echo "  2. 配置 Base URL、模型名称和 API Key"
              echo "  3. 浏览器打开上面的访问地址"
              echo "  4. 输入 Gateway Token"

              echo
              echo "常用命令："
              echo "  openclaw-api-setup"
              echo "  openclaw-info"
              echo "  openclaw-status"
              echo "  openclaw-logs"
              echo "  openclaw-restart"
              echo "  openclaw-plugins"
              echo "  openclaw-update"
              echo "  openclaw-update <版本>"
              echo "  openclaw-repair-max-permissions"

              echo
              echo "工作目录："
              echo "  /root/.openclaw/workspace"
              echo "============================================================"
            } >"$INFO_FILE"

            chown root:root "$INFO_FILE"
            chmod 600 "$INFO_FILE"

            : >/etc/motd || true
          }

          cleanup_test_process() {
            local pid

            pid="${TEST_PID:-}"

            if [ -z "$pid" ]; then
              return 0
            fi

            kill -TERM -- "-$pid" 2>/dev/null || true

            for _ in $(seq 1 10); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            kill -KILL -- "-$pid" 2>/dev/null || true
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            TEST_PID=""

            for _ in $(seq 1 20); do
              if ! ss -lnt 2>/dev/null |
                grep -q ':18789'
              then
                break
              fi

              sleep 1
            done
          }

          start_gateway_mode() {
            local mode="$1"
            local log_file="$2"

            case "$mode" in
              gateway)
                setsid \
                  openclaw gateway \
                    --port "$GATEWAY_PORT" \
                    >"$log_file" 2>&1 &

                TEST_PID="$!"
                ;;

              gateway-run)
                setsid \
                  openclaw gateway run \
                    --port "$GATEWAY_PORT" \
                    >"$log_file" 2>&1 &

                TEST_PID="$!"
                ;;

              *)
                return 1
                ;;
            esac
          }

          test_gateway_mode() {
            local mode="$1"
            local stable_seconds="${2:-10}"
            local test_restart="${3:-0}"
            local log_file
            local body_file
            local http_code
            local ready
            local pid

            log_file="/tmp/openclaw-gateway-${mode}.log"
            body_file="/tmp/openclaw-gateway-${mode}.body"

            rm -f "$log_file" "$body_file"

            if ss -lnt 2>/dev/null |
              grep -q ':18789'
            then
              log "18789 端口已经被占用"
              ss -lntp | grep ':18789' || true
              return 1
            fi

            export_config_environment

            TEST_PID=""
            ready="0"

            trap cleanup_test_process EXIT INT TERM

            if ! start_gateway_mode "$mode" "$log_file"; then
              cleanup_test_process
              trap - EXIT INT TERM
              return 1
            fi

            pid="$TEST_PID"

            log "测试 Gateway 模式：$mode，PID：$pid"

            for _ in $(seq 1 60); do
              if ! kill -0 "$pid" 2>/dev/null; then
                log "Gateway 进程在监听端口前退出"
                cat "$log_file" 2>/dev/null || true

                cleanup_test_process
                trap - EXIT INT TERM
                return 1
              fi

              if ss -lnt 2>/dev/null |
                grep -q ':18789'
              then
                ready="1"
                break
              fi

              sleep 1
            done

            if [ "$ready" != "1" ]; then
              log "Gateway 在 60 秒内没有监听 18789"
              cat "$log_file" 2>/dev/null || true

              cleanup_test_process
              trap - EXIT INT TERM
              return 1
            fi

            http_code="$(
              curl \
                -sS \
                --connect-timeout 5 \
                --max-time 15 \
                -o "$body_file" \
                -w '%{http_code}' \
                http://127.0.0.1:18789/ ||
                true
            )"

            case "$http_code" in
              2*|3*|401|403)
                ;;
              *)
                log "Gateway HTTP 检查失败，状态码：${http_code:-无}"
                cat "$log_file" 2>/dev/null || true
                cat "$body_file" 2>/dev/null || true

                cleanup_test_process
                trap - EXIT INT TERM
                return 1
                ;;
            esac

            log "Gateway HTTP 状态码：$http_code"
            log "继续观察 Gateway ${stable_seconds} 秒"

            sleep "$stable_seconds"

            if ! kill -0 "$pid" 2>/dev/null; then
              log "Gateway 监听后自动退出"
              cat "$log_file" 2>/dev/null || true

              cleanup_test_process
              trap - EXIT INT TERM
              return 1
            fi

            if ! ss -lnt 2>/dev/null |
              grep -q ':18789'
            then
              log "Gateway 运行期间丢失 18789 监听"
              cat "$log_file" 2>/dev/null || true

              cleanup_test_process
              trap - EXIT INT TERM
              return 1
            fi

            if [ "$test_restart" = "1" ]; then
              log "验证 OPENCLAW_NO_RESPAWN 进程内重启"

              if ! openclaw gateway restart --safe \
                >>"$log_file" 2>&1
              then
                log "Gateway restart --safe 请求失败"
                cat "$log_file" 2>/dev/null || true

                cleanup_test_process
                trap - EXIT INT TERM
                return 1
              fi

              ready="0"

              for _ in $(seq 1 60); do
                if ! kill -0 "$pid" 2>/dev/null; then
                  log "Gateway 在进程内重启测试中退出"
                  cat "$log_file" 2>/dev/null || true

                  cleanup_test_process
                  trap - EXIT INT TERM
                  return 1
                fi

                if grep -q \
                  'restart mode: in-process restart' \
                  "$log_file" 2>/dev/null &&
                  ss -lnt 2>/dev/null |
                    grep -q ':18789'
                then
                  ready="1"
                  break
                fi

                sleep 1
              done

              if [ "$ready" != "1" ]; then
                log "Gateway 没有完成进程内重启"
                cat "$log_file" 2>/dev/null || true

                cleanup_test_process
                trap - EXIT INT TERM
                return 1
              fi

              http_code="$(
                curl \
                  -sS \
                  --connect-timeout 5 \
                  --max-time 15 \
                  -o "$body_file" \
                  -w '%{http_code}' \
                  http://127.0.0.1:18789/ ||
                  true
              )"

              case "$http_code" in
                2*|3*|401|403)
                  ;;
                *)
                  log "Gateway 进程内重启后的 HTTP 检查失败，状态码：${http_code:-无}"
                  cat "$log_file" 2>/dev/null || true
                  cat "$body_file" 2>/dev/null || true

                  cleanup_test_process
                  trap - EXIT INT TERM
                  return 1
                  ;;
              esac

              log "Gateway 进程内重启测试通过，PID 保持为 $pid"
            fi

            cleanup_test_process
            trap - EXIT INT TERM

            log "Gateway 模式 $mode 测试通过"
            return 0
          }

          select_gateway_command() {
            if test_gateway_mode gateway 15; then
              printf 'gateway\n' >"$GATEWAY_COMMAND_FILE"
              chmod 644 "$GATEWAY_COMMAND_FILE"

              log "选定 Gateway 命令：openclaw gateway --port 18789"
              return 0
            fi

            log "openclaw gateway --port 18789 不可持续运行，测试 gateway run"

            if test_gateway_mode gateway-run 15; then
              printf 'gateway-run\n' >"$GATEWAY_COMMAND_FILE"
              chmod 644 "$GATEWAY_COMMAND_FILE"

              log "选定 Gateway 命令：openclaw gateway run --port 18789"
              return 0
            fi

            die "当前 OpenClaw 版本没有可持续运行的 Gateway 前台命令"
          }

          smoke_selected_gateway() {
            local mode

            if [ ! -s "$GATEWAY_COMMAND_FILE" ]; then
              die "Gateway 命令模式文件不存在"
            fi

            mode="$(
              tr -d '[:space:]' <"$GATEWAY_COMMAND_FILE"
            )"

            case "$mode" in
              gateway|gateway-run)
                ;;
              *)
                die "未知 Gateway 命令模式：$mode"
                ;;
            esac

            if ! test_gateway_mode "$mode" 20 1; then
              die "最终 Gateway 常驻运行测试失败"
            fi
          }

          trim() {
            printf '%s' "$1" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          mask_secret() {
            local value="${1:-}"
            local length="${#value}"

            if [ "$length" -le 8 ]; then
              printf '********'
            else
              printf '%s****%s' \
                "${value:0:4}" \
                "${value: -4}"
            fi
          }

          normalize_base_url() {
            local value

            value="$(trim "$1")"
            value="${value%/}"

            case "$value" in
              */chat/completions)
                value="${value%/chat/completions}"
                ;;
            esac

            printf '%s' "${value%/}"
          }

          api_setup() {
            local old_base_url
            local old_model
            local old_reasoning
            local old_key
            local base_url
            local model_id
            local reasoning_input
            local model_reasoning
            local api_key
            local chat_url
            local test_body
            local http_code
            local save_anyway
            local backup_suffix
            local config_backup
            local env_backup
            local primary_model
            local temporary_config

            firstboot

            old_base_url="$(
              jq -r \
                '.models.providers.custom.baseUrl // empty' \
                "$CONFIG_FILE"
            )"

            old_model="$(
              jq -r \
                '.models.providers.custom.models[0].id // empty' \
                "$CONFIG_FILE"
            )"

            old_reasoning="$(
              jq -r \
                '.models.providers.custom.models[0].reasoning // false' \
                "$CONFIG_FILE"
            )"

            old_key="$(
              read_env_value OPENCLAW_PROVIDER_API_KEY
            )"

            clear 2>/dev/null || true

            echo "============================================================"
            echo "OpenClaw OpenAI-Compatible API 配置"
            echo "============================================================"
            echo "Base URL 示例："
            echo "  https://api.deepseek.com"
            echo "  https://api.deepseek.com/v1"
            echo "  https://dashscope.aliyuncs.com/compatible-mode/v1"
            echo "  https://api.moonshot.cn/v1"
            echo "  https://your-domain.example.com/v1"
            echo
            echo "也可以填写完整地址："
            echo "  https://example.com/v1/chat/completions"
            echo "============================================================"
            echo

            read -r -p \
              "Base URL${old_base_url:+ [$old_base_url]}: " \
              base_url

            base_url="$(trim "${base_url:-}")"

            if [ -z "$base_url" ]; then
              base_url="$old_base_url"
            fi

            base_url="$(normalize_base_url "$base_url")"

            read -r -p \
              "模型名称${old_model:+ [$old_model]}: " \
              model_id

            model_id="$(trim "${model_id:-}")"

            if [ -z "$model_id" ]; then
              model_id="$old_model"
            fi

            read -r -p \
              "是否支持 reasoning？[$old_reasoning]，y/N/true/false: " \
              reasoning_input

            reasoning_input="$(trim "${reasoning_input:-}")"

            if [ -z "$reasoning_input" ]; then
              model_reasoning="$old_reasoning"
            else
              case "$reasoning_input" in
                y|Y|yes|YES|Yes|true|TRUE|1)
                  model_reasoning="true"
                  ;;

                n|N|no|NO|No|false|FALSE|0)
                  model_reasoning="false"
                  ;;

                *)
                  die "reasoning 只能填写 y、n、true 或 false"
                  ;;
              esac
            fi

            if [ -n "$old_key" ]; then
              echo
              echo "当前 API Key：$(mask_secret "$old_key")"

              read -r -s -p \
                "新 API Key，直接回车沿用当前 Key: " \
                api_key

              echo

              api_key="$(trim "${api_key:-}")"

              if [ -z "$api_key" ]; then
                api_key="$old_key"
              fi
            else
              echo

              read -r -s -p "API Key: " api_key
              echo

              api_key="$(trim "${api_key:-}")"
            fi

            if [ -z "$base_url" ] ||
              [ -z "$model_id" ] ||
              [ -z "$api_key" ]
            then
              die "Base URL、模型名称和 API Key 不能为空"
            fi

            case "$base_url" in
              http://*|https://*)
                ;;
              *)
                die "Base URL 必须以 http:// 或 https:// 开头"
                ;;
            esac

            chat_url="$base_url/chat/completions"

            test_body="$(
              jq -nc \
                --arg model "$model_id" \
                '{
                  model: $model,
                  messages: [
                    {
                      role: "user",
                      content: "Please reply with OK only."
                    }
                  ],
                  max_tokens: 32,
                  stream: false
                }'
            )"

            rm -f /tmp/openclaw-api-response.json
            rm -f /tmp/openclaw-api-error.log

            http_code="$({
              curl \
                -sS \
                --connect-timeout 10 \
                --max-time 60 \
                -o /tmp/openclaw-api-response.json \
                -w '%{http_code}' \
                -H "Authorization: Bearer $api_key" \
                -H "Content-Type: application/json" \
                -d "$test_body" \
                "$chat_url"
            } 2>/tmp/openclaw-api-error.log || true)"

            case "$http_code" in
              200|201)
                echo "API 测试成功，HTTP $http_code"
                ;;

              *)
                echo "API 测试失败，HTTP ${http_code:-无}"

                if [ -s /tmp/openclaw-api-error.log ]; then
                  echo
                  cat /tmp/openclaw-api-error.log
                fi

                if [ -s /tmp/openclaw-api-response.json ]; then
                  echo
                  cat /tmp/openclaw-api-response.json
                  echo
                fi

                read -r -p \
                  "测试失败，仍然保存配置吗？y/N: " \
                  save_anyway

                case "${save_anyway:-N}" in
                  y|Y|yes|YES|Yes|true|TRUE|1)
                    ;;
                  *)
                    die "已取消"
                    ;;
                esac
                ;;
            esac

            backup_suffix="$(date +%Y%m%d-%H%M%S)"
            config_backup="$BACKUP_DIR/openclaw-config-$backup_suffix.json"
            env_backup="$BACKUP_DIR/openclaw-env-$backup_suffix"

            cp -a "$CONFIG_FILE" "$config_backup"
            cp -a "$ENV_FILE" "$env_backup"

            write_env_value \
              OPENCLAW_PROVIDER_API_KEY \
              "$api_key"

            primary_model="custom/$model_id"
            temporary_config="$(mktemp)"

            jq \
              --arg baseUrl "$base_url" \
              --arg modelId "$model_id" \
              --arg primaryModel "$primary_model" \
              --arg apiKeyReference '${OPENCLAW_PROVIDER_API_KEY}' \
              --argjson reasoning "$model_reasoning" \
              '
              .models = (
                if (.models? | type) == "object" then
                  .models
                else
                  {}
                end
              ) |

              .models.mode = "merge" |

              .models.providers = (
                if (.models.providers? | type) == "object" then
                  .models.providers
                else
                  {}
                end
              ) |

              .models.providers.custom = {
                baseUrl: $baseUrl,
                apiKey: $apiKeyReference,
                auth: "api-key",
                api: "openai-completions",
                models: [
                  {
                    id: $modelId,
                    name: $modelId,
                    input: ["text"],
                    reasoning: $reasoning
                  }
                ]
              } |

              .agents = (
                if (.agents? | type) == "object" then
                  .agents
                else
                  {}
                end
              ) |

              .agents.defaults = (
                if (.agents.defaults? | type) == "object" then
                  .agents.defaults
                else
                  {}
                end
              ) |

              .agents.defaults.model = {
                primary: $primaryModel,
                fallbacks: []
              }
              ' "$CONFIG_FILE" >"$temporary_config"

            mv "$temporary_config" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            apply_full_config

            if ! validate_config \
              >/tmp/openclaw-api-config-validation.log 2>&1
            then
              cat /tmp/openclaw-api-config-validation.log >&2 || true

              cp -a "$config_backup" "$CONFIG_FILE"
              cp -a "$env_backup" "$ENV_FILE"

              die "API 配置校验失败，已经恢复原配置"
            fi

            verify_permission_config

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway

            sleep 8

            refresh_info

            echo
            echo "API 配置完成"
            echo "Base URL：$base_url"
            echo "模型：$primary_model"
            echo "配置备份：$config_backup"
            echo "环境备份：$env_backup"
            echo

            systemctl status openclaw-gateway --no-pager || true
          }

          show_info() {
            if [ ! -s "$INFO_FILE" ]; then
              refresh_info
            fi

            cat "$INFO_FILE"
          }

          show_status() {
            echo "============================================================"
            echo "OpenClaw 版本"
            echo "============================================================"

            if [ -s "$BUILD_INFO_FILE" ]; then
              jq '.' "$BUILD_INFO_FILE" || true
            fi

            openclaw --version || true
            node --version || true
            npm --version || true

            echo
            echo "============================================================"
            echo "Gateway systemd 状态"
            echo "============================================================"

            systemctl status openclaw-gateway --no-pager || true

            echo
            echo "============================================================"
            echo "Gateway 重启信息"
            echo "============================================================"

            systemctl show openclaw-gateway \
              -p NRestarts \
              -p Result \
              -p ExecMainCode \
              -p ExecMainStatus \
              -p ActiveState \
              -p SubState \
              -p Restart \
              -p RestartUSec \
              -p RestartPreventExitStatus \
              -p Environment

            echo
            echo "============================================================"
            echo "进程"
            echo "============================================================"

            ps auxf |
              grep -E '[o]penclaw|[n]ode' ||
              true

            echo
            echo "============================================================"
            echo "端口监听"
            echo "============================================================"

            ss -lntp |
              grep ':18789' ||
              true

            echo
            echo "============================================================"
            echo "配置校验"
            echo "============================================================"

            validate_config || true

            echo
            echo "============================================================"
            echo "配置摘要"
            echo "============================================================"

            jq '{
              gateway: {
                mode: .gateway.mode,
                port: .gateway.port,
                bind: .gateway.bind,
                authMode: .gateway.auth.mode,
                controlUi: .gateway.controlUi
              },
              permissions: {
                profile: .tools.profile,
                elevated: .tools.elevated,
                exec: .tools.exec,
                sandbox: .agents.defaults.sandbox
              },
              model: .agents.defaults.model
            }' "$CONFIG_FILE" 2>/dev/null || true

            echo
            echo "============================================================"
            echo "HTTP 检查"
            echo "============================================================"

            curl -I \
              --connect-timeout 5 \
              --max-time 10 \
              http://127.0.0.1:18789/ ||
              true

            echo
            echo "============================================================"
            echo "最近日志"
            echo "============================================================"

            journalctl \
              -u openclaw-gateway \
              -n 100 \
              --no-pager ||
              true
          }

          restart_gateway() {
            if [ ! -f "$MARKER_FILE" ]; then
              firstboot
            fi

            verify_gateway_service_policy

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway

            sleep 8

            refresh_info

            systemctl status openclaw-gateway --no-pager || true

            ss -lntp |
              grep ':18789' ||
              true
          }

          repair_permissions() {
            local backup_file

            ensure_directories

            backup_file="$BACKUP_DIR/openclaw-before-repair-$(
              date +%Y%m%d-%H%M%S
            ).json"

            if [ -f "$CONFIG_FILE" ]; then
              cp -a "$CONFIG_FILE" "$backup_file"
            fi

            systemctl stop openclaw-gateway 2>/dev/null || true

            ensure_gateway_token >/dev/null
            apply_full_config

            if ! validate_config \
              >/tmp/openclaw-repair-validation.log 2>&1
            then
              cat /tmp/openclaw-repair-validation.log >&2 || true

              if [ -f "$backup_file" ]; then
                cp -a "$backup_file" "$CONFIG_FILE"
              fi

              die "权限配置修复失败，已经恢复"
            fi

            verify_permission_config

            touch "$MARKER_FILE"
            chmod 600 "$MARKER_FILE"

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway

            sleep 8

            refresh_info

            echo "修复完成"
            echo "配置备份：$backup_file"

            systemctl status openclaw-gateway --no-pager || true
          }

          show_plugins() {
            echo "============================================================"
            echo "OpenClaw 插件和工具"
            echo "============================================================"

            openclaw plugins list 2>/dev/null ||
              openclaw mcp list 2>/dev/null ||
              true

            echo
            echo "工具配置："

            jq '{
              tools: .tools,
              sandbox: .agents.defaults.sandbox
            }' "$CONFIG_FILE" 2>/dev/null || true
          }

          get_installed_version() {
            local npm_root

            npm_root="$(npm root -g)"

            node -p \
              "require('${npm_root}/openclaw/package.json').version"
          }

          resolve_version() {
            local specification="$1"
            local result

            if result="$(
              npm view "openclaw@${specification}" version \
                --json \
                --registry=https://registry.npmjs.org
            )"; then
              :
            else
              result="$(
                npm view "openclaw@${specification}" version \
                  --json \
                  --registry=https://registry.npmmirror.com
              )"
            fi

            printf '%s' "$result" |
              jq -er '
                if type == "array" then
                  .[-1]
                else
                  .
                end
                | select(type == "string" and length > 0)
              '
          }

          install_version() {
            local version="$1"

            if npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmjs.org
            then
              return 0
            fi

            npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmmirror.com
          }

          wait_for_gateway() {
            local ready

            ready="0"

            for _ in $(seq 1 45); do
              if systemctl is-active --quiet openclaw-gateway &&
                ss -lnt 2>/dev/null |
                  grep -q ':18789'
              then
                ready="1"
                break
              fi

              sleep 2
            done

            [ "$ready" = "1" ]
          }

          gateway_http_check() {
            local http_code

            http_code="$(
              curl \
                -sS \
                --connect-timeout 5 \
                --max-time 15 \
                -o /tmp/openclaw-update-http-body \
                -w '%{http_code}' \
                http://127.0.0.1:18789/ ||
                true
            )"

            case "$http_code" in
              2*|3*|401|403)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          update_openclaw() {
            local target_specification="${1:-latest}"
            local old_version
            local target_version
            local new_version
            local timestamp
            local state_backup
            local command_backup
            local ui_profile_backup

            ensure_directories

            old_version="$(get_installed_version)"
            target_version="$(resolve_version "$target_specification")"

            echo "当前版本：$old_version"
            echo "目标版本：$target_version"

            timestamp="$(date +%Y%m%d-%H%M%S)"
            state_backup="$BACKUP_DIR/openclaw-state-$timestamp.tar.gz"
            command_backup="$BACKUP_DIR/openclaw-command-$timestamp"
            ui_profile_backup="$BACKUP_DIR/openclaw-ui-profile-$timestamp"

            tar \
              --acls \
              --xattrs \
              -czf "$state_backup" \
              -C /root \
              .openclaw

            cp -a \
              "$GATEWAY_COMMAND_FILE" \
              "$command_backup" \
              2>/dev/null ||
              true

            cp -a \
              "$UI_PROFILE_FILE" \
              "$ui_profile_backup" \
              2>/dev/null ||
              true

            rollback_update() {
              set +e

              echo "更新失败，开始回滚"

              cleanup_test_process

              systemctl stop openclaw-gateway 2>/dev/null || true

              install_version "$old_version" || true

              rm -rf "$STATE_DIR"

              tar \
                --acls \
                --xattrs \
                -xzf "$state_backup" \
                -C /root ||
                true

              if [ -f "$command_backup" ]; then
                cp -a \
                  "$command_backup" \
                  "$GATEWAY_COMMAND_FILE"
              fi

              if [ -f "$ui_profile_backup" ]; then
                cp -a \
                  "$ui_profile_backup" \
                  "$UI_PROFILE_FILE"
              fi

              systemctl daemon-reload
              systemctl reset-failed openclaw-gateway 2>/dev/null || true
              systemctl restart openclaw-gateway 2>/dev/null || true

              sleep 8

              openclaw --version || true
              systemctl status openclaw-gateway --no-pager || true
            }

            if [ "$old_version" = "$target_version" ]; then
              echo "已经是目标版本"

              apply_full_config
              validate_config
              verify_permission_config

              systemctl daemon-reload
              systemctl reset-failed openclaw-gateway 2>/dev/null || true
              systemctl restart openclaw-gateway

              sleep 8
              refresh_info
              return 0
            fi

            systemctl stop openclaw-gateway 2>/dev/null || true

            apt-get update || true
            apt-get install -y --only-upgrade nodejs || true

            if ! node -e '
              const major = Number(process.versions.node.split(".")[0]);
              process.exit(major >= 24 ? 0 : 1);
            '; then
              rollback_update
              die "Node.js 版本不满足要求"
            fi

            if ! install_version "$target_version"; then
              rollback_update
              die "OpenClaw 新版本安装失败"
            fi

            new_version="$(get_installed_version)"

            if [ "$new_version" != "$target_version" ]; then
              rollback_update
              die "安装后的 OpenClaw 版本不正确"
            fi

            openclaw doctor --non-interactive || true

            apply_required_config

            if ! validate_config \
              >/tmp/openclaw-update-required-validation.log 2>&1
            then
              cat /tmp/openclaw-update-required-validation.log >&2 || true

              rollback_update
              die "新版本不接受必要配置"
            fi

            choose_ui_profile
            apply_full_config

            if ! validate_config \
              >/tmp/openclaw-update-final-validation.log 2>&1
            then
              cat /tmp/openclaw-update-final-validation.log >&2 || true

              rollback_update
              die "新版本配置校验失败"
            fi

            verify_permission_config

            if ! select_gateway_command; then
              rollback_update
              die "新版本 Gateway 前台命令不可用"
            fi

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true

            if ! systemctl restart openclaw-gateway; then
              rollback_update
              die "新版本 Gateway 启动失败"
            fi

            if ! wait_for_gateway; then
              journalctl \
                -u openclaw-gateway \
                -n 100 \
                --no-pager ||
                true

              rollback_update
              die "新版本 Gateway 没有监听 18789"
            fi

            if ! gateway_http_check; then
              rollback_update
              die "新版本 Gateway HTTP 检查失败"
            fi

            sleep 15

            if ! systemctl is-active --quiet openclaw-gateway; then
              rollback_update
              die "新版本 Gateway 启动后自动退出"
            fi

            if ! ss -lnt 2>/dev/null |
              grep -q ':18789'
            then
              rollback_update
              die "新版本 Gateway 运行后丢失端口监听"
            fi

            jq -n \
              --arg openclawVersion "$new_version" \
              --arg requestedVersion "$target_specification" \
              --arg nodeVersion "$(node --version)" \
              --arg npmVersion "$(npm --version)" \
              --arg updateTime "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              '{
                openclawVersion: $openclawVersion,
                requestedOpenclawVersion: $requestedVersion,
                nodeVersion: $nodeVersion,
                npmVersion: $npmVersion,
                distribution: "Ubuntu 24.04 LTS",
                codename: "noble",
                architecture: "amd64",
                updateTime: $updateTime
              }' >"$BUILD_INFO_FILE"

            chmod 644 "$BUILD_INFO_FILE"

            npm config set registry https://registry.npmmirror.com
            npm config set fund false
            npm config set audit false
            npm config set update-notifier false

            refresh_info

            echo "更新完成"
            echo "旧版本：$old_version"
            echo "新版本：$new_version"
            echo "备份：$state_backup"

            systemctl status openclaw-gateway --no-pager || true
          }

          require_root

          invoked_name="$(basename "$0")"

          if [ "$invoked_name" = "openclaw-lxc-manager" ]; then
            command_name="${1:-}"

            if [ "$#" -gt 0 ]; then
              shift
            fi
          else
            command_name="$invoked_name"
          fi

          case "$command_name" in
            firstboot)
              acquire_lock
              firstboot
              ;;

            build-init)
              acquire_lock
              build_init
              ;;

            template-reset)
              acquire_lock
              template_reset
              ;;

            validate)
              validate_config
              ;;

            select-gateway-command)
              acquire_lock
              select_gateway_command
              ;;

            smoke-test)
              acquire_lock
              smoke_selected_gateway
              ;;

            refresh-info)
              acquire_lock
              refresh_info
              ;;

            openclaw-api-setup|api-setup)
              acquire_lock
              api_setup
              ;;

            openclaw-info|info)
              show_info
              ;;

            openclaw-status|status)
              show_status
              ;;

            openclaw-logs|logs)
              exec journalctl -u openclaw-gateway -f
              ;;

            openclaw-restart|restart)
              acquire_lock
              restart_gateway
              ;;

            openclaw-repair-max-permissions|repair)
              acquire_lock
              repair_permissions
              ;;

            openclaw-plugins|plugins)
              show_plugins
              ;;

            openclaw-update|update)
              acquire_lock
              update_openclaw "${1:-latest}"
              ;;

            *)
              cat <<'USAGE'
          OpenClaw LXC manager

          Commands:
            firstboot
            build-init
            template-reset
            validate
            select-gateway-command
            smoke-test
            refresh-info
            api-setup
            info
            status
            logs
            restart
            plugins
            repair
            update [version]
          USAGE
              exit 1
              ;;
          esac
          """

          path.write_text(content, encoding="utf-8")
          PY_MANAGER

          chmod +x "$MANAGER_SCRIPT"
          bash -n "$MANAGER_SCRIPT"

          echo "=================================================="
          echo "[2/9] 生成 Ubuntu 24.04 容器安装脚本"
          echo "=================================================="

          export GENERATED_INSTALL_PATH="$INSTALL_SCRIPT"

          python3 - <<'PY_INSTALL'
          import os
          from pathlib import Path

          path = Path(os.environ["GENERATED_INSTALL_PATH"])

          content = r"""#!/usr/bin/env bash
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          OPENCLAW_VERSION="${OPENCLAW_VERSION:-latest}"

          echo "=================================================="
          echo "配置 Ubuntu 24.04 官方软件源"
          echo "=================================================="

          rm -f /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          cat >/etc/apt/sources.list <<'APT_SOURCES'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          APT_SOURCES

          apt-get update

          echo "=================================================="
          echo "安装系统软件"
          echo "=================================================="

          CORE_PACKAGES=(
            systemd
            systemd-sysv
            libpam-systemd
            dbus
            dbus-user-session
            openssh-server
            openssh-client
            sudo
            ifupdown
            iproute2
            iputils-ping
            net-tools
            procps
            psmisc
            lsof
            htop
            tmux
            screen
            nano
            vim
            less
            bash-completion
            ca-certificates
            curl
            wget
            git
            git-lfs
            rsync
            unzip
            zip
            tar
            gzip
            bzip2
            xz-utils
            zstd
            jq
            file
            openssl
            gnupg
            gpg-agent
            dirmngr
            apt-transport-https
            locales
            tzdata
            cron
            logrotate
            acl
            attr
            tree
            ncdu
            dnsutils
            traceroute
            mtr-tiny
            tcpdump
            netcat-openbsd
            socat
            iptables
            nftables
            util-linux
            python3
            python3-full
            python3-venv
            python3-pip
            pipx
            build-essential
            make
            gcc
            g++
            pkg-config
            cmake
            ninja-build
            autoconf
            automake
            libtool
            patch
            gettext
            strace
            gdb
            sqlite3
            libssl-dev
            libffi-dev
            libsqlite3-dev
            zlib1g-dev
            libbz2-dev
            libreadline-dev
            liblzma-dev
            libncurses-dev
            libgdbm-dev
            libnss3-dev
            uuid-dev
            ripgrep
            fd-find
            bat
            dos2unix
            moreutils
            fonts-liberation
            fonts-noto-cjk
            fonts-noto-color-emoji
          )

          apt-get install -y "${CORE_PACKAGES[@]}"

          OPTIONAL_PACKAGES=(
            iputils-tracepath
            sysstat
            iotop
            time
            command-not-found
            man-db
            manpages
            yq
            software-properties-common
            lsb-release
            bind9-dnsutils
            nmap
            iperf3
            whois
            telnet
            ethtool
          )

          for package_name in "${OPTIONAL_PACKAGES[@]}"; do
            apt-get install -y "$package_name" || true
          done

          ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
          ln -sf /usr/bin/batcat /usr/local/bin/bat 2>/dev/null || true

          echo "=================================================="
          echo "删除 DHCP 和 NetworkManager"
          echo "=================================================="

          for package_name in \
            isc-dhcp-client \
            isc-dhcp-common \
            dhcpcd \
            dhcpcd-base \
            udhcpc \
            network-manager
          do
            apt-get purge -y "$package_name" 2>/dev/null || true
          done

          apt-get autoremove -y || true

          echo "=================================================="
          echo "配置 locale 和时区"
          echo "=================================================="

          sed -i \
            's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' \
            /etc/locale.gen || true

          sed -i \
            's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' \
            /etc/locale.gen || true

          locale-gen || true

          cat >/etc/default/locale <<'LOCALE_FILE'
          LANG=en_US.UTF-8
          LC_ALL=en_US.UTF-8
          LOCALE_FILE

          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          printf 'Asia/Shanghai\n' >/etc/timezone

          echo "=================================================="
          echo "配置 Proxmox LXC 网络框架"
          echo "=================================================="

          mkdir -p /etc/network/interfaces.d

          cat >/etc/network/interfaces <<'NETWORK_FILE'
          auto lo
          iface lo inet loopback

          source /etc/network/interfaces.d/*
          NETWORK_FILE

          cat >/etc/network/interfaces.d/00-openclaw-note <<'NETWORK_NOTE'
          # Proxmox VE manages the eth0 address.
          # Configure IPv4/CIDR and gateway in the Proxmox VE container panel.
          NETWORK_NOTE

          systemctl unmask networking.service 2>/dev/null || true
          systemctl enable networking.service 2>/dev/null || true

          echo "=================================================="
          echo "禁用 IPv6"
          echo "=================================================="

          cat >/etc/sysctl.d/99-openclaw-disable-ipv6.conf <<'IPV6_SYSCTL'
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
          net.ipv6.conf.eth0.disable_ipv6 = 1

          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.eth0.accept_ra = 0

          net.ipv6.conf.all.autoconf = 0
          net.ipv6.conf.default.autoconf = 0
          net.ipv6.conf.eth0.autoconf = 0
          IPV6_SYSCTL

          cat >/etc/systemd/system/openclaw-disable-ipv6.service <<'IPV6_SERVICE'
          [Unit]
          Description=Disable IPv6 inside OpenClaw LXC
          DefaultDependencies=no
          After=local-fs.target
          Before=network-pre.target network.target networking.service openclaw-firstboot.service openclaw-gateway.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.eth0.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.all.accept_ra=0 || true; sysctl -w net.ipv6.conf.default.accept_ra=0 || true; sysctl -w net.ipv6.conf.eth0.accept_ra=0 || true; sysctl -w net.ipv6.conf.all.autoconf=0 || true; sysctl -w net.ipv6.conf.default.autoconf=0 || true; sysctl -w net.ipv6.conf.eth0.autoconf=0 || true; ip -6 addr flush dev eth0 2>/dev/null || true'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          IPV6_SERVICE

          systemctl enable openclaw-disable-ipv6.service

          echo "=================================================="
          echo "配置 SSH"
          echo "=================================================="

          mkdir -p /run/sshd
          mkdir -p /etc/ssh/sshd_config.d

          cat >/etc/ssh/sshd_config.d/99-openclaw-lxc.conf <<'SSH_CONFIG'
          PasswordAuthentication yes
          PermitRootLogin yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          SSH_CONFIG

          sed -ri \
            's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?KbdInteractiveAuthentication .*/KbdInteractiveAuthentication yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?UsePAM .*/UsePAM yes/' \
            /etc/ssh/sshd_config || true

          cat >/etc/systemd/system/regenerate-ssh-host-keys.service <<'SSH_KEYS_SERVICE'
          [Unit]
          Description=Generate SSH host keys
          ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
          Before=ssh.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ssh-keygen -A

          [Install]
          WantedBy=multi-user.target
          SSH_KEYS_SERVICE

          systemctl enable regenerate-ssh-host-keys.service

          systemctl enable ssh.service 2>/dev/null ||
            systemctl enable ssh 2>/dev/null ||
            true

          systemctl enable cron.service 2>/dev/null || true

          echo "=================================================="
          echo "安装 Node.js 24"
          echo "=================================================="

          curl -fsSL https://deb.nodesource.com/setup_24.x |
            bash -

          apt-get install -y nodejs

          node --version
          npm --version

          node -e '
            const major = Number(process.versions.node.split(".")[0]);

            if (major < 24) {
              console.error(
                `错误：需要 Node.js 24+，当前为 ${process.version}`
              );
              process.exit(1);
            }
          '

          npm config set fund false
          npm config set audit false
          npm config set update-notifier false
          npm config set registry https://registry.npmjs.org

          echo "=================================================="
          echo "解析并安装 OpenClaw"
          echo "=================================================="

          resolve_openclaw_version() {
            local requested_version="$1"
            local version_json

            if version_json="$(
              npm view "openclaw@${requested_version}" version \
                --json \
                --registry=https://registry.npmjs.org
            )"; then
              :
            else
              echo "官方 npm 源解析失败，切换 npmmirror"

              version_json="$(
                npm view "openclaw@${requested_version}" version \
                  --json \
                  --registry=https://registry.npmmirror.com
              )"
            fi

            printf '%s' "$version_json" |
              jq -er '
                if type == "array" then
                  .[-1]
                else
                  .
                end
                | select(type == "string" and length > 0)
              '
          }

          install_openclaw_version() {
            local version="$1"

            if npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmjs.org
            then
              return 0
            fi

            echo "官方 npm 源安装失败，切换 npmmirror"

            npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmmirror.com
          }

          get_installed_openclaw_version() {
            local npm_root

            npm_root="$(npm root -g)"

            node -p \
              "require('${npm_root}/openclaw/package.json').version"
          }

          RESOLVED_OPENCLAW_VERSION="$(
            resolve_openclaw_version "$OPENCLAW_VERSION"
          )"

          echo "请求版本：$OPENCLAW_VERSION"
          echo "实际版本：$RESOLVED_OPENCLAW_VERSION"

          install_openclaw_version "$RESOLVED_OPENCLAW_VERSION"

          command -v openclaw
          openclaw --version

          ACTUAL_OPENCLAW_VERSION="$(
            get_installed_openclaw_version
          )"

          if [ "$ACTUAL_OPENCLAW_VERSION" != "$RESOLVED_OPENCLAW_VERSION" ]; then
            echo "错误：OpenClaw 安装版本不一致"
            echo "预期：$RESOLVED_OPENCLAW_VERSION"
            echo "实际：$ACTUAL_OPENCLAW_VERSION"
            exit 1
          fi

          jq -n \
            --arg openclawVersion "$ACTUAL_OPENCLAW_VERSION" \
            --arg requestedVersion "$OPENCLAW_VERSION" \
            --arg nodeVersion "$(node --version)" \
            --arg npmVersion "$(npm --version)" \
            --arg buildTime "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              openclawVersion: $openclawVersion,
              requestedOpenclawVersion: $requestedVersion,
              nodeVersion: $nodeVersion,
              npmVersion: $npmVersion,
              distribution: "Ubuntu 24.04 LTS",
              codename: "noble",
              architecture: "amd64",
              buildTime: $buildTime
            }' >/etc/openclaw-build-info.json

          chmod 644 /etc/openclaw-build-info.json

          echo "=================================================="
          echo "配置 OpenClaw 环境"
          echo "=================================================="

          mkdir -p /root/.openclaw/workspace
          mkdir -p /root/.openclaw/agents/main/sessions
          mkdir -p /root/.openclaw/agents/main/agent
          mkdir -p /root/.openclaw-backups

          chown -R root:root /root/.openclaw

          chmod 700 /root/.openclaw
          chmod 700 /root/.openclaw-backups

          cat >/etc/openclaw-lxc.env <<'OPENCLAW_ENV'
          OPENCLAW_LXC=1
          OPENCLAW_DANGEROUS_FULL_TOOLS=1
          OPENCLAW_USER=root
          OPENCLAW_GROUP=root
          OPENCLAW_HOME=/root
          OPENCLAW_STATE_DIR=/root/.openclaw
          OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
          OPENCLAW_SERVICE_REPAIR_POLICY=external
          OPENCLAW_NO_RESPAWN=1
          NODE_COMPILE_CACHE=/var/tmp/openclaw-compile-cache
          OPENCLAW_NET_IFACE=eth0
          OPENCLAW_GATEWAY_PORT=18789
          OPENCLAW_GATEWAY_BIND=lan
          OPENCLAW_HIDE_BANNER=1
          OPENCLAW_ENV

          chmod 644 /etc/openclaw-lxc.env
          chmod 755 /usr/local/sbin/openclaw-lxc-manager

          echo "=================================================="
          echo "写入 Gateway 启动器"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-gateway-launch <<'GATEWAY_LAUNCHER'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          COMMAND_FILE="/etc/openclaw-gateway-command"
          PORT="${OPENCLAW_GATEWAY_PORT:-18789}"

          export HOME="/root"
          export OPENCLAW_HOME="/root"
          export OPENCLAW_STATE_DIR="/root/.openclaw"
          export OPENCLAW_CONFIG_PATH="/root/.openclaw/openclaw.json"
          export OPENCLAW_SERVICE_REPAIR_POLICY="external"
          export OPENCLAW_NO_RESPAWN="1"
          export OPENCLAW_DANGEROUS_FULL_TOOLS="1"
          export OPENCLAW_HIDE_BANNER="1"

          if [ ! -s "$COMMAND_FILE" ]; then
            echo "错误：Gateway 命令模式文件不存在"
            exit 1
          fi

          COMMAND_MODE="$(
            tr -d '[:space:]' <"$COMMAND_FILE"
          )"

          case "$COMMAND_MODE" in
            gateway)
              exec openclaw gateway --port "$PORT"
              ;;

            gateway-run)
              exec openclaw gateway run --port "$PORT"
              ;;

            *)
              echo "错误：未知 Gateway 命令模式：$COMMAND_MODE"
              exit 1
              ;;
          esac
          GATEWAY_LAUNCHER

          chmod 755 /usr/local/sbin/openclaw-gateway-launch

          echo "=================================================="
          echo "配置 systemd 服务"
          echo "=================================================="

          cat >/etc/systemd/system/openclaw-firstboot.service <<'FIRSTBOOT_SERVICE'
          [Unit]
          Description=Initialize OpenClaw LXC configuration
          After=local-fs.target network.target networking.service openclaw-disable-ipv6.service
          Wants=network.target openclaw-disable-ipv6.service
          Before=openclaw-gateway.service

          [Service]
          Type=oneshot
          User=root
          Group=root
          WorkingDirectory=/root

          EnvironmentFile=-/etc/openclaw-lxc.env

          Environment=HOME=/root
          Environment=OPENCLAW_HOME=/root
          Environment=OPENCLAW_STATE_DIR=/root/.openclaw
          Environment=OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          ExecStart=/usr/local/sbin/openclaw-lxc-manager firstboot
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          FIRSTBOOT_SERVICE

          cat >/etc/systemd/system/openclaw-gateway.service <<'GATEWAY_SERVICE'
          [Unit]
          Description=OpenClaw Gateway
          Requires=openclaw-firstboot.service
          After=local-fs.target network.target networking.service openclaw-disable-ipv6.service openclaw-firstboot.service
          Wants=network.target openclaw-disable-ipv6.service
          StartLimitIntervalSec=120
          StartLimitBurst=5

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/root

          EnvironmentFile=-/etc/openclaw-lxc.env
          EnvironmentFile=-/root/.openclaw/.env

          Environment=HOME=/root
          Environment=OPENCLAW_HOME=/root
          Environment=OPENCLAW_STATE_DIR=/root/.openclaw
          Environment=OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
          Environment=OPENCLAW_SERVICE_REPAIR_POLICY=external
          Environment=OPENCLAW_NO_RESPAWN=1
          Environment=NODE_COMPILE_CACHE=/var/tmp/openclaw-compile-cache
          Environment=OPENCLAW_DANGEROUS_FULL_TOOLS=1
          Environment=OPENCLAW_HIDE_BANNER=1
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          ExecStart=/usr/local/sbin/openclaw-gateway-launch

          # OpenClaw 的完整进程重启会以成功状态退出。必须由 systemd
          # 无条件重新拉起，否则 gateway tool restart 后服务会永久停止。
          Restart=always
          RestartSec=5

          # EX_CONFIG：配置无效或端口已被健康 Gateway 占用时停止重试，
          # 防止 Restart=always 形成永久崩溃循环。
          RestartPreventExitStatus=78

          TimeoutStartSec=120
          TimeoutStopSec=30

          SuccessExitStatus=0 143
          KillSignal=SIGTERM
          KillMode=control-group
          OOMPolicy=continue
          UMask=0077

          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          GATEWAY_SERVICE

          systemctl enable openclaw-firstboot.service
          systemctl enable openclaw-gateway.service

          echo "=================================================="
          echo "创建管理命令"
          echo "=================================================="

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-api-setup

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-info

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-status

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-logs

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-restart

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-update

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-repair-max-permissions

          ln -sf \
            /usr/local/sbin/openclaw-lxc-manager \
            /usr/local/bin/openclaw-plugins

          echo "=================================================="
          echo "配置登录信息"
          echo "=================================================="

          cat >/etc/profile.d/openclaw-info.sh <<'PROFILE_SCRIPT'
          #!/usr/bin/env bash

          if [ "$(id -u)" = "0" ] &&
            [ -z "${OPENCLAW_INFO_SHOWN:-}" ]
          then
            export OPENCLAW_INFO_SHOWN=1

            if [ -x /usr/local/bin/openclaw-info ]; then
              /usr/local/bin/openclaw-info 2>/dev/null || true
            fi
          fi
          PROFILE_SCRIPT

          chmod 755 /etc/profile.d/openclaw-info.sh

          cat >>/root/.bashrc <<'BASHRC_BLOCK'

          # OpenClaw login information
          if [ "$(id -u)" = "0" ] &&
