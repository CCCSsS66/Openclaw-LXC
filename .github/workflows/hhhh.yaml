name: Build OpenClaw LXC Ubuntu 24.04 LTS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "模板版本号"
        required: true
        default: "auto"
      openclaw_version:
        description: "OpenClaw 版本，例如 latest 或具体版本号"
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: openclaw-lxc-ubuntu2404-${{ inputs.version }}-${{ inputs.openclaw_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            ubuntu-keyring \
            ca-certificates \
            curl \
            wget \
            gnupg \
            gzip \
            xz-utils \
            zstd \
            tar \
            jq \
            file \
            openssl \
            coreutils \
            util-linux \
            acl \
            attr \
            gh

          gh --version
          debootstrap --version

      - name: Build and publish OpenClaw Ubuntu LXC template
        shell: bash
        run: |
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          VERSION="${INPUT_VERSION:-auto}"
          OPENCLAW_VERSION="${INPUT_OPENCLAW_VERSION:-latest}"

          if [ "$VERSION" = "auto" ]; then
            VERSION="$(date -u +'%Y.%m.%d-%H%M')"
          fi

          if ! printf '%s\n' "$VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "错误：version 只能包含字母、数字、点、下划线和横线"
            exit 1
          fi

          if [ -z "$OPENCLAW_VERSION" ]; then
            echo "错误：OpenClaw 版本不能为空"
            exit 1
          fi

          IMAGE_PREFIX="openclaw-lxc-ubuntu2404"
          IMAGE_NAME="${IMAGE_PREFIX}-${VERSION}.tar.gz"

          WORK_DIR="$PWD/work"
          ROOTFS="$WORK_DIR/rootfs"
          DIST_DIR="$PWD/dist"

          mkdir -p "$WORK_DIR"
          mkdir -p "$DIST_DIR"

          cleanup_mounts() {
            set +e

            if [ -n "${ROOTFS:-}" ] && [ -d "$ROOTFS" ]; then
              sudo umount -R -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/sys" 2>/dev/null || true

              sudo umount -lf "$ROOTFS/dev/pts" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            fi
          }

          trap cleanup_mounts EXIT INT TERM

          echo "=================================================="
          echo "[1/8] 创建 Ubuntu 24.04 LTS rootfs"
          echo "=================================================="

          sudo rm -rf "$ROOTFS"
          sudo mkdir -p "$ROOTFS"

          sudo debootstrap \
            --arch=amd64 \
            --components=main,restricted,universe,multiverse \
            noble \
            "$ROOTFS" \
            http://archive.ubuntu.com/ubuntu

          echo "=================================================="
          echo "[2/8] 挂载 chroot 环境"
          echo "=================================================="

          sudo mount -t proc proc "$ROOTFS/proc"

          sudo mount --rbind /sys "$ROOTFS/sys"
          sudo mount --make-rslave "$ROOTFS/sys"

          sudo mount --rbind /dev "$ROOTFS/dev"
          sudo mount --make-rslave "$ROOTFS/dev"

          sudo cp -L /etc/resolv.conf "$ROOTFS/etc/resolv.conf"

          printf 'OpenClaw\n' |
            sudo tee "$ROOTFS/etc/hostname" >/dev/null

          sudo tee "$ROOTFS/etc/hosts" >/dev/null <<'HOSTS_FILE'
          127.0.0.1 localhost
          127.0.1.1 OpenClaw

          ::1 localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters
          HOSTS_FILE

          echo "=================================================="
          echo "[3/8] 写入 Ubuntu 容器安装脚本"
          echo "=================================================="

          sudo tee "$ROOTFS/tmp/install-inside.sh" >/dev/null <<'INSIDE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          OPENCLAW_VERSION="${OPENCLAW_VERSION:-latest}"

          OPENCLAW_USER="root"
          OPENCLAW_GROUP="root"
          OPENCLAW_HOME="/root"
          OPENCLAW_STATE_DIR="/root/.openclaw"
          OPENCLAW_GATEWAY_PORT="18789"
          OPENCLAW_GATEWAY_BIND="lan"
          OPENCLAW_NET_IFACE="eth0"

          echo "=================================================="
          echo "配置 Ubuntu 24.04 LTS 官方软件源"
          echo "=================================================="

          rm -f /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          cat >/etc/apt/sources.list <<'APT_SOURCES'
          deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
          APT_SOURCES

          apt-get update

          echo "=================================================="
          echo "安装基础系统组件"
          echo "=================================================="

          CORE_PACKAGES=(
            systemd
            systemd-sysv
            libpam-systemd
            dbus
            dbus-user-session
            openssh-server
            openssh-client
            sudo
            ifupdown
            iproute2
            iputils-ping
            net-tools
            procps
            psmisc
            lsof
            htop
            tmux
            screen
            nano
            vim
            less
            bash-completion
            ca-certificates
            curl
            wget
            git
            git-lfs
            rsync
            unzip
            zip
            tar
            gzip
            bzip2
            xz-utils
            zstd
            jq
            file
            openssl
            gnupg
            gpg-agent
            dirmngr
            apt-transport-https
            locales
            tzdata
            cron
            logrotate
            acl
            attr
            tree
            ncdu
            dnsutils
            traceroute
            mtr-tiny
            tcpdump
            netcat-openbsd
            socat
            iptables
            nftables
            util-linux
            python3
            python3-full
            python3-venv
            python3-pip
            pipx
            build-essential
            make
            gcc
            g++
            pkg-config
            cmake
            ninja-build
            autoconf
            automake
            libtool
            patch
            gettext
            strace
            gdb
            sqlite3
            libssl-dev
            libffi-dev
            libsqlite3-dev
            zlib1g-dev
            libbz2-dev
            libreadline-dev
            liblzma-dev
            libncurses-dev
            libgdbm-dev
            libnss3-dev
            uuid-dev
            ripgrep
            fd-find
            bat
            dos2unix
            moreutils
            fonts-liberation
            fonts-noto-cjk
            fonts-noto-color-emoji
          )

          apt-get install -y "${CORE_PACKAGES[@]}"

          OPTIONAL_PACKAGES=(
            iputils-tracepath
            sysstat
            iotop
            time
            command-not-found
            man-db
            manpages
            yq
            software-properties-common
            lsb-release
            bind9-dnsutils
            nmap
            iperf3
            whois
            telnet
            ethtool
          )

          for pkg in "${OPTIONAL_PACKAGES[@]}"; do
            apt-get install -y "$pkg" || true
          done

          ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
          ln -sf /usr/bin/batcat /usr/local/bin/bat 2>/dev/null || true

          echo "=================================================="
          echo "删除 DHCP 和 NetworkManager"
          echo "=================================================="

          for pkg in \
            isc-dhcp-client \
            isc-dhcp-common \
            dhcpcd \
            dhcpcd-base \
            udhcpc \
            network-manager
          do
            apt-get purge -y "$pkg" 2>/dev/null || true
          done

          apt-get autoremove -y || true

          echo "=================================================="
          echo "配置 locale 和时区"
          echo "=================================================="

          sed -i \
            's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' \
            /etc/locale.gen || true

          sed -i \
            's/^# *zh_CN.UTF-8 UTF-8/zh_CN.UTF-8 UTF-8/' \
            /etc/locale.gen || true

          locale-gen || true

          cat >/etc/default/locale <<'LOCALE_CONFIG'
          LANG=en_US.UTF-8
          LC_ALL=en_US.UTF-8
          LOCALE_CONFIG

          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          printf 'Asia/Shanghai\n' >/etc/timezone

          echo "=================================================="
          echo "配置 Proxmox LXC 网络框架"
          echo "=================================================="

          mkdir -p /etc/network/interfaces.d

          cat >/etc/network/interfaces <<'NETWORK_CONFIG'
          auto lo
          iface lo inet loopback

          source /etc/network/interfaces.d/*
          NETWORK_CONFIG

          cat >/etc/network/interfaces.d/00-openclaw-note <<'NETWORK_NOTE'
          # The Proxmox VE LXC setup process manages eth0.
          #
          # Configure the IPv4 address, CIDR and gateway in Proxmox VE.
          # DHCP is not preconfigured in this template.
          NETWORK_NOTE

          systemctl unmask networking.service 2>/dev/null || true
          systemctl enable networking.service 2>/dev/null || true

          echo "=================================================="
          echo "禁用 IPv6"
          echo "=================================================="

          cat >/etc/sysctl.d/99-openclaw-disable-ipv6.conf <<'IPV6_SYSCTL'
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
          net.ipv6.conf.eth0.disable_ipv6 = 1

          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.eth0.accept_ra = 0

          net.ipv6.conf.all.autoconf = 0
          net.ipv6.conf.default.autoconf = 0
          net.ipv6.conf.eth0.autoconf = 0
          IPV6_SYSCTL

          cat >/etc/systemd/system/openclaw-disable-ipv6.service <<'IPV6_SERVICE'
          [Unit]
          Description=Disable IPv6 inside OpenClaw LXC
          DefaultDependencies=no
          After=local-fs.target
          Before=network-pre.target network.target networking.service openclaw-gateway.service

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c 'sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.default.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.lo.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.eth0.disable_ipv6=1 || true; sysctl -w net.ipv6.conf.all.accept_ra=0 || true; sysctl -w net.ipv6.conf.default.accept_ra=0 || true; sysctl -w net.ipv6.conf.eth0.accept_ra=0 || true; sysctl -w net.ipv6.conf.all.autoconf=0 || true; sysctl -w net.ipv6.conf.default.autoconf=0 || true; sysctl -w net.ipv6.conf.eth0.autoconf=0 || true; ip -6 addr flush dev eth0 2>/dev/null || true'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          IPV6_SERVICE

          systemctl enable openclaw-disable-ipv6.service

          echo "=================================================="
          echo "配置 SSH"
          echo "=================================================="

          mkdir -p /run/sshd
          mkdir -p /etc/ssh/sshd_config.d

          cat >/etc/ssh/sshd_config.d/99-openclaw-lxc.conf <<'SSH_CONFIG'
          PasswordAuthentication yes
          PermitRootLogin yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          SSH_CONFIG

          sed -ri \
            's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?PermitRootLogin .*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?KbdInteractiveAuthentication .*/KbdInteractiveAuthentication yes/' \
            /etc/ssh/sshd_config || true

          sed -ri \
            's/^#?UsePAM .*/UsePAM yes/' \
            /etc/ssh/sshd_config || true

          cat >/etc/systemd/system/regenerate-ssh-host-keys.service <<'SSH_KEYS_SERVICE'
          [Unit]
          Description=Generate SSH host keys
          ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
          Before=ssh.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ssh-keygen -A

          [Install]
          WantedBy=multi-user.target
          SSH_KEYS_SERVICE

          systemctl enable regenerate-ssh-host-keys.service

          systemctl enable ssh.service 2>/dev/null ||
            systemctl enable ssh 2>/dev/null ||
            true

          systemctl enable cron.service 2>/dev/null || true

          echo "=================================================="
          echo "安装 Node.js 24"
          echo "=================================================="

          curl -fsSL https://deb.nodesource.com/setup_24.x |
            bash -

          apt-get install -y nodejs

          node --version
          npm --version

          node -e '
            const major = Number(process.versions.node.split(".")[0]);

            if (major < 24) {
              console.error(
                `错误：模板要求 Node.js 24+，当前为 ${process.version}`
              );
              process.exit(1);
            }
          '

          npm config set fund false
          npm config set audit false
          npm config set update-notifier false
          npm config set engine-strict true
          npm config set registry https://registry.npmjs.org

          echo "=================================================="
          echo "解析 OpenClaw 版本"
          echo "=================================================="

          resolve_openclaw_version() {
            local requested_version="$1"
            local result

            if result="$(
              npm view "openclaw@${requested_version}" version \
                --json \
                --registry=https://registry.npmjs.org
            )"; then
              :
            else
              echo "官方 npm 源解析失败，切换 npmmirror..."

              result="$(
                npm view "openclaw@${requested_version}" version \
                  --json \
                  --registry=https://registry.npmmirror.com
              )"
            fi

            printf '%s' "$result" |
              jq -er '
                if type == "array" then
                  .[-1]
                else
                  .
                end
                | select(type == "string" and length > 0)
              '
          }

          RESOLVED_OPENCLAW_VERSION="$(
            resolve_openclaw_version "$OPENCLAW_VERSION"
          )"

          echo "请求版本：$OPENCLAW_VERSION"
          echo "实际版本：$RESOLVED_OPENCLAW_VERSION"

          echo "=================================================="
          echo "安装 OpenClaw"
          echo "=================================================="

          install_openclaw_version() {
            local version="$1"

            if npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmjs.org
            then
              return 0
            fi

            echo "官方 npm 源安装失败，切换 npmmirror..."

            npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmmirror.com
          }

          get_installed_openclaw_version() {
            local npm_root

            npm_root="$(npm root -g)"

            node -p \
              "require('${npm_root}/openclaw/package.json').version"
          }

          install_openclaw_version "$RESOLVED_OPENCLAW_VERSION"

          command -v openclaw
          openclaw --version

          ACTUAL_OPENCLAW_VERSION="$(
            get_installed_openclaw_version
          )"

          if [ "$ACTUAL_OPENCLAW_VERSION" != "$RESOLVED_OPENCLAW_VERSION" ]; then
            echo "错误：安装后的 OpenClaw 版本不一致"
            echo "预期：$RESOLVED_OPENCLAW_VERSION"
            echo "实际：$ACTUAL_OPENCLAW_VERSION"
            exit 1
          fi

          jq -n \
            --arg openclawVersion "$ACTUAL_OPENCLAW_VERSION" \
            --arg requestedVersion "$OPENCLAW_VERSION" \
            --arg nodeVersion "$(node --version)" \
            --arg npmVersion "$(npm --version)" \
            --arg buildTime "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              openclawVersion: $openclawVersion,
              requestedOpenclawVersion: $requestedVersion,
              nodeVersion: $nodeVersion,
              npmVersion: $npmVersion,
              distribution: "Ubuntu 24.04 LTS",
              codename: "noble",
              architecture: "amd64",
              buildTime: $buildTime
            }' >/etc/openclaw-build-info.json

          chmod 644 /etc/openclaw-build-info.json

          echo "=================================================="
          echo "切换 Ubuntu 和 npm 中国镜像"
          echo "=================================================="

          rm -f /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true

          cat >/etc/apt/sources.list <<'TUNA_APT_SOURCES'
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ noble main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ noble-updates main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ noble-backports main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ noble-security main restricted universe multiverse
          TUNA_APT_SOURCES

          if ! apt-get update; then
            cat >/etc/apt/sources.list <<'USTC_APT_SOURCES'
          deb https://mirrors.ustc.edu.cn/ubuntu/ noble main restricted universe multiverse
          deb https://mirrors.ustc.edu.cn/ubuntu/ noble-updates main restricted universe multiverse
          deb https://mirrors.ustc.edu.cn/ubuntu/ noble-backports main restricted universe multiverse
          deb https://mirrors.ustc.edu.cn/ubuntu/ noble-security main restricted universe multiverse
          USTC_APT_SOURCES

            apt-get update || true
          fi

          npm config set registry https://registry.npmmirror.com
          npm config set fund false
          npm config set audit false
          npm config set update-notifier false
          npm config set engine-strict true

          echo "=================================================="
          echo "创建 OpenClaw 目录"
          echo "=================================================="

          mkdir -p /root/.openclaw/workspace
          mkdir -p /root/.openclaw/agents/main/sessions
          mkdir -p /root/.openclaw/agents/main/agent
          mkdir -p /root/.openclaw-backups

          chown -R root:root /root/.openclaw
          chmod 700 /root/.openclaw
          chmod 700 /root/.openclaw-backups

          cat >/etc/openclaw-lxc.env <<'OPENCLAW_ENV'
          OPENCLAW_LXC=1
          OPENCLAW_DANGEROUS_FULL_TOOLS=1
          OPENCLAW_USER=root
          OPENCLAW_GROUP=root
          OPENCLAW_HOME=/root
          OPENCLAW_STATE_DIR=/root/.openclaw
          OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
          OPENCLAW_SERVICE_REPAIR_POLICY=external
          OPENCLAW_NET_IFACE=eth0
          OPENCLAW_GATEWAY_PORT=18789
          OPENCLAW_GATEWAY_BIND=lan
          OPENCLAW_HIDE_BANNER=1
          OPENCLAW_ENV

          chmod 644 /etc/openclaw-lxc.env

          echo "=================================================="
          echo "写入完整权限配置脚本"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-apply-full-config <<'APPLY_FULL_CONFIG'
          #!/usr/bin/env bash
          set -euo pipefail

          STATE_DIR="/root/.openclaw"
          CONFIG_FILE="$STATE_DIR/openclaw.json"
          PORT="18789"
          BIND="lan"

          mkdir -p /run
          exec 9>/run/openclaw-apply-full-config.lock
          flock -x 9

          mkdir -p "$STATE_DIR/workspace"
          mkdir -p "$STATE_DIR/agents/main/sessions"
          mkdir -p "$STATE_DIR/agents/main/agent"

          chmod 700 "$STATE_DIR"

          if [ ! -s "$CONFIG_FILE" ] ||
            ! jq empty "$CONFIG_FILE" >/dev/null 2>&1
          then
            printf '{}\n' >"$CONFIG_FILE"
          fi

          TOKEN="$(
            jq -r '.gateway.auth.token // empty' \
              "$CONFIG_FILE" 2>/dev/null ||
              true
          )"

          if [ -z "$TOKEN" ] ||
            [ "$TOKEN" = "GENERATE_ON_FIRST_BOOT" ] ||
            [ "${#TOKEN}" -lt 16 ]
          then
            TOKEN="$(openssl rand -hex 32)"
          fi

          BASE_CONFIG="$(mktemp)"
          REQUIRED_CONFIG="$(mktemp)"

          cp "$CONFIG_FILE" "$BASE_CONFIG"

          jq \
            --arg bind "$BIND" \
            --arg token "$TOKEN" \
            --argjson port "$PORT" \
            '
            .gateway = (
              if (.gateway? | type) == "object" then
                .gateway
              else
                {}
              end
            ) |

            .gateway.mode = "local" |
            .gateway.port = $port |
            .gateway.bind = $bind |

            .gateway.auth = (
              if (.gateway.auth? | type) == "object" then
                .gateway.auth
              else
                {}
              end
            ) |

            .gateway.auth.mode = "token" |
            .gateway.auth.token = $token |

            .tools = (
              if (.tools? | type) == "object" then
                .tools
              else
                {}
              end
            ) |

            .tools.profile = "full" |

            .tools.elevated = (
              if (.tools.elevated? | type) == "object" then
                .tools.elevated
              else
                {}
              end
            ) |

            .tools.elevated.enabled = true |
            del(.tools.elevated.allowFrom) |

            .tools.exec = (
              if (.tools.exec? | type) == "object" then
                .tools.exec
              else
                {}
              end
            ) |

            .tools.exec.security = "full" |
            .tools.exec.ask = "off" |
            .tools.exec.host = "gateway" |

            del(.tools.allow) |
            del(.tools.deny) |

            .agents = (
              if (.agents? | type) == "object" then
                .agents
              else
                {}
              end
            ) |

            .agents.defaults = (
              if (.agents.defaults? | type) == "object" then
                .agents.defaults
              else
                {}
              end
            ) |

            del(.agents.defaults.tools) |

            .agents.defaults.sandbox = (
              if (.agents.defaults.sandbox? | type) == "object" then
                .agents.defaults.sandbox
              else
                {}
              end
            ) |

            .agents.defaults.sandbox.mode = "off"
            ' "$CONFIG_FILE" >"$REQUIRED_CONFIG"

          mv "$REQUIRED_CONFIG" "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"

          if ! HOME=/root \
            OPENCLAW_HOME=/root \
            OPENCLAW_STATE_DIR=/root/.openclaw \
            OPENCLAW_CONFIG_PATH="$CONFIG_FILE" \
            openclaw config validate \
              >/tmp/openclaw-required-config.log 2>&1
          then
            echo "错误：当前 OpenClaw 版本不接受必要的完整权限配置。"
            cat /tmp/openclaw-required-config.log || true

            cp "$BASE_CONFIG" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            rm -f "$BASE_CONFIG"
            exit 1
          fi

          REQUIRED_VALID_CONFIG="$(mktemp)"
          cp "$CONFIG_FILE" "$REQUIRED_VALID_CONFIG"

          UI_FULL_CONFIG="$(mktemp)"

          jq '
            .gateway.controlUi = (
              if (.gateway.controlUi? | type) == "object" then
                .gateway.controlUi
              else
                {}
              end
            ) |

            .gateway.controlUi.enabled = true |
            .gateway.controlUi.allowedOrigins = [
              "http://127.0.0.1:18789",
              "http://localhost:18789"
            ] |
            .gateway.controlUi.allowInsecureAuth = true |
            .gateway.controlUi.dangerouslyDisableDeviceAuth = true |
            .gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback = true
            ' "$CONFIG_FILE" >"$UI_FULL_CONFIG"

          mv "$UI_FULL_CONFIG" "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"

          if HOME=/root \
            OPENCLAW_HOME=/root \
            OPENCLAW_STATE_DIR=/root/.openclaw \
            OPENCLAW_CONFIG_PATH="$CONFIG_FILE" \
            openclaw config validate \
              >/tmp/openclaw-ui-full-config.log 2>&1
          then
            printf 'full\n' >/etc/openclaw-control-ui-profile
          else
            cp "$REQUIRED_VALID_CONFIG" "$CONFIG_FILE"

            UI_BASIC_CONFIG="$(mktemp)"

            jq '
              .gateway.controlUi = (
                if (.gateway.controlUi? | type) == "object" then
                  .gateway.controlUi
                else
                  {}
                end
              ) |

              .gateway.controlUi.enabled = true |
              .gateway.controlUi.allowedOrigins = [
                "http://127.0.0.1:18789",
                "http://localhost:18789"
              ]
              ' "$CONFIG_FILE" >"$UI_BASIC_CONFIG"

            mv "$UI_BASIC_CONFIG" "$CONFIG_FILE"
            chmod 600 "$CONFIG_FILE"

            if HOME=/root \
              OPENCLAW_HOME=/root \
              OPENCLAW_STATE_DIR=/root/.openclaw \
              OPENCLAW_CONFIG_PATH="$CONFIG_FILE" \
              openclaw config validate \
                >/tmp/openclaw-ui-basic-config.log 2>&1
            then
              printf 'basic\n' >/etc/openclaw-control-ui-profile
            else
              cp "$REQUIRED_VALID_CONFIG" "$CONFIG_FILE"
              chmod 600 "$CONFIG_FILE"
              printf 'default\n' >/etc/openclaw-control-ui-profile
            fi
          fi

          rm -f "$BASE_CONFIG"
          rm -f "$REQUIRED_VALID_CONFIG"

          if ! HOME=/root \
            OPENCLAW_HOME=/root \
            OPENCLAW_STATE_DIR=/root/.openclaw \
            OPENCLAW_CONFIG_PATH="$CONFIG_FILE" \
            openclaw config validate \
              >/tmp/openclaw-final-config.log 2>&1
          then
            echo "错误：最终 OpenClaw 配置校验失败。"
            cat /tmp/openclaw-final-config.log || true
            exit 1
          fi

          if ! jq -e '
            .gateway.mode == "local" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .gateway.auth.mode == "token" and
            (.gateway.auth.token | type) == "string" and
            (.gateway.auth.token | length) >= 16 and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.security == "full" and
            .tools.exec.ask == "off" and
            .tools.exec.host == "gateway" and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.allow? | not) and
            (.tools.deny? | not)
          ' "$CONFIG_FILE" >/dev/null
          then
            echo "错误：配置未达到完整权限要求。"
            jq '.' "$CONFIG_FILE"
            exit 1
          fi

          chown -R root:root "$STATE_DIR"
          chmod 700 "$STATE_DIR"
          chmod 600 "$CONFIG_FILE"
          APPLY_FULL_CONFIG

          chmod +x /usr/local/sbin/openclaw-apply-full-config

          echo "=================================================="
          echo "写入轻量运行准备脚本"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-prepare-runtime <<'PREPARE_RUNTIME'
          #!/usr/bin/env bash
          set -euo pipefail

          STATE_DIR="/root/.openclaw"
          CONFIG_FILE="$STATE_DIR/openclaw.json"
          TOKEN_FILE="$STATE_DIR/.env"
          PORT="18789"
          IFACE="eth0"

          mkdir -p /run
          exec 9>/run/openclaw-prepare-runtime.lock
          flock -x 9

          mkdir -p "$STATE_DIR/workspace"
          mkdir -p "$STATE_DIR/agents/main/sessions"
          mkdir -p "$STATE_DIR/agents/main/agent"

          chmod 700 "$STATE_DIR"

          if [ ! -s "$CONFIG_FILE" ] ||
            ! jq empty "$CONFIG_FILE" >/dev/null 2>&1
          then
            echo "错误：OpenClaw 配置文件不存在或不是有效 JSON"
            exit 1
          fi

          TOKEN="$(
            jq -r '.gateway.auth.token // empty' \
              "$CONFIG_FILE" 2>/dev/null ||
              true
          )"

          if [ -z "$TOKEN" ] ||
            [ "$TOKEN" = "GENERATE_ON_FIRST_BOOT" ] ||
            [ "${#TOKEN}" -lt 16 ]
          then
            TOKEN="$(openssl rand -hex 32)"
          fi

          IPV4="$(
            ip -o -4 addr show \
              dev "$IFACE" \
              scope global \
              2>/dev/null |
              awk '{print $4}' |
              cut -d/ -f1 |
              head -n1 ||
              true
          )"

          HOST_NAME="$(
            hostname 2>/dev/null ||
              printf 'OpenClaw'
          )"

          ORIGINS="$(
            jq -nc \
              --arg port "$PORT" \
              --arg ip "$IPV4" \
              --arg hostname "$HOST_NAME" \
              '
              [
                "http://127.0.0.1:" + $port,
                "http://localhost:" + $port,
                "http://" + $hostname + ":" + $port
              ]
              +
              (
                if $ip == "" then
                  []
                else
                  ["http://" + $ip + ":" + $port]
                end
              )
              | unique
              '
          )"

          CONFIG_TEMP="$(mktemp)"

          jq \
            --arg token "$TOKEN" \
            --argjson origins "$ORIGINS" \
            '
            .gateway.auth.mode = "token" |
            .gateway.auth.token = $token |

            if (
              (.gateway.controlUi? | type) == "object" and
              (.gateway.controlUi.allowedOrigins? | type) == "array"
            ) then
              .gateway.controlUi.allowedOrigins = $origins
            else
              .
            end
            ' "$CONFIG_FILE" >"$CONFIG_TEMP"

          mv "$CONFIG_TEMP" "$CONFIG_FILE"

          printf 'OPENCLAW_GATEWAY_TOKEN=%s\n' "$TOKEN" >"$TOKEN_FILE"

          chown -R root:root "$STATE_DIR"
          chmod 700 "$STATE_DIR"
          chmod 600 "$CONFIG_FILE" "$TOKEN_FILE"
          PREPARE_RUNTIME

          chmod +x /usr/local/sbin/openclaw-prepare-runtime

          echo "=================================================="
          echo "写入 Gateway 命令检测脚本"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-detect-gateway-command <<'DETECT_GATEWAY'
          #!/usr/bin/env bash
          set -euo pipefail

          COMMAND_FILE="/etc/openclaw-gateway-command"

          if openclaw gateway run --help >/dev/null 2>&1; then
            printf 'run\n' >"$COMMAND_FILE"
          elif openclaw gateway --help >/dev/null 2>&1; then
            printf 'legacy\n' >"$COMMAND_FILE"
          else
            echo "错误：当前 OpenClaw 没有可用的 Gateway 前台运行命令"
            exit 1
          fi

          chmod 644 "$COMMAND_FILE"

          echo "Gateway 命令模式：$(cat "$COMMAND_FILE")"
          DETECT_GATEWAY

          chmod +x /usr/local/sbin/openclaw-detect-gateway-command

          echo "=================================================="
          echo "写入 Gateway 前台启动脚本"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-gateway-run <<'GATEWAY_RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail

          PORT="${OPENCLAW_GATEWAY_PORT:-18789}"
          COMMAND_FILE="/etc/openclaw-gateway-command"

          export HOME="/root"
          export OPENCLAW_HOME="/root"
          export OPENCLAW_STATE_DIR="/root/.openclaw"
          export OPENCLAW_CONFIG_PATH="/root/.openclaw/openclaw.json"
          export OPENCLAW_SERVICE_REPAIR_POLICY="external"
          export OPENCLAW_DANGEROUS_FULL_TOOLS="1"
          export OPENCLAW_HIDE_BANNER="1"

          if [ ! -s "$COMMAND_FILE" ]; then
            echo "错误：Gateway 命令模式文件不存在"
            exit 78
          fi

          COMMAND_MODE="$(
            tr -d '[:space:]' <"$COMMAND_FILE"
          )"

          case "$COMMAND_MODE" in
            run)
              exec openclaw gateway run --port "$PORT"
              ;;
            legacy)
              exec openclaw gateway --port "$PORT"
              ;;
            *)
              echo "错误：未知 Gateway 命令模式：$COMMAND_MODE"
              exit 78
              ;;
          esac
          GATEWAY_RUNNER

          chmod +x /usr/local/sbin/openclaw-gateway-run

          echo "=================================================="
          echo "写入信息生成脚本"
          echo "=================================================="

          cat >/usr/local/sbin/openclaw-refresh-info <<'REFRESH_INFO'
          #!/usr/bin/env bash
          set -euo pipefail

          CONFIG_FILE="/root/.openclaw/openclaw.json"
          INFO_FILE="/root/openclaw-info.txt"
          PORT="18789"

          IPV4="$(
            ip -o -4 addr show \
              dev eth0 \
              scope global \
              2>/dev/null |
              awk '{print $4}' |
              cut -d/ -f1 |
              head -n1 ||
              true
          )"

          TOKEN="$(
            jq -r '.gateway.auth.token // empty' \
              "$CONFIG_FILE" 2>/dev/null ||
              true
          )"

          VERSION="$(
            openclaw --version 2>/dev/null |
              head -n1 ||
              true
          )"

          {
            echo "============================================================"
            echo "OpenClaw LXC Ubuntu 24.04 LTS"
            echo "============================================================"
            echo "OpenClaw 版本："
            echo "  ${VERSION:-未知}"
            echo

            if [ -n "$IPV4" ]; then
              echo "访问地址："
              echo "  http://$IPV4:$PORT"
              echo "  ws://$IPV4:$PORT"
            else
              echo "访问地址："
              echo "  未检测到 eth0 IPv4"
            fi

            echo
            echo "Gateway Token："
            echo "  ${TOKEN:-未生成}"

            echo
            echo "第一次使用："
            echo "  1. 运行 openclaw-api-setup"
            echo "  2. 填写 API Base URL、模型名称和 API Key"
            echo "  3. 浏览器打开上面的访问地址"
            echo "  4. 输入 Gateway Token"

            echo
            echo "常用命令："
            echo "  openclaw-api-setup               配置 API"
            echo "  openclaw-info                    显示地址和 Token"
            echo "  openclaw-status                  查看状态"
            echo "  openclaw-logs                    查看实时日志"
            echo "  openclaw-restart                 重启 Gateway"
            echo "  openclaw-update                  更新到最新版"
            echo "  openclaw-update <版本>           更新到指定版本"
            echo "  openclaw-repair-max-permissions  修复完整权限配置"

            echo
            echo "工作目录："
            echo "  /root/.openclaw/workspace"
            echo "============================================================"
          } >"$INFO_FILE"

          chmod 600 "$INFO_FILE"
          : >/etc/motd || true
          REFRESH_INFO

          chmod +x /usr/local/sbin/openclaw-refresh-info

          echo "=================================================="
          echo "写入 API 配置脚本"
          echo "=================================================="

          cat >/usr/local/bin/openclaw-api-setup <<'API_SETUP'
          #!/usr/bin/env bash
          set -euo pipefail

          CONFIG_FILE="/root/.openclaw/openclaw.json"
          BACKUP_DIR="/root/.openclaw-backups"

          trim() {
            printf '%s' "$1" |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          mask_secret() {
            local value="${1:-}"
            local length="${#value}"

            if [ "$length" -le 8 ]; then
              printf '********'
            else
              printf '%s****%s' \
                "${value:0:4}" \
                "${value: -4}"
            fi
          }

          normalize_base_url() {
            local value

            value="$(trim "$1")"
            value="${value%/}"

            case "$value" in
              */chat/completions)
                value="${value%/chat/completions}"
                ;;
            esac

            printf '%s' "${value%/}"
          }

          mkdir -p /root/.openclaw
          mkdir -p "$BACKUP_DIR"

          chmod 700 /root/.openclaw
          chmod 700 "$BACKUP_DIR"

          /usr/local/sbin/openclaw-prepare-runtime

          if [ ! -s "$CONFIG_FILE" ] ||
            ! jq empty "$CONFIG_FILE" >/dev/null 2>&1
          then
            echo "错误：OpenClaw 配置文件无效"
            exit 1
          fi

          OLD_BASE_URL="$(
            jq -r '.models.providers.custom.baseUrl // empty' \
              "$CONFIG_FILE"
          )"

          OLD_MODEL="$(
            jq -r \
              '.models.providers.custom.models[0].id // empty' \
              "$CONFIG_FILE"
          )"

          OLD_KEY="$(
            jq -r '.models.providers.custom.apiKey // empty' \
              "$CONFIG_FILE"
          )"

          OLD_REASONING="$(
            jq -r \
              '.models.providers.custom.models[0].reasoning // false' \
              "$CONFIG_FILE"
          )"

          clear 2>/dev/null || true

          echo "============================================================"
          echo "OpenClaw OpenAI-Compatible API 配置"
          echo "============================================================"
          echo "Base URL 示例："
          echo "  https://api.deepseek.com/v1"
          echo "  https://dashscope.aliyuncs.com/compatible-mode/v1"
          echo "  https://api.moonshot.cn/v1"
          echo "  https://your-domain.example.com/v1"
          echo
          echo "也可以填写完整地址："
          echo "  https://example.com/v1/chat/completions"
          echo "============================================================"
          echo

          read -r -p \
            "Base URL${OLD_BASE_URL:+ [$OLD_BASE_URL]}: " \
            BASE_URL

          BASE_URL="$(trim "${BASE_URL:-}")"

          if [ -z "$BASE_URL" ]; then
            BASE_URL="$OLD_BASE_URL"
          fi

          BASE_URL="$(normalize_base_url "$BASE_URL")"

          read -r -p \
            "模型名称${OLD_MODEL:+ [$OLD_MODEL]}: " \
            MODEL_ID

          MODEL_ID="$(trim "${MODEL_ID:-}")"

          if [ -z "$MODEL_ID" ]; then
            MODEL_ID="$OLD_MODEL"
          fi

          read -r -p \
            "是否支持 reasoning？[$OLD_REASONING]，y/N/true/false: " \
            REASONING_INPUT

          REASONING_INPUT="$(trim "${REASONING_INPUT:-}")"

          if [ -z "$REASONING_INPUT" ]; then
            MODEL_REASONING="$OLD_REASONING"
          else
            case "$REASONING_INPUT" in
              y|Y|yes|YES|Yes|true|TRUE|1)
                MODEL_REASONING="true"
                ;;
              n|N|no|NO|No|false|FALSE|0)
                MODEL_REASONING="false"
                ;;
              *)
                echo "错误：reasoning 只能填写 y、n、true 或 false"
                exit 1
                ;;
            esac
          fi

          if [ -n "$OLD_KEY" ]; then
            echo
            echo "当前 API Key：$(mask_secret "$OLD_KEY")"

            read -r -s -p \
              "新 API Key，直接回车沿用当前 Key: " \
              API_KEY

            echo

            API_KEY="$(trim "${API_KEY:-}")"

            if [ -z "$API_KEY" ]; then
              API_KEY="$OLD_KEY"
            fi
          else
            echo
            read -r -s -p "API Key: " API_KEY
            echo
            API_KEY="$(trim "${API_KEY:-}")"
          fi

          if [ -z "$BASE_URL" ] ||
            [ -z "$MODEL_ID" ] ||
            [ -z "$API_KEY" ]
          then
            echo "错误：Base URL、模型名称和 API Key 不能为空"
            exit 1
          fi

          case "$BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "错误：Base URL 必须以 http:// 或 https:// 开头"
              exit 1
              ;;
          esac

          CHAT_URL="$BASE_URL/chat/completions"

          TEST_BODY="$(
            jq -nc \
              --arg model "$MODEL_ID" \
              '{
                model: $model,
                messages: [
                  {
                    role: "user",
                    content: "Please reply with OK only."
                  }
                ],
                max_tokens: 32,
                stream: false
              }'
          )"

          echo
          echo "测试 API：$CHAT_URL"

          rm -f /tmp/openclaw-api-response.json
          rm -f /tmp/openclaw-api-error.log

          HTTP_CODE="$({
            curl \
              -sS \
              --connect-timeout 10 \
              --max-time 60 \
              -o /tmp/openclaw-api-response.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $API_KEY" \
              -H "Content-Type: application/json" \
              -d "$TEST_BODY" \
              "$CHAT_URL"
          } 2>/tmp/openclaw-api-error.log || true)"

          case "$HTTP_CODE" in
            200|201)
              echo "API 测试成功，HTTP $HTTP_CODE"
              ;;
            *)
              echo "API 测试失败，HTTP ${HTTP_CODE:-无}"

              if [ -s /tmp/openclaw-api-error.log ]; then
                echo
                cat /tmp/openclaw-api-error.log
              fi

              if [ -s /tmp/openclaw-api-response.json ]; then
                echo
                cat /tmp/openclaw-api-response.json
                echo
              fi

              read -r -p \
                "测试失败，仍然保存配置吗？y/N: " \
                SAVE_ANYWAY

              case "${SAVE_ANYWAY:-N}" in
                y|Y|yes|YES|Yes|true|TRUE|1)
                  ;;
                *)
                  echo "已取消"
                  exit 1
                  ;;
              esac
              ;;
          esac

          BACKUP_FILE="$BACKUP_DIR/openclaw-before-api-$(
            date +%Y%m%d-%H%M%S
          ).json"

          cp -a "$CONFIG_FILE" "$BACKUP_FILE"

          PRIMARY_MODEL="custom/$MODEL_ID"
          CONFIG_TEMP="$(mktemp)"

          jq \
            --arg baseUrl "$BASE_URL" \
            --arg apiKey "$API_KEY" \
            --arg modelId "$MODEL_ID" \
            --arg primaryModel "$PRIMARY_MODEL" \
            --argjson reasoning "$MODEL_REASONING" \
            '
            .models = (
              if (.models? | type) == "object" then
                .models
              else
                {}
              end
            ) |

            .models.mode = "merge" |

            .models.providers = (
              if (.models.providers? | type) == "object" then
                .models.providers
              else
                {}
              end
            ) |

            .models.providers.custom = {
              baseUrl: $baseUrl,
              apiKey: $apiKey,
              auth: "api-key",
              api: "openai-completions",
              models: [
                {
                  id: $modelId,
                  name: $modelId,
                  reasoning: $reasoning,
                  input: ["text"],
                  contextWindow: 128000,
                  maxTokens: 8192
                }
              ]
            } |

            .agents = (
              if (.agents? | type) == "object" then
                .agents
              else
                {}
              end
            ) |

            .agents.defaults = (
              if (.agents.defaults? | type) == "object" then
                .agents.defaults
              else
                {}
              end
            ) |

            .agents.defaults.model = {
              primary: $primaryModel,
              fallbacks: []
            }
            ' "$CONFIG_FILE" >"$CONFIG_TEMP"

          mv "$CONFIG_TEMP" "$CONFIG_FILE"
          chmod 600 "$CONFIG_FILE"

          if ! /usr/local/sbin/openclaw-apply-full-config; then
            echo "错误：API 配置不兼容，恢复原配置"
            cp -a "$BACKUP_FILE" "$CONFIG_FILE"
            exit 1
          fi

          if ! openclaw config validate; then
            echo "错误：配置校验失败，恢复原配置"
            cp -a "$BACKUP_FILE" "$CONFIG_FILE"
            exit 1
          fi

          systemctl daemon-reload
          systemctl reset-failed openclaw-gateway 2>/dev/null || true
          systemctl restart openclaw-gateway

          sleep 8

          /usr/local/sbin/openclaw-refresh-info || true

          echo
          echo "API 配置完成"
          echo "Base URL：$BASE_URL"
          echo "模型：$PRIMARY_MODEL"
          echo "配置备份：$BACKUP_FILE"
          echo

          systemctl status openclaw-gateway --no-pager || true
          API_SETUP

          chmod +x /usr/local/bin/openclaw-api-setup

          echo "=================================================="
          echo "写入管理命令"
          echo "=================================================="

          cat >/usr/local/bin/openclaw-info <<'INFO_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          /usr/local/sbin/openclaw-prepare-runtime
          /usr/local/sbin/openclaw-refresh-info

          cat /root/openclaw-info.txt
          INFO_COMMAND

          cat >/usr/local/bin/openclaw-status <<'STATUS_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          echo "============================================================"
          echo "版本"
          echo "============================================================"

          openclaw --version || true
          node --version || true
          npm --version || true

          echo
          echo "============================================================"
          echo "服务状态"
          echo "============================================================"

          systemctl status openclaw-gateway --no-pager || true

          echo
          echo "============================================================"
          echo "systemd 重启计数"
          echo "============================================================"

          systemctl show openclaw-gateway \
            -p NRestarts \
            -p Result \
            -p ExecMainCode \
            -p ExecMainStatus \
            -p ActiveState \
            -p SubState

          echo
          echo "============================================================"
          echo "端口监听"
          echo "============================================================"

          ss -lntp | grep ':18789' || true

          echo
          echo "============================================================"
          echo "配置校验"
          echo "============================================================"

          openclaw config validate || true

          echo
          echo "============================================================"
          echo "配置摘要"
          echo "============================================================"

          jq '{
            gateway: {
              mode: .gateway.mode,
              port: .gateway.port,
              bind: .gateway.bind,
              authMode: .gateway.auth.mode,
              controlUi: .gateway.controlUi
            },
            permissions: {
              profile: .tools.profile,
              elevated: .tools.elevated,
              exec: .tools.exec,
              sandbox: .agents.defaults.sandbox
            },
            model: .agents.defaults.model
          }' /root/.openclaw/openclaw.json 2>/dev/null || true

          echo
          echo "============================================================"
          echo "HTTP 检查"
          echo "============================================================"

          curl -I \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:18789/ ||
            true

          echo
          echo "============================================================"
          echo "最近日志"
          echo "============================================================"

          journalctl \
            -u openclaw-gateway \
            -n 50 \
            --no-pager ||
            true
          STATUS_COMMAND

          cat >/usr/local/bin/openclaw-logs <<'LOGS_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          journalctl -u openclaw-gateway -f
          LOGS_COMMAND

          cat >/usr/local/bin/openclaw-restart <<'RESTART_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          /usr/local/sbin/openclaw-prepare-runtime

          systemctl daemon-reload
          systemctl reset-failed openclaw-gateway 2>/dev/null || true
          systemctl restart openclaw-gateway

          sleep 8

          systemctl status openclaw-gateway --no-pager || true
          ss -lntp | grep ':18789' || true
          RESTART_COMMAND

          cat >/usr/local/bin/openclaw-repair-max-permissions <<'REPAIR_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          CONFIG_FILE="/root/.openclaw/openclaw.json"
          BACKUP_DIR="/root/.openclaw-backups"

          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"

          systemctl stop openclaw-gateway 2>/dev/null || true

          BACKUP_FILE="$BACKUP_DIR/openclaw-before-repair-$(
            date +%Y%m%d-%H%M%S
          ).json"

          cp -a "$CONFIG_FILE" "$BACKUP_FILE"

          if ! /usr/local/sbin/openclaw-apply-full-config; then
            cp -a "$BACKUP_FILE" "$CONFIG_FILE"
            echo "修复失败，已经恢复原配置"
            exit 1
          fi

          /usr/local/sbin/openclaw-prepare-runtime

          openclaw config validate

          systemctl daemon-reload
          systemctl reset-failed openclaw-gateway 2>/dev/null || true
          systemctl restart openclaw-gateway

          sleep 8

          echo "修复完成"
          echo "配置备份：$BACKUP_FILE"

          systemctl status openclaw-gateway --no-pager || true
          ss -lntp | grep ':18789' || true
          REPAIR_COMMAND

          chmod +x \
            /usr/local/bin/openclaw-info \
            /usr/local/bin/openclaw-status \
            /usr/local/bin/openclaw-logs \
            /usr/local/bin/openclaw-restart \
            /usr/local/bin/openclaw-repair-max-permissions

          echo "=================================================="
          echo "写入更新命令"
          echo "=================================================="

          cat >/usr/local/bin/openclaw-update <<'UPDATE_COMMAND'
          #!/usr/bin/env bash
          set -euo pipefail

          TARGET_SPEC="${1:-latest}"

          BACKUP_DIR="/root/.openclaw-backups"
          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          STATE_BACKUP="$BACKUP_DIR/openclaw-state-$TIMESTAMP.tar.gz"
          COMMAND_BACKUP="$BACKUP_DIR/gateway-command-$TIMESTAMP"

          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"

          get_installed_version() {
            local npm_root

            npm_root="$(npm root -g)"

            node -p \
              "require('${npm_root}/openclaw/package.json').version"
          }

          resolve_version() {
            local spec="$1"
            local result

            if result="$(
              npm view "openclaw@${spec}" version \
                --json \
                --registry=https://registry.npmjs.org
            )"; then
              :
            else
              result="$(
                npm view "openclaw@${spec}" version \
                  --json \
                  --registry=https://registry.npmmirror.com
              )"
            fi

            printf '%s' "$result" |
              jq -er '
                if type == "array" then
                  .[-1]
                else
                  .
                end
                | select(type == "string" and length > 0)
              '
          }

          install_version() {
            local version="$1"

            if npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmjs.org
            then
              return 0
            fi

            npm install -g \
              "openclaw@${version}" \
              --registry=https://registry.npmmirror.com
          }

          wait_for_gateway() {
            local ready=0

            for _ in $(seq 1 30); do
              if systemctl is-active --quiet openclaw-gateway &&
                ss -lnt 2>/dev/null | grep -q ':18789'
              then
                ready=1
                break
              fi

              sleep 2
            done

            [ "$ready" = "1" ]
          }

          OLD_VERSION="$(get_installed_version)"
          TARGET_VERSION="$(resolve_version "$TARGET_SPEC")"

          echo "当前版本：$OLD_VERSION"
          echo "目标版本：$TARGET_VERSION"

          if [ "$OLD_VERSION" = "$TARGET_VERSION" ]; then
            echo "已经是目标版本"

            /usr/local/sbin/openclaw-apply-full-config
            /usr/local/sbin/openclaw-prepare-runtime
            /usr/local/sbin/openclaw-detect-gateway-command

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway

            sleep 8
            systemctl status openclaw-gateway --no-pager || true
            exit 0
          fi

          tar \
            --acls \
            --xattrs \
            -czf "$STATE_BACKUP" \
            -C /root \
            .openclaw

          cp -a \
            /etc/openclaw-gateway-command \
            "$COMMAND_BACKUP" \
            2>/dev/null ||
            true

          rollback() {
            set +e

            echo "更新失败，开始回滚"

            systemctl stop openclaw-gateway 2>/dev/null || true

            install_version "$OLD_VERSION" || true

            rm -rf /root/.openclaw

            tar \
              --acls \
              --xattrs \
              -xzf "$STATE_BACKUP" \
              -C /root ||
              true

            if [ -f "$COMMAND_BACKUP" ]; then
              cp -a \
                "$COMMAND_BACKUP" \
                /etc/openclaw-gateway-command
            else
              /usr/local/sbin/openclaw-detect-gateway-command || true
            fi

            /usr/local/sbin/openclaw-prepare-runtime || true

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway 2>/dev/null || true

            sleep 8

            echo "回滚后版本："
            openclaw --version || true

            systemctl status openclaw-gateway --no-pager || true
          }

          perform_update() {
            systemctl stop openclaw-gateway 2>/dev/null || true

            apt-get update || true
            apt-get install -y --only-upgrade nodejs || true

            node -e '
              const major = Number(process.versions.node.split(".")[0]);

              if (major < 24) {
                process.exit(1);
              }
            ' || return 1

            install_version "$TARGET_VERSION" || return 1

            NEW_VERSION="$(get_installed_version)" || return 1

            [ "$NEW_VERSION" = "$TARGET_VERSION" ] || return 1

            openclaw doctor --non-interactive || true

            /usr/local/sbin/openclaw-detect-gateway-command ||
              return 1

            /usr/local/sbin/openclaw-apply-full-config ||
              return 1

            /usr/local/sbin/openclaw-prepare-runtime ||
              return 1

            openclaw config validate ||
              return 1

            systemctl daemon-reload
            systemctl reset-failed openclaw-gateway 2>/dev/null || true
            systemctl restart openclaw-gateway ||
              return 1

            wait_for_gateway ||
              return 1

            curl \
              -sS \
              --connect-timeout 5 \
              --max-time 10 \
              -o /dev/null \
              http://127.0.0.1:18789/ ||
              return 1

            return 0
          }

          if ! perform_update; then
            rollback
            exit 1
          fi

          npm config set registry https://registry.npmmirror.com
          npm config set fund false
          npm config set audit false
          npm config set update-notifier false
          npm config set engine-strict true

          jq -n \
            --arg openclawVersion "$(get_installed_version)" \
            --arg requestedVersion "$TARGET_SPEC" \
            --arg nodeVersion "$(node --version)" \
            --arg npmVersion "$(npm --version)" \
            --arg updateTime "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              openclawVersion: $openclawVersion,
              requestedOpenclawVersion: $requestedVersion,
              nodeVersion: $nodeVersion,
              npmVersion: $npmVersion,
              distribution: "Ubuntu 24.04 LTS",
              codename: "noble",
              architecture: "amd64",
              updateTime: $updateTime
            }' >/etc/openclaw-build-info.json

          chmod 644 /etc/openclaw-build-info.json

          /usr/local/sbin/openclaw-refresh-info || true

          echo "更新完成"
          echo "旧版本：$OLD_VERSION"
          echo "新版本：$(get_installed_version)"
          echo "状态备份：$STATE_BACKUP"

          systemctl status openclaw-gateway --no-pager || true
          ss -lntp | grep ':18789' || true
          UPDATE_COMMAND

          chmod +x /usr/local/bin/openclaw-update

          echo "=================================================="
          echo "写入 systemd Gateway 服务"
          echo "=================================================="

          cat >/etc/systemd/system/openclaw-gateway.service <<'GATEWAY_SERVICE'
          [Unit]
          Description=OpenClaw Gateway
          After=local-fs.target network.target networking.service openclaw-disable-ipv6.service
          Wants=network.target openclaw-disable-ipv6.service
          StartLimitIntervalSec=120
          StartLimitBurst=3

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/root

          EnvironmentFile=-/etc/openclaw-lxc.env

          Environment=HOME=/root
          Environment=OPENCLAW_HOME=/root
          Environment=OPENCLAW_STATE_DIR=/root/.openclaw
          Environment=OPENCLAW_CONFIG_PATH=/root/.openclaw/openclaw.json
          Environment=OPENCLAW_GATEWAY_PORT=18789
          Environment=OPENCLAW_GATEWAY_BIND=lan
          Environment=OPENCLAW_SERVICE_REPAIR_POLICY=external
          Environment=OPENCLAW_DANGEROUS_FULL_TOOLS=1
          Environment=OPENCLAW_HIDE_BANNER=1
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          ExecStartPre=/usr/local/sbin/openclaw-prepare-runtime
          ExecStartPre=/usr/local/sbin/openclaw-refresh-info
          ExecStart=/usr/local/sbin/openclaw-gateway-run

          Restart=on-failure
          RestartSec=10
          RestartPreventExitStatus=78

          TimeoutStartSec=90
          TimeoutStopSec=30

          SuccessExitStatus=0 143
          KillMode=control-group
          OOMPolicy=continue
          UMask=0077

          [Install]
          WantedBy=multi-user.target
          GATEWAY_SERVICE

          systemctl enable openclaw-gateway.service

          echo "=================================================="
          echo "写入登录提示"
          echo "=================================================="

          cat >/etc/profile.d/openclaw-info.sh <<'PROFILE_SCRIPT'
          #!/usr/bin/env bash

          if [ "$(id -u)" = "0" ] &&
            [ -z "${OPENCLAW_INFO_SHOWN:-}" ]
          then
            export OPENCLAW_INFO_SHOWN=1

            if [ -x /usr/local/bin/openclaw-info ]; then
              /usr/local/bin/openclaw-info 2>/dev/null || true
            fi
          fi
          PROFILE_SCRIPT

          chmod +x /etc/profile.d/openclaw-info.sh

          cat >>/root/.bashrc <<'BASHRC_BLOCK'

          # OpenClaw login information
          if [ "$(id -u)" = "0" ] &&
            [ -z "${OPENCLAW_INFO_SHOWN:-}" ]
          then
            export OPENCLAW_INFO_SHOWN=1

            if [ -x /usr/local/bin/openclaw-info ]; then
              /usr/local/bin/openclaw-info 2>/dev/null || true
            fi
          fi
          BASHRC_BLOCK

          echo "=================================================="
          echo "生成并验证 OpenClaw 配置"
          echo "=================================================="

          /usr/local/sbin/openclaw-apply-full-config
          /usr/local/sbin/openclaw-prepare-runtime
          /usr/local/sbin/openclaw-detect-gateway-command

          openclaw config validate

          jq -e '
            .gateway.mode == "local" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .gateway.auth.mode == "token" and
            (.gateway.auth.token | type) == "string" and
            (.gateway.auth.token | length) >= 16 and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.security == "full" and
            .tools.exec.ask == "off" and
            .tools.exec.host == "gateway" and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.allow? | not) and
            (.tools.deny? | not)
          ' /root/.openclaw/openclaw.json

          echo "=================================================="
          echo "检查所有生成脚本语法"
          echo "=================================================="

          SCRIPT_FILES=(
            /usr/local/sbin/openclaw-apply-full-config
            /usr/local/sbin/openclaw-prepare-runtime
            /usr/local/sbin/openclaw-detect-gateway-command
            /usr/local/sbin/openclaw-gateway-run
            /usr/local/sbin/openclaw-refresh-info
            /usr/local/bin/openclaw-api-setup
            /usr/local/bin/openclaw-info
            /usr/local/bin/openclaw-status
            /usr/local/bin/openclaw-logs
            /usr/local/bin/openclaw-restart
            /usr/local/bin/openclaw-repair-max-permissions
            /usr/local/bin/openclaw-update
          )

          for script_file in "${SCRIPT_FILES[@]}"; do
            bash -n "$script_file"
          done

          echo "=================================================="
          echo "写入 README"
          echo "=================================================="

          cat >/root/README-OPENCLAW-LXC.md <<'README_FILE'
          # OpenClaw LXC Ubuntu 24.04 LTS

          ## 第一次使用

          ```bash
          openclaw-api-setup
          ```

          ## 显示访问地址和 Gateway Token

          ```bash
          openclaw-info
          ```

          ## 常用命令

          ```bash
          openclaw-status
          openclaw-logs
          openclaw-restart
          openclaw-update
          openclaw-update <版本号>
          openclaw-repair-max-permissions
          ```

          ## 默认配置

          - Ubuntu 24.04 LTS
          - amd64
          - OpenClaw Gateway 使用 root 运行
          - Gateway 默认端口为 18789
          - 首次启动自动生成 Gateway Token
          - gateway.bind = lan
          - tools.profile = full
          - tools.elevated.enabled = true
          - tools.exec.security = full
          - tools.exec.ask = off
          - tools.exec.host = gateway
          - agents.defaults.sandbox.mode = off
          - 删除 tools.allow
          - 删除 tools.deny

          ## 工作目录

          ```text
          /root/.openclaw/workspace
          ```
          README_FILE

          chmod 600 /root/README-OPENCLAW-LXC.md

          echo "=================================================="
          echo "清理 Ubuntu LXC 模板"
          echo "=================================================="

          rm -f /etc/machine-id
          touch /etc/machine-id

          rm -f /var/lib/dbus/machine-id || true
          ln -sf /etc/machine-id /var/lib/dbus/machine-id || true

          rm -f /etc/ssh/ssh_host_* || true

          : >/etc/motd || true

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -f /root/.bash_history || true

          echo "OpenClaw Ubuntu 24.04 LTS rootfs ready."
          INSIDE_SCRIPT

          sudo chmod +x "$ROOTFS/tmp/install-inside.sh"

          echo "检查容器安装脚本语法"

          sudo chroot "$ROOTFS" \
            /bin/bash -n \
            /tmp/install-inside.sh

          echo "=================================================="
          echo "[4/8] 在 Ubuntu chroot 中安装 OpenClaw"
          echo "=================================================="

          sudo env \
            OPENCLAW_VERSION="$OPENCLAW_VERSION" \
            chroot "$ROOTFS" \
            /bin/bash \
            /tmp/install-inside.sh

          echo "=================================================="
          echo "[5/8] OpenClaw 配置和 Gateway 启动自检"
          echo "=================================================="

          sudo chroot "$ROOTFS" \
            sh -c 'command -v openclaw'

          sudo chroot "$ROOTFS" \
            openclaw --version

          sudo chroot "$ROOTFS" \
            node --version

          sudo chroot "$ROOTFS" \
            npm --version

          sudo chroot "$ROOTFS" \
            openclaw config validate

          sudo chroot "$ROOTFS" \
            jq empty \
            /root/.openclaw/openclaw.json

          sudo chroot "$ROOTFS" jq -e '
            .gateway.mode == "local" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .gateway.auth.mode == "token" and
            (.gateway.auth.token | type) == "string" and
            (.gateway.auth.token | length) >= 16 and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.security == "full" and
            .tools.exec.ask == "off" and
            .tools.exec.host == "gateway" and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.allow? | not) and
            (.tools.deny? | not)
          ' /root/.openclaw/openclaw.json

          echo "=================================================="
          echo "实际启动 Gateway 并检查 18789 端口"
          echo "=================================================="

          sudo chroot "$ROOTFS" /bin/bash -c '
            set -euo pipefail

            LOG_FILE="/tmp/openclaw-gateway-smoke.log"
            READY=0
            PID=""

            cleanup_gateway_test() {
              set +e

              if [ -n "${PID:-}" ]; then
                kill -TERM "$PID" 2>/dev/null || true

                for _ in $(seq 1 10); do
                  if ! kill -0 "$PID" 2>/dev/null; then
                    break
                  fi

                  sleep 1
                done

                kill -KILL "$PID" 2>/dev/null || true
                wait "$PID" 2>/dev/null || true
              fi
            }

            trap cleanup_gateway_test EXIT INT TERM

            /usr/local/sbin/openclaw-prepare-runtime

            /usr/local/sbin/openclaw-gateway-run \
              >"$LOG_FILE" 2>&1 &

            PID="$!"

            for _ in $(seq 1 45); do
              if ! kill -0 "$PID" 2>/dev/null; then
                echo "错误：Gateway 进程提前退出"
                cat "$LOG_FILE" || true
                exit 1
              fi

              if ss -lnt 2>/dev/null | grep -q ":18789"; then
                READY=1
                break
              fi

              sleep 2
            done

            if [ "$READY" != "1" ]; then
              echo "错误：Gateway 未在 18789 端口启动"
              cat "$LOG_FILE" || true
              exit 1
            fi

            curl \
              -sS \
              --connect-timeout 5 \
              --max-time 15 \
              -o /tmp/openclaw-gateway-http-response \
              http://127.0.0.1:18789/

            test -s /tmp/openclaw-gateway-http-response

            echo "Gateway 启动测试通过"
          '

          ACTUAL_OPENCLAW_VERSION="$(
            sudo jq -r \
              '.openclawVersion' \
              "$ROOTFS/etc/openclaw-build-info.json"
          )"

          echo "已安装 OpenClaw 版本：$ACTUAL_OPENCLAW_VERSION"

          echo "=================================================="
          echo "清除构建 Token，首次开机重新生成"
          echo "=================================================="

          TOKEN_CONFIG_TEMP="$(mktemp)"

          sudo jq '
            .gateway.auth.mode = "token" |
            .gateway.auth.token = "GENERATE_ON_FIRST_BOOT" |

            if (
              (.gateway.controlUi? | type) == "object" and
              (.gateway.controlUi.allowedOrigins? | type) == "array"
            ) then
              .gateway.controlUi.allowedOrigins = [
                "http://127.0.0.1:18789",
                "http://localhost:18789"
              ]
            else
              .
            end
          ' "$ROOTFS/root/.openclaw/openclaw.json" \
            >"$TOKEN_CONFIG_TEMP"

          sudo cp \
            "$TOKEN_CONFIG_TEMP" \
            "$ROOTFS/root/.openclaw/openclaw.json"

          rm -f "$TOKEN_CONFIG_TEMP"

          sudo chown \
            root:root \
            "$ROOTFS/root/.openclaw/openclaw.json"

          sudo chmod \
            600 \
            "$ROOTFS/root/.openclaw/openclaw.json"

          sudo rm -f "$ROOTFS/root/.openclaw/.env"
          sudo rm -f "$ROOTFS/root/openclaw-info.txt"
          sudo rm -f "$ROOTFS/tmp/openclaw-"* 2>/dev/null || true
          sudo rm -f "$ROOTFS/tmp/install-inside.sh"

          sudo rm -rf "$ROOTFS/var/tmp/"*

          echo "=================================================="
          echo "[6/8] 卸载 chroot"
          echo "=================================================="

          cleanup_mounts
          trap - EXIT INT TERM

          if sudo findmnt -R "$ROOTFS" >/dev/null 2>&1; then
            echo "错误：rootfs 中仍然存在挂载点"
            sudo findmnt -R "$ROOTFS"
            exit 1
          fi

          sudo tee "$ROOTFS/etc/resolv.conf" >/dev/null <<'DNS_CONFIG'
          nameserver 223.5.5.5
          nameserver 119.29.29.29
          DNS_CONFIG

          echo "=================================================="
          echo "[7/8] 最终检查和打包"
          echo "=================================================="

          sudo test -f \
            "$ROOTFS/etc/os-release"

          sudo grep -q \
            'VERSION_ID="24.04"' \
            "$ROOTFS/etc/os-release"

          sudo chroot "$ROOTFS" \
            sh -c 'command -v openclaw'

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-apply-full-config"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-prepare-runtime"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-detect-gateway-command"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-gateway-run"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-refresh-info"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-api-setup"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-info"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-status"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-logs"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-restart"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-update"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-repair-max-permissions"

          sudo test -f \
            "$ROOTFS/etc/openclaw-lxc.env"

          sudo test -f \
            "$ROOTFS/etc/openclaw-build-info.json"

          sudo test -f \
            "$ROOTFS/etc/openclaw-gateway-command"

          sudo test -f \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^User=root$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Group=root$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Restart=on-failure$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^StartLimitBurst=3$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          if sudo grep -q \
            'Restart=always' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"
          then
            echo "错误：Gateway 服务不能使用 Restart=always"
            exit 1
          fi

          if sudo grep -q \
            'openclaw config validate' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"
          then
            echo "错误：Gateway 服务启动时不能运行 Node.js 配置校验"
            exit 1
          fi

          sudo grep -q \
            '^ExecStartPre=/usr/local/sbin/openclaw-prepare-runtime$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^ExecStart=/usr/local/sbin/openclaw-gateway-run$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo test -f \
            "$ROOTFS/etc/network/interfaces"

          sudo grep -Fq \
            'source /etc/network/interfaces.d/*' \
            "$ROOTFS/etc/network/interfaces"

          if sudo grep -R \
            'iface eth0 inet dhcp' \
            "$ROOTFS/etc/network/interfaces" \
            "$ROOTFS/etc/network/interfaces.d" \
            >/dev/null 2>&1
          then
            echo "错误：网络配置中发现 DHCP"
            exit 1
          fi

          if sudo chroot "$ROOTFS" \
            sh -c 'command -v dhclient' \
            >/dev/null 2>&1
          then
            echo "错误：dhclient 不应该存在"
            exit 1
          fi

          sudo grep -q \
            'PasswordAuthentication yes' \
            "$ROOTFS/etc/ssh/sshd_config.d/99-openclaw-lxc.conf"

          sudo grep -q \
            'PermitRootLogin yes' \
            "$ROOTFS/etc/ssh/sshd_config.d/99-openclaw-lxc.conf"

          sudo grep -q \
            'net.ipv6.conf.all.disable_ipv6 = 1' \
            "$ROOTFS/etc/sysctl.d/99-openclaw-disable-ipv6.conf"

          if ! sudo grep -q \
            'mirrors.tuna.tsinghua.edu.cn' \
            "$ROOTFS/etc/apt/sources.list"
          then
            sudo grep -q \
              'mirrors.ustc.edu.cn' \
              "$ROOTFS/etc/apt/sources.list"
          fi

          sudo grep -q \
            'nameserver 223.5.5.5' \
            "$ROOTFS/etc/resolv.conf"

          sudo jq empty \
            "$ROOTFS/root/.openclaw/openclaw.json"

          sudo jq -e '
            .gateway.mode == "local" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .gateway.auth.mode == "token" and
            .gateway.auth.token == "GENERATE_ON_FIRST_BOOT" and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.security == "full" and
            .tools.exec.ask == "off" and
            .tools.exec.host == "gateway" and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.allow? | not) and
            (.tools.deny? | not)
          ' "$ROOTFS/root/.openclaw/openclaw.json"

          sudo test \
            ! -e "$ROOTFS/root/.openclaw/.env"

          echo "生成 Ubuntu 24.04 LXC tar.gz 模板"

          rm -f "$DIST_DIR/$IMAGE_NAME"
          rm -f "$DIST_DIR/$IMAGE_NAME.sha256"

          sudo tar \
            --one-file-system \
            --numeric-owner \
            --xattrs \
            --acls \
            -cpf - \
            -C "$ROOTFS" . |
            gzip -9n >"$DIST_DIR/$IMAGE_NAME"

          sync

          test -s "$DIST_DIR/$IMAGE_NAME"

          file "$DIST_DIR/$IMAGE_NAME"
          gzip -t "$DIST_DIR/$IMAGE_NAME"
          tar -tzf "$DIST_DIR/$IMAGE_NAME" >/dev/null

          echo "测试解压模板"

          TEST_EXTRACT_DIR="$WORK_DIR/test-extract"

          sudo rm -rf "$TEST_EXTRACT_DIR"
          sudo mkdir -p "$TEST_EXTRACT_DIR"

          sudo tar \
            -xzf "$DIST_DIR/$IMAGE_NAME" \
            -C "$TEST_EXTRACT_DIR" \
            --numeric-owner \
            --acls \
            --xattrs \
            --warning=no-unknown-keyword

          sudo grep -q \
            'VERSION_ID="24.04"' \
            "$TEST_EXTRACT_DIR/etc/os-release"

          sudo test -x \
            "$TEST_EXTRACT_DIR/usr/local/sbin/openclaw-gateway-run"

          sudo test -x \
            "$TEST_EXTRACT_DIR/usr/local/sbin/openclaw-prepare-runtime"

          sudo test -f \
            "$TEST_EXTRACT_DIR/etc/systemd/system/openclaw-gateway.service"

          sudo test -f \
            "$TEST_EXTRACT_DIR/root/.openclaw/openclaw.json"

          sudo jq -e '
            .gateway.auth.token == "GENERATE_ON_FIRST_BOOT" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.security == "full" and
            .tools.exec.ask == "off" and
            .tools.exec.host == "gateway" and
            .agents.defaults.sandbox.mode == "off"
          ' "$TEST_EXTRACT_DIR/root/.openclaw/openclaw.json"

          sudo test \
            ! -e "$TEST_EXTRACT_DIR/root/.openclaw/.env"

          sudo rm -rf "$TEST_EXTRACT_DIR"

          cd "$DIST_DIR"

          sha256sum "$IMAGE_NAME" >"$IMAGE_NAME.sha256"

          sha256sum -c "$IMAGE_NAME.sha256"
          gzip -t "$IMAGE_NAME"
          tar -tzf "$IMAGE_NAME" >/dev/null

          cat >README.md <<'RELEASE_README'
          # OpenClaw LXC Ubuntu 24.04 LTS

          ## 版本

          - OpenClaw：__OPENCLAW_VERSION__
          - Ubuntu：24.04 LTS Noble
          - Architecture：amd64
          - Template version：__TEMPLATE_VERSION__

          ## 第一次使用

          ```bash
          openclaw-api-setup
          ```

          ## 显示地址和 Token

          ```bash
          openclaw-info
          ```

          ## 常用命令

          ```bash
          openclaw-status
          openclaw-logs
          openclaw-restart
          openclaw-update
          openclaw-update <版本号>
          openclaw-repair-max-permissions
          ```

          ## 默认配置

          - OpenClaw Gateway 使用 root 运行
          - 默认端口为 18789
          - 首次启动自动生成 Gateway Token
          - gateway.bind = lan
          - tools.profile = full
          - tools.elevated.enabled = true
          - tools.exec.security = full
          - tools.exec.ask = off
          - tools.exec.host = gateway
          - agents.defaults.sandbox.mode = off
          - 删除 tools.allow
          - 删除 tools.deny
          - Gateway 使用 Restart=on-failure
          - Gateway 正常启动时不执行 Node.js 配置探测
          RELEASE_README

          sed -i \
            "s|__OPENCLAW_VERSION__|$ACTUAL_OPENCLAW_VERSION|g" \
            README.md

          sed -i \
            "s|__TEMPLATE_VERSION__|$VERSION|g" \
            README.md

          ls -lh \
            "$IMAGE_NAME" \
            "$IMAGE_NAME.sha256" \
            README.md

          echo "=================================================="
          echo "[8/8] 上传 GitHub Release"
          echo "=================================================="

          TAG="openclaw-lxc-ubuntu2404-${VERSION}"
          TITLE="OpenClaw LXC Ubuntu 24.04 LTS ${VERSION} / OpenClaw ${ACTUAL_OPENCLAW_VERSION}"

          echo "Repository：$GITHUB_REPOSITORY"
          echo "Tag：$TAG"
          echo "Image：$IMAGE_NAME"
          echo "OpenClaw：$ACTUAL_OPENCLAW_VERSION"

          gh auth status --hostname github.com || true

          if gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            gh release edit \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file README.md

            gh release upload \
              "$TAG" \
              "$IMAGE_NAME" \
              "$IMAGE_NAME.sha256" \
              README.md \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$IMAGE_NAME" \
              "$IMAGE_NAME.sha256" \
              README.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file README.md
          fi

          gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY"

          echo "=================================================="
          echo "校验 GitHub Release 下载文件"
          echo "=================================================="

          VERIFY_DIR="$(mktemp -d)"

          gh release download \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$IMAGE_NAME" \
            --pattern "$IMAGE_NAME.sha256" \
            --dir "$VERIFY_DIR" \
            --clobber

          cd "$VERIFY_DIR"

          ls -lh \
            "$IMAGE_NAME" \
            "$IMAGE_NAME.sha256"

          sha256sum -c "$IMAGE_NAME.sha256"
          gzip -t "$IMAGE_NAME"
          tar -tzf "$IMAGE_NAME" >/dev/null

          cd /
          rm -rf "$VERIFY_DIR"

          echo "=================================================="
          echo "构建完成"
          echo "=================================================="
          echo "模板：$IMAGE_NAME"
          echo "系统：Ubuntu 24.04 LTS"
          echo "OpenClaw：$ACTUAL_OPENCLAW_VERSION"
          echo "Release Tag：$TAG"
          echo "Release 文件校验通过"