name: Build PVE LXC XFCE noVNC Template

"on":
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pve-lxc-template-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATE_NAME: debian-12-xfce-novnc-amd64
  DEBIAN_SUITE: bookworm
  DEBIAN_ARCH: amd64

jobs:
  build:
    name: Build Debian 12 LXC template
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            mmdebstrap \
            uidmap \
            zstd

      - name: Build rootfs
        shell: bash
        run: |
          set -euo pipefail

          sudo env \
            TEMPLATE_NAME="${TEMPLATE_NAME}" \
            DEBIAN_SUITE="${DEBIAN_SUITE}" \
            DEBIAN_ARCH="${DEBIAN_ARCH}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash <<'BUILD_SCRIPT'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          readonly WORK_DIR="${GITHUB_WORKSPACE}/build"
          readonly ROOTFS="${WORK_DIR}/rootfs"
          readonly DIST_DIR="${GITHUB_WORKSPACE}/dist"
          readonly ARCHIVE="${DIST_DIR}/${TEMPLATE_NAME}.tar.zst"
          readonly CHECKSUM="${ARCHIVE}.sha256"

          cleanup() {
            local target

            if [[ -d "${ROOTFS}" ]]; then
              while IFS= read -r target; do
                [[ -n "${target}" ]] || continue
                umount -lf "${target}" 2>/dev/null || true
              done < <(
                findmnt --raw --noheadings --output TARGET 2>/dev/null |
                  awk -v root="${ROOTFS}" 'index($0, root) == 1' |
                  sort --reverse
              )
            fi
          }

          trap cleanup EXIT

          rm -rf "${WORK_DIR}" "${DIST_DIR}"
          install -d -m 0755 "${ROOTFS}" "${DIST_DIR}"

          PACKAGES="$(
            printf '%s,' \
              systemd \
              systemd-sysv \
              sudo \
              passwd \
              bash \
              ca-certificates \
              curl \
              openssl \
              iproute2 \
              ifupdown \
              procps \
              psmisc \
              util-linux \
              locales \
              dbus \
              dbus-x11 \
              dbus-user-session \
              xauth \
              x11-xserver-utils \
              fonts-dejavu-core \
              fonts-liberation \
              fonts-noto-cjk \
              xfce4 \
              xfce4-goodies \
              firefox-esr \
              tigervnc-standalone-server \
              novnc \
              websockify
          )"
          PACKAGES="${PACKAGES%,}"

          mmdebstrap \
            --mode=root \
            --variant=minbase \
            --architectures="${DEBIAN_ARCH}" \
            --components=main \
            --aptopt='APT::Install-Recommends "false"' \
            --aptopt='APT::Install-Suggests "false"' \
            --include="${PACKAGES}" \
            "${DEBIAN_SUITE}" \
            "${ROOTFS}" \
            "http://deb.debian.org/debian"

          cat >"${ROOTFS}/etc/apt/sources.list" <<'EOF'
          deb http://deb.debian.org/debian bookworm main
          deb http://deb.debian.org/debian bookworm-updates main
          deb http://security.debian.org/debian-security bookworm-security main
          EOF

          cat >"${ROOTFS}/usr/sbin/policy-rc.d" <<'EOF'
          #!/bin/sh
          exit 101
          EOF
          chmod 0755 "${ROOTFS}/usr/sbin/policy-rc.d"

          # Remove any DHCP client or network manager pulled in as a dependency.
          remove_packages=()
          for package in \
            isc-dhcp-client \
            isc-dhcp-common \
            dhcpcd \
            dhcpcd5 \
            dhcpcd-base \
            network-manager
          do
            if chroot "${ROOTFS}" dpkg-query \
              --show \
              --showformat='${db:Status-Abbrev}' \
              "${package}" 2>/dev/null | grep -q '^ii'
            then
              remove_packages+=("${package}")
            fi
          done

          if (( ${#remove_packages[@]} > 0 )); then
            chroot "${ROOTFS}" apt-get purge --yes "${remove_packages[@]}"
            chroot "${ROOTFS}" apt-get autoremove --yes
          fi

          rm -f "${ROOTFS}/usr/sbin/policy-rc.d"

          # PVE writes the eth0 static configuration while creating the CT.
          install -d -m 0755 "${ROOTFS}/etc/network/interfaces.d"
          cat >"${ROOTFS}/etc/network/interfaces" <<'EOF'
          # PVE injects eth0 configuration from the pct net0 option.
          # This template intentionally contains no DHCP configuration.
          source /etc/network/interfaces.d/*

          auto lo
          iface lo inet loopback
          EOF

          # Prevent competing network managers and DHCP services from starting.
          install -d -m 0755 "${ROOTFS}/etc/systemd/system"

          for unit in \
            NetworkManager.service \
            NetworkManager-wait-online.service \
            systemd-networkd.service \
            systemd-networkd.socket \
            systemd-networkd-wait-online.service \
            dhcpcd.service \
            dhcpcd5.service \
            isc-dhcp-client.service \
            lightdm.service \
            display-manager.service
          do
            ln -sfn /dev/null "${ROOTFS}/etc/systemd/system/${unit}"
          done

          # Disable IPv6, RA and SLAAC inside the container.
          install -d -m 0755 "${ROOTFS}/etc/sysctl.d"
          cat >"${ROOTFS}/etc/sysctl.d/99-disable-ipv6.conf" <<'EOF'
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.all.autoconf = 0
          net.ipv6.conf.default.autoconf = 0
          EOF

          # Generic locale and timezone.
          sed -i \
            's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' \
            "${ROOTFS}/etc/locale.gen"
          chroot "${ROOTFS}" locale-gen
          chroot "${ROOTFS}" update-locale LANG=en_US.UTF-8
          ln -sfn /usr/share/zoneinfo/UTC "${ROOTFS}/etc/localtime"
          printf 'UTC\n' >"${ROOTFS}/etc/timezone"

          # Create the non-root graphical session user.
          if ! chroot "${ROOTFS}" getent passwd desktop >/dev/null; then
            chroot "${ROOTFS}" useradd \
              --create-home \
              --uid 1000 \
              --shell /bin/bash \
              desktop
          fi

          chroot "${ROOTFS}" passwd --lock desktop

          install -d -o 1000 -g 1000 -m 0700 \
            "${ROOTFS}/home/desktop/.vnc" \
            "${ROOTFS}/home/desktop/.config" \
            "${ROOTFS}/home/desktop/.config/autostart" \
            "${ROOTFS}/home/desktop/.config/xfce4" \
            "${ROOTFS}/home/desktop/.config/xfce4/xfconf" \
            "${ROOTFS}/home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml"

          # XFCE VNC session startup.
          cat >"${ROOTFS}/home/desktop/.vnc/xstartup" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_RUNTIME_DIR="/tmp/runtime-desktop"
          install -d -m 0700 "${XDG_RUNTIME_DIR}"

          xset s off || true
          xset s noblank || true
          xset -dpms || true

          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod 0700 "${ROOTFS}/home/desktop/.vnc/xstartup"

          # Start Firefox ESR after XFCE has initialized.
          install -d -m 0755 "${ROOTFS}/usr/local/bin"
          cat >"${ROOTFS}/usr/local/bin/start-firefox-esr" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          sleep 3
          exec firefox-esr --new-window about:blank
          EOF
          chmod 0755 "${ROOTFS}/usr/local/bin/start-firefox-esr"

          cat >"${ROOTFS}/home/desktop/.config/autostart/firefox-esr.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Firefox ESR
          Exec=/usr/local/bin/start-firefox-esr
          Terminal=false
          Hidden=false
          X-GNOME-Autostart-enabled=true
          OnlyShowIn=XFCE;
          StartupNotify=false
          EOF

          # Disable X11 screen blanking and DPMS on every XFCE login.
          cat >"${ROOTFS}/usr/local/bin/disable-display-power" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          xset s off || true
          xset s noblank || true
          xset -dpms || true
          EOF
          chmod 0755 "${ROOTFS}/usr/local/bin/disable-display-power"

          cat >"${ROOTFS}/home/desktop/.config/autostart/disable-display-power.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Display power configuration
          Exec=/usr/local/bin/disable-display-power
          Terminal=false
          Hidden=false
          X-GNOME-Autostart-enabled=true
          OnlyShowIn=XFCE;
          StartupNotify=false
          EOF

          # User-level overrides disable common screen locker autostarts.
          for desktop_file in \
            xfce4-screensaver.desktop \
            light-locker.desktop \
            xscreensaver.desktop
          do
            cat >"${ROOTFS}/home/desktop/.config/autostart/${desktop_file}" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Disabled screen locker
          Hidden=true
          X-GNOME-Autostart-enabled=false
          EOF
          done

          cat >"${ROOTFS}/home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-power-manager" version="1.0">
            <property name="xfce4-power-manager" type="empty">
              <property name="blank-on-ac" type="int" value="0"/>
              <property name="blank-on-battery" type="int" value="0"/>
              <property name="dpms-enabled" type="bool" value="false"/>
              <property name="dpms-on-ac-off" type="uint" value="0"/>
              <property name="dpms-on-ac-sleep" type="uint" value="0"/>
              <property name="dpms-on-battery-off" type="uint" value="0"/>
              <property name="dpms-on-battery-sleep" type="uint" value="0"/>
              <property name="inactivity-on-ac" type="uint" value="0"/>
              <property name="inactivity-on-battery" type="uint" value="0"/>
              <property name="lock-screen-suspend-hibernate" type="bool" value="false"/>
              <property name="show-tray-icon" type="bool" value="false"/>
            </property>
          </channel>
          EOF

          # noVNC state is root-only. TigerVNC receives a separate binary
          # password file owned by desktop.
          install -d -o root -g root -m 0700 "${ROOTFS}/etc/novnc"
          install -d -o root -g root -m 0755 "${ROOTFS}/usr/local/libexec"

          cat >"${ROOTFS}/usr/local/libexec/novnc-common" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly NOVNC_ACCESS_FILE="/etc/novnc/access.env"
          readonly NOVNC_PASSWORD_FILE="/home/desktop/.vnc/passwd"
          readonly NOVNC_LOCK_FILE="/run/lock/novnc-password.lock"

          generate_vnc_password() {
            local candidate=""

            while (( ${#candidate} < 8 )); do
              candidate="$(
                openssl rand -base64 18 |
                  tr -dc 'A-Za-z0-9'
              )"
            done

            printf '%s' "${candidate:0:8}"
          }

          get_eth0_ipv4() {
            local address=""

            address="$(
              ip -4 -o address show dev eth0 scope global 2>/dev/null |
                awk 'NR == 1 { split($4, parts, "/"); print parts[1] }'
            )" || address=""

            if [[ -z "${address}" || "${address}" == 127.* ]]; then
              return 1
            fi

            printf '%s' "${address}"
          }

          wait_for_eth0_ipv4() {
            local max_attempts="${1:-60}"
            local attempt
            local address=""

            for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
              if address="$(get_eth0_ipv4)"; then
                printf '%s' "${address}"
                return 0
              fi

              sleep 2
            done

            echo "No global IPv4 address was found on eth0" >&2
            return 1
          }

          make_novnc_url() {
            local ipv4="${1:?IPv4 address is required}"

            printf 'http://%s:6080/vnc.html?autoconnect=1&resize=scale' \
              "${ipv4}"
          }

          load_novnc_access() {
            VNC_PASSWORD=""
            NOVNC_URL=""

            if [[ -f "${NOVNC_ACCESS_FILE}" ]]; then
              # This file is generated locally, owned by root and mode 0600.
              # shellcheck disable=SC1090
              source "${NOVNC_ACCESS_FILE}"
            fi
          }

          write_novnc_access() {
            local password="${1:?VNC password is required}"
            local url="${2:?noVNC URL is required}"
            local password_tmp
            local access_tmp

            install -d -o root -g root -m 0700 /etc/novnc
            install -d -o desktop -g desktop -m 0700 /home/desktop/.vnc

            password_tmp="$(mktemp /home/desktop/.vnc/.passwd.XXXXXX)"
            access_tmp="$(mktemp /etc/novnc/.access.env.XXXXXX)"

            if ! {
              printf '%s\n' "${password}" |
                /usr/bin/tigervncpasswd -f >"${password_tmp}"

              chown desktop:desktop "${password_tmp}"
              chmod 0600 "${password_tmp}"
              mv -f "${password_tmp}" "${NOVNC_PASSWORD_FILE}"

              {
                printf 'VNC_PASSWORD=%q\n' "${password}"
                printf 'NOVNC_URL=%q\n' "${url}"
              } >"${access_tmp}"

              chown root:root "${access_tmp}"
              chmod 0600 "${access_tmp}"
              mv -f "${access_tmp}" "${NOVNC_ACCESS_FILE}"
            }; then
              rm -f "${password_tmp}" "${access_tmp}"
              return 1
            fi

            rm -f "${password_tmp}" "${access_tmp}"
          }
          EOF
          chmod 0755 "${ROOTFS}/usr/local/libexec/novnc-common"

          # Runs on every boot so the URL follows the current PVE-injected IPv4.
          # The password is generated only when access.env does not yet exist.
          cat >"${ROOTFS}/usr/local/libexec/novnc-firstboot" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # shellcheck source=/usr/local/libexec/novnc-common
          source /usr/local/libexec/novnc-common

          install -d -m 0755 /run/lock /run/novnc
          exec 9>"${NOVNC_LOCK_FILE}"
          flock 9

          load_novnc_access

          if [[ ! "${VNC_PASSWORD}" =~ ^[A-Za-z0-9]{8}$ ]]; then
            VNC_PASSWORD="$(generate_vnc_password)"
          fi

          ipv4="$(wait_for_eth0_ipv4 60)"
          NOVNC_URL="$(make_novnc_url "${ipv4}")"

          write_novnc_access "${VNC_PASSWORD}" "${NOVNC_URL}"

          printf '%s\n' "${NOVNC_URL}" >/run/novnc/url
          chmod 0644 /run/novnc/url
          EOF
          chmod 0755 "${ROOTFS}/usr/local/libexec/novnc-firstboot"

          cat >"${ROOTFS}/usr/local/bin/novnc-info" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if (( $# != 0 )); then
            echo "Usage: novnc-info" >&2
            exit 2
          fi

          if (( EUID != 0 )); then
            exec sudo -- /usr/local/bin/novnc-info
          fi

          # shellcheck source=/usr/local/libexec/novnc-common
          source /usr/local/libexec/novnc-common

          load_novnc_access

          if [[ -z "${VNC_PASSWORD}" ]]; then
            echo "noVNC credentials have not been initialized." >&2
            exit 1
          fi

          if ipv4="$(get_eth0_ipv4)"; then
            NOVNC_URL="$(make_novnc_url "${ipv4}")"
          fi

          tiger_status="$(systemctl is-active tigervnc.service 2>/dev/null || true)"
          novnc_status="$(systemctl is-active novnc.service 2>/dev/null || true)"

          printf 'noVNC URL: %s\n' "${NOVNC_URL:-unavailable}"
          printf 'VNC password: %s\n' "${VNC_PASSWORD}"
          printf 'Password state: initialized and persistent\n'
          printf 'TigerVNC service: %s\n' "${tiger_status:-unknown}"
          printf 'noVNC service: %s\n' "${novnc_status:-unknown}"
          EOF
          chmod 0755 "${ROOTFS}/usr/local/bin/novnc-info"

          cat >"${ROOTFS}/usr/local/bin/novnc-regenerate-password" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if (( $# != 0 )); then
            echo "Usage: novnc-regenerate-password" >&2
            exit 2
          fi

          if (( EUID != 0 )); then
            exec sudo -- /usr/local/bin/novnc-regenerate-password
          fi

          # shellcheck source=/usr/local/libexec/novnc-common
          source /usr/local/libexec/novnc-common

          install -d -m 0755 /run/lock /run/novnc
          exec 9>"${NOVNC_LOCK_FILE}"
          flock 9

          load_novnc_access

          if ipv4="$(get_eth0_ipv4)"; then
            NOVNC_URL="$(make_novnc_url "${ipv4}")"
          fi

          if [[ -z "${NOVNC_URL}" ]]; then
            echo "Cannot determine the noVNC URL because eth0 has no IPv4 address." >&2
            exit 1
          fi

          VNC_PASSWORD="$(generate_vnc_password)"
          write_novnc_access "${VNC_PASSWORD}" "${NOVNC_URL}"

          printf '%s\n' "${NOVNC_URL}" >/run/novnc/url
          chmod 0644 /run/novnc/url

          systemctl try-restart tigervnc.service

          printf 'VNC password regenerated successfully.\n'
          printf 'noVNC URL: %s\n' "${NOVNC_URL}"
          printf 'New VNC password: %s\n' "${VNC_PASSWORD}"
          EOF
          chmod 0755 "${ROOTFS}/usr/local/bin/novnc-regenerate-password"

          # Permit desktop to run only the two noVNC management commands as root.
          install -d -m 0750 "${ROOTFS}/etc/sudoers.d"
          cat >"${ROOTFS}/etc/sudoers.d/90-desktop-novnc" <<'EOF'
          desktop ALL=(root) NOPASSWD: /usr/local/bin/novnc-info
          desktop ALL=(root) NOPASSWD: /usr/local/bin/novnc-regenerate-password
          EOF
          chmod 0440 "${ROOTFS}/etc/sudoers.d/90-desktop-novnc"

          # First boot initialization and URL refresh.
          cat >"${ROOTFS}/etc/systemd/system/firstboot.service" <<'EOF'
          [Unit]
          Description=Initialize persistent noVNC credentials and access URL
          Wants=network-online.target
          After=network.target network-online.target
          Before=tigervnc.service novnc.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/libexec/novnc-firstboot
          RemainAfterExit=yes
          TimeoutStartSec=150

          [Install]
          WantedBy=multi-user.target
          EOF

          # TigerVNC runs as desktop and accepts connections only from localhost.
          cat >"${ROOTFS}/etc/systemd/system/tigervnc.service" <<'EOF'
          [Unit]
          Description=TigerVNC XFCE desktop on display :1
          Requires=firstboot.service
          After=firstboot.service network-online.target
          Before=novnc.service

          [Service]
          Type=simple
          User=desktop
          Group=desktop
          WorkingDirectory=/home/desktop
          Environment=HOME=/home/desktop
          Environment=USER=desktop
          Environment=LOGNAME=desktop
          Environment=DISPLAY=:1
          ExecStartPre=-/usr/bin/rm -f /tmp/.X1-lock /tmp/.X11-unix/X1
          ExecStart=/usr/bin/tigervncserver :1 -fg -localhost yes -geometry 1600x900 -depth 24 -SecurityTypes VncAuth -PasswordFile /home/desktop/.vnc/passwd -xstartup /home/desktop/.vnc/xstartup
          ExecStop=-/usr/bin/tigervncserver -kill :1
          Restart=on-failure
          RestartSec=3
          TimeoutStopSec=20
          KillMode=mixed
          NoNewPrivileges=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target
          EOF

          # websockify/noVNC runs as desktop and is the only externally exposed
          # listener. TigerVNC remains on 127.0.0.1:5901.
          cat >"${ROOTFS}/etc/systemd/system/novnc.service" <<'EOF'
          [Unit]
          Description=noVNC web client and WebSocket proxy
          Requires=tigervnc.service
          After=tigervnc.service network-online.target

          [Service]
          Type=simple
          User=desktop
          Group=desktop
          WorkingDirectory=/home/desktop
          Environment=HOME=/home/desktop
          ExecStart=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target
          EOF

          chroot "${ROOTFS}" systemctl enable \
            firstboot.service \
            tigervnc.service \
            novnc.service

          chroot "${ROOTFS}" systemctl enable networking.service 2>/dev/null || true

          chown -R 1000:1000 "${ROOTFS}/home/desktop"

          # Generate the requested README as part of the build output and include
          # it in /root inside the template. The repository itself still needs
          # only this one workflow file.
          cat >"${DIST_DIR}/README.md" <<'EOF'
          # Debian 12 XFCE noVNC PVE LXC Template

          This template provides Debian 12 amd64, XFCE, Firefox ESR, TigerVNC,
          noVNC and websockify.

          - XFCE, TigerVNC, noVNC and Firefox run as the unprivileged `desktop`
            user with UID 1000.
          - TigerVNC listens only on `127.0.0.1:5901`.
          - noVNC listens on `0.0.0.0:6080`.
          - The desktop resolution is fixed at `1600x900`.
          - The template does not run a DHCP client.
          - PVE injects the static IPv4 configuration through `net0`.
          - IPv6, RA and SLAAC are disabled inside the container.
          - The VNC password is generated on first boot and persists across
            subsequent restarts.

          ## Build

          Open the repository's Actions page and run the
          `Build PVE LXC XFCE noVNC Template` workflow, or use GitHub CLI:

          ```bash
          gh workflow run build.yml
          ```

          Download the workflow artifact after the build finishes. A push of a
          tag such as `v1.0.0` also creates a GitHub Release containing the
          template and SHA256 checksum.

          ```bash
          git tag v1.0.0
          git push origin v1.0.0
          ```

          ## Verify and import into PVE

          Copy the two files to a PVE node, verify the checksum, and place the
          archive in the PVE template cache:

          ```bash
          sha256sum --check debian-12-xfce-novnc-amd64.tar.zst.sha256

          install -m 0644 \
            debian-12-xfce-novnc-amd64.tar.zst \
            /var/lib/vz/template/cache/
          ```

          ## Create an unprivileged container

          The following is an example. Replace the CT ID, storage, bridge,
          IPv4 address and gateway for your environment.

          ```bash
          CTID=120
          TEMPLATE='debian-12-xfce-novnc-amd64.tar.zst'
          IPV4_CIDR='192.0.2.50/24'
          IPV4_GATEWAY='192.0.2.1'

          pct create "${CTID}" "local:vztmpl/${TEMPLATE}" \
            --unprivileged 1 \
            --ostype debian \
            --hostname "desktop-${CTID}" \
            --cores 2 \
            --memory 4096 \
            --swap 512 \
            --rootfs local-lvm:16 \
            --net0 "name=eth0,bridge=vmbr0,type=veth,firewall=1,ip=${IPV4_CIDR},gw=${IPV4_GATEWAY},ip6=manual" \
            --onboot 1 \
            --startup order=30

          pct start "${CTID}"
          ```

          No DHCP client is installed. The container will not obtain an address
          unless PVE receives a static `ip` and `gw` in its `net0` setting.

          ## View noVNC access information

          Wait for the container to finish starting, then run:

          ```bash
          pct exec 120 -- novnc-info
          ```

          Example output:

          ```text
          noVNC URL: http://CONTAINER_IPV4:6080/vnc.html?autoconnect=1&resize=scale
          VNC password: RANDOM8
          Password state: initialized and persistent
          TigerVNC service: active
          noVNC service: active
          ```

          The root-only credential file is:

          ```text
          /etc/novnc/access.env
          ```

          It has mode `0600`. The current URL is also available at:

          ```text
          /run/novnc/url
          ```

          ## Rotate the VNC password

          From the PVE host:

          ```bash
          pct exec 120 -- novnc-regenerate-password
          ```

          Or from inside the container as `desktop`:

          ```bash
          sudo novnc-regenerate-password
          ```

          Password rotation restarts TigerVNC and disconnects the active VNC
          session. Run `novnc-info` afterward to display the new password.

          ## Diagnostics

          ```bash
          pct exec 120 -- systemctl status firstboot.service
          pct exec 120 -- systemctl status tigervnc.service
          pct exec 120 -- systemctl status novnc.service
          pct exec 120 -- ss -lntp
          ```

          Expected listeners:

          ```text
          127.0.0.1:5901
          0.0.0.0:6080
          ```

          ## Security

          This template deliberately does not include TLS or HTTPS
          configuration. noVNC traffic, including VNC authentication traffic,
          is not protected by transport encryption when accessed over plain
          HTTP.

          Do not expose TCP port 6080 directly to the public Internet. For
          remote access, use one or more of:

          - A reverse proxy with HTTPS and access authentication.
          - PVE firewall rules restricting TCP 6080 to trusted networks.
          - A private VPN such as Tailscale or WireGuard.
          - Network-level access controls and source IP allowlists.

          Keep TCP 5901 blocked externally. TigerVNC is intentionally bound only
          to the container loopback address.
          EOF

          install -o root -g root -m 0644 \
            "${DIST_DIR}/README.md" \
            "${ROOTFS}/root/README.md"

          # Validate generated scripts and service definitions before cleanup.
          scripts=(
            /home/desktop/.vnc/xstartup
            /usr/local/bin/start-firefox-esr
            /usr/local/bin/disable-display-power
            /usr/local/libexec/novnc-common
            /usr/local/libexec/novnc-firstboot
            /usr/local/bin/novnc-info
            /usr/local/bin/novnc-regenerate-password
          )

          for script in "${scripts[@]}"; do
            chroot "${ROOTFS}" bash -n "${script}"
          done

          chroot "${ROOTFS}" visudo \
            --check \
            --file=/etc/sudoers.d/90-desktop-novnc

          chroot "${ROOTFS}" systemd-analyze verify \
            firstboot.service \
            tigervnc.service \
            novnc.service

          test "$(chroot "${ROOTFS}" id -u desktop)" = "1000"
          test "$(chroot "${ROOTFS}" id -g desktop)" = "1000"

          for command in \
            /usr/bin/firefox-esr \
            /usr/bin/tigervncserver \
            /usr/bin/tigervncpasswd \
            /usr/bin/websockify \
            /usr/bin/startxfce4 \
            /usr/bin/dbus-launch
          do
            test -x "${ROOTFS}${command}"
          done

          for package in \
            isc-dhcp-client \
            dhcpcd \
            dhcpcd5 \
            dhcpcd-base \
            network-manager
          do
            if chroot "${ROOTFS}" dpkg-query \
              --show \
              --showformat='${db:Status-Abbrev}' \
              "${package}" 2>/dev/null | grep -q '^ii'
            then
              echo "Forbidden network package remains installed: ${package}" >&2
              exit 1
            fi
          done

          test "$(stat -c '%a' "${ROOTFS}/etc/novnc")" = "700"
          test ! -e "${ROOTFS}/etc/novnc/access.env"

          # Remove instance-specific state and build caches.
          rm -f \
            "${ROOTFS}/etc/ssh/ssh_host_"* \
            "${ROOTFS}/root/.bash_history" \
            "${ROOTFS}/home/desktop/.bash_history" \
            "${ROOTFS}/var/lib/systemd/random-seed"

          rm -rf \
            "${ROOTFS}/root/.cache" \
            "${ROOTFS}/home/desktop/.cache" \
            "${ROOTFS}/home/desktop/.mozilla" \
            "${ROOTFS}/tmp/"* \
            "${ROOTFS}/var/tmp/"* \
            "${ROOTFS}/var/cache/apt/archives/"* \
            "${ROOTFS}/var/lib/apt/lists/"* \
            "${ROOTFS}/var/log/journal/"*

          find "${ROOTFS}/var/log" \
            -type f \
            -exec truncate --size 0 {} +

          truncate --size 0 "${ROOTFS}/etc/machine-id"
          rm -f "${ROOTFS}/var/lib/dbus/machine-id"
          ln -s /etc/machine-id "${ROOTFS}/var/lib/dbus/machine-id"

          # PVE will replace these during container creation.
          truncate --size 0 "${ROOTFS}/etc/hostname"
          truncate --size 0 "${ROOTFS}/etc/resolv.conf"

          chroot "${ROOTFS}" apt-get clean

          # Ensure all desktop-owned files retain numeric UID/GID 1000.
          chown -R 1000:1000 "${ROOTFS}/home/desktop"

          # Create the PVE-compatible tar.zst. Do not force all archive owners
          # to root because the desktop user's files must remain UID/GID 1000.
          tar \
            --create \
            --numeric-owner \
            --acls \
            --xattrs \
            --sort=name \
            --mtime='@0' \
            --file=- \
            --directory="${ROOTFS}" \
            . |
            zstd \
              --threads=0 \
              --ultra \
              -19 \
              --stdout >"${ARCHIVE}"

          (
            cd "${DIST_DIR}"
            sha256sum "$(basename "${ARCHIVE}")" \
              >"$(basename "${CHECKSUM}")"
          )

          chmod 0644 \
            "${ARCHIVE}" \
            "${CHECKSUM}" \
            "${DIST_DIR}/README.md"

          test -s "${ARCHIVE}"
          test -s "${CHECKSUM}"

          zstd --test "${ARCHIVE}"
          (
            cd "${DIST_DIR}"
            sha256sum --check "$(basename "${CHECKSUM}")"
          )

          echo "Built archive:"
          ls -lh "${ARCHIVE}" "${CHECKSUM}" "${DIST_DIR}/README.md"
          BUILD_SCRIPT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEMPLATE_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/${{ env.TEMPLATE_NAME }}.tar.zst
            dist/${{ env.TEMPLATE_NAME }}.tar.zst.sha256
            dist/README.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.TEMPLATE_NAME }}.tar.zst
            dist/${{ env.TEMPLATE_NAME }}.tar.zst.sha256
            dist/README.md

      - name: Write job summary
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/${TEMPLATE_NAME}.tar.zst"
          checksum="${archive}.sha256"

          {
            echo "## PVE LXC template"
            echo
            echo "- Template: \`${TEMPLATE_NAME}.tar.zst\`"
            echo "- Size: \`$(du -h "${archive}" | awk '{print $1}')\`"
            echo "- SHA256: \`$(awk '{print $1}' "${checksum}")\`"
            echo "- Base: Debian 12 amd64"
            echo "- Desktop: XFCE at 1600x900"
            echo "- TigerVNC: \`127.0.0.1:5901\`"
            echo "- noVNC: \`0.0.0.0:6080\`"
            echo
            echo "Download the workflow artifact and follow \`README.md\`."
          } >>"${GITHUB_STEP_SUMMARY}"
