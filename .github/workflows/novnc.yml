name: Build PVE LXC XFCE noVNC Template

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pve-lxc-template-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATE_NAME: debian-12-xfce-novnc-amd64
  DEBIAN_SUITE: bookworm
  DEBIAN_ARCH: amd64

jobs:
  build:
    name: Build Debian 12 XFCE noVNC LXC template
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            mmdebstrap \
            debian-archive-keyring \
            uidmap \
            zstd

          test -s /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Build Debian 12 rootfs and PVE template
        shell: bash
        run: |
          set -euo pipefail

          sudo env \
            TEMPLATE_NAME="${TEMPLATE_NAME}" \
            DEBIAN_SUITE="${DEBIAN_SUITE}" \
            DEBIAN_ARCH="${DEBIAN_ARCH}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            bash <<'BUILD_SCRIPT'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          readonly WORK_DIR="${GITHUB_WORKSPACE}/build"
          readonly ROOTFS="${WORK_DIR}/rootfs"
          readonly DIST_DIR="${GITHUB_WORKSPACE}/dist"
          readonly ARCHIVE="${DIST_DIR}/${TEMPLATE_NAME}.tar.zst"
          readonly CHECKSUM="${ARCHIVE}.sha256"

          readonly DEBIAN_MIRROR="https://mirrors.ustc.edu.cn/debian"
          readonly DEBIAN_SECURITY_MIRROR="https://mirrors.ustc.edu.cn/debian-security"
          readonly DEBIAN_KEYRING="/usr/share/keyrings/debian-archive-keyring.gpg"

          cleanup() {
            local target

            if [[ -d "${ROOTFS}" ]]; then
              while IFS= read -r target; do
                [[ -n "${target}" ]] || continue
                umount -lf "${target}" 2>/dev/null || true
              done < <(
                findmnt \
                  --raw \
                  --noheadings \
                  --output TARGET 2>/dev/null |
                  awk -v root="${ROOTFS}" 'index($0, root) == 1' |
                  sort --reverse
              )
            fi
          }

          trap cleanup EXIT

          rm -rf \
            "${WORK_DIR}" \
            "${DIST_DIR}"

          install -d \
            -m 0755 \
            "${ROOTFS}" \
            "${DIST_DIR}"

          if [[ ! -s "${DEBIAN_KEYRING}" ]]; then
            echo "Debian archive keyring is missing: ${DEBIAN_KEYRING}" >&2
            exit 1
          fi

          packages="$(
            printf '%s,' \
              systemd \
              systemd-sysv \
              sudo \
              passwd \
              bash \
              ca-certificates \
              curl \
              openssl \
              iproute2 \
              ifupdown \
              procps \
              psmisc \
              util-linux \
              locales \
              dbus \
              dbus-x11 \
              dbus-user-session \
              xauth \
              x11-xserver-utils \
              fonts-dejavu-core \
              fonts-liberation \
              fonts-noto-cjk \
              xfce4 \
              xfce4-goodies \
              firefox-esr \
              tigervnc-standalone-server \
              tigervnc-tools \
              novnc \
              websockify
          )"

          packages="${packages%,}"

          mmdebstrap \
            --mode=root \
            --variant=minbase \
            --architectures="${DEBIAN_ARCH}" \
            --components=main \
            --keyring="${DEBIAN_KEYRING}" \
            --aptopt='APT::Install-Recommends "false"' \
            --aptopt='APT::Install-Suggests "false"' \
            --include="${packages}" \
            "${DEBIAN_SUITE}" \
            "${ROOTFS}" \
            "${DEBIAN_MIRROR}"

          install \
            -D \
            -m 0644 \
            "${DEBIAN_KEYRING}" \
            "${ROOTFS}${DEBIAN_KEYRING}"

          install -d \
            -m 0755 \
            "${ROOTFS}/etc/apt/sources.list.d"

          rm -f \
            "${ROOTFS}/etc/apt/sources.list.d/"*

          cat >"${ROOTFS}/etc/apt/sources.list" <<'EOF'
          deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://mirrors.ustc.edu.cn/debian bookworm main
          deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://mirrors.ustc.edu.cn/debian bookworm-updates main
          deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://mirrors.ustc.edu.cn/debian-security bookworm-security main
          EOF

          cat >"${ROOTFS}/usr/sbin/policy-rc.d" <<'EOF'
          #!/bin/sh
          exit 101
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/sbin/policy-rc.d"

          remove_packages=()

          for package in \
            isc-dhcp-client \
            isc-dhcp-common \
            dhcpcd \
            dhcpcd5 \
            dhcpcd-base \
            network-manager
          do
            if chroot "${ROOTFS}" dpkg-query \
              --show \
              --showformat='${db:Status-Abbrev}' \
              "${package}" 2>/dev/null |
              grep -q '^ii'
            then
              remove_packages+=("${package}")
            fi
          done

          if (( ${#remove_packages[@]} > 0 )); then
            chroot "${ROOTFS}" apt-get purge --yes "${remove_packages[@]}"
            chroot "${ROOTFS}" apt-get autoremove --yes
          fi

          rm -f \
            "${ROOTFS}/usr/sbin/policy-rc.d"

          install -d \
            -m 0755 \
            "${ROOTFS}/etc/network/interfaces.d"

          cat >"${ROOTFS}/etc/network/interfaces" <<'EOF'
          # PVE injects the static eth0 configuration through pct net0.
          # No DHCP configuration is included in this template.

          source /etc/network/interfaces.d/*

          auto lo
          iface lo inet loopback
          EOF

          install -d \
            -m 0755 \
            "${ROOTFS}/etc/systemd/system"

          for unit in \
            NetworkManager.service \
            NetworkManager-wait-online.service \
            systemd-networkd.service \
            systemd-networkd.socket \
            systemd-networkd-wait-online.service \
            dhcpcd.service \
            dhcpcd5.service \
            isc-dhcp-client.service \
            lightdm.service \
            display-manager.service
          do
            ln -sfn \
              /dev/null \
              "${ROOTFS}/etc/systemd/system/${unit}"
          done

          install -d \
            -m 0755 \
            "${ROOTFS}/etc/sysctl.d"

          cat >"${ROOTFS}/etc/sysctl.d/99-disable-ipv6.conf" <<'EOF'
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.all.autoconf = 0
          net.ipv6.conf.default.autoconf = 0
          EOF

          sed -i \
            's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' \
            "${ROOTFS}/etc/locale.gen"

          chroot "${ROOTFS}" locale-gen
          chroot "${ROOTFS}" update-locale LANG=en_US.UTF-8

          ln -sfn \
            /usr/share/zoneinfo/UTC \
            "${ROOTFS}/etc/localtime"

          printf 'UTC\n' >"${ROOTFS}/etc/timezone"

          if ! chroot "${ROOTFS}" getent passwd desktop >/dev/null; then
            chroot "${ROOTFS}" useradd \
              --create-home \
              --uid 1000 \
              --shell /bin/bash \
              desktop
          fi

          chroot "${ROOTFS}" passwd --lock desktop

          install -d \
            -o 1000 \
            -g 1000 \
            -m 0700 \
            "${ROOTFS}/home/desktop/.vnc" \
            "${ROOTFS}/home/desktop/.config" \
            "${ROOTFS}/home/desktop/.config/autostart" \
            "${ROOTFS}/home/desktop/.config/xfce4" \
            "${ROOTFS}/home/desktop/.config/xfce4/xfconf" \
            "${ROOTFS}/home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml"

          cat >"${ROOTFS}/home/desktop/.vnc/xstartup" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_RUNTIME_DIR="/tmp/runtime-desktop"

          install -d \
            -m 0700 \
            "${XDG_RUNTIME_DIR}"

          xset s off || true
          xset s noblank || true
          xset -dpms || true

          exec dbus-launch --exit-with-session startxfce4
          EOF

          chmod 0700 \
            "${ROOTFS}/home/desktop/.vnc/xstartup"

          install -d \
            -m 0755 \
            "${ROOTFS}/usr/local/bin"

          cat >"${ROOTFS}/usr/local/bin/start-firefox-esr" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          sleep 3

          exec firefox-esr --new-window about:blank
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/bin/start-firefox-esr"

          cat >"${ROOTFS}/home/desktop/.config/autostart/firefox-esr.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Firefox ESR
          Exec=/usr/local/bin/start-firefox-esr
          Terminal=false
          Hidden=false
          X-GNOME-Autostart-enabled=true
          OnlyShowIn=XFCE;
          StartupNotify=false
          EOF

          cat >"${ROOTFS}/usr/local/bin/disable-display-power" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          xset s off || true
          xset s noblank || true
          xset -dpms || true
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/bin/disable-display-power"

          cat >"${ROOTFS}/home/desktop/.config/autostart/disable-display-power.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Disable display power management
          Exec=/usr/local/bin/disable-display-power
          Terminal=false
          Hidden=false
          X-GNOME-Autostart-enabled=true
          OnlyShowIn=XFCE;
          StartupNotify=false
          EOF

          for desktop_file in \
            xfce4-screensaver.desktop \
            light-locker.desktop \
            xscreensaver.desktop
          do
            cat >"${ROOTFS}/home/desktop/.config/autostart/${desktop_file}" <<'EOF'
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Disabled screen locker
          Hidden=true
          X-GNOME-Autostart-enabled=false
          EOF
          done

          cat >"${ROOTFS}/home/desktop/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-power-manager" version="1.0">
            <property name="xfce4-power-manager" type="empty">
              <property name="blank-on-ac" type="int" value="0"/>
              <property name="blank-on-battery" type="int" value="0"/>
              <property name="dpms-enabled" type="bool" value="false"/>
              <property name="dpms-on-ac-off" type="uint" value="0"/>
              <property name="dpms-on-ac-sleep" type="uint" value="0"/>
              <property name="dpms-on-battery-off" type="uint" value="0"/>
              <property name="dpms-on-battery-sleep" type="uint" value="0"/>
              <property name="inactivity-on-ac" type="uint" value="0"/>
              <property name="inactivity-on-battery" type="uint" value="0"/>
              <property name="lock-screen-suspend-hibernate" type="bool" value="false"/>
              <property name="show-tray-icon" type="bool" value="false"/>
            </property>
          </channel>
          EOF

          install -d \
            -o root \
            -g root \
            -m 0700 \
            "${ROOTFS}/etc/novnc"

          install -d \
            -o root \
            -g root \
            -m 0755 \
            "${ROOTFS}/usr/local/libexec"

          cat >"${ROOTFS}/usr/local/libexec/novnc-common" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly NOVNC_ACCESS_FILE="/etc/novnc/access.env"
          readonly NOVNC_PASSWORD_FILE="/home/desktop/.vnc/passwd"
          readonly NOVNC_LOCK_FILE="/run/lock/novnc-password.lock"

          generate_vnc_password() {
            local candidate=""

            while (( ${#candidate} < 8 )); do
              candidate="$(
                openssl rand -base64 24 |
                  tr -dc 'A-Za-z0-9'
              )"
            done

            printf '%s' "${candidate:0:8}"
          }

          get_eth0_ipv4() {
            local address=""

            address="$(
              ip -4 -o address show dev eth0 scope global 2>/dev/null |
                awk '
                  NR == 1 {
                    split($4, parts, "/")
                    print parts[1]
                  }
                '
            )" || address=""

            if [[ -z "${address}" || "${address}" == 127.* ]]; then
              return 1
            fi

            printf '%s' "${address}"
          }

          wait_for_eth0_ipv4() {
            local max_attempts="${1:-60}"
            local attempt
            local address=""

            for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
              if address="$(get_eth0_ipv4)"; then
                printf '%s' "${address}"
                return 0
              fi

              sleep 2
            done

            echo "No global IPv4 address was found on eth0" >&2
            return 1
          }

          make_novnc_url() {
            local ipv4="${1:?IPv4 address is required}"

            printf \
              'http://%s:6080/vnc.html?autoconnect=1&resize=scale' \
              "${ipv4}"
          }

          load_novnc_access() {
            VNC_PASSWORD=""
            NOVNC_URL=""

            if [[ -f "${NOVNC_ACCESS_FILE}" ]]; then
              # This file is generated locally and has mode 0600.
              # shellcheck disable=SC1090
              source "${NOVNC_ACCESS_FILE}"
            fi
          }

          write_novnc_access() {
            local password="${1:?VNC password is required}"
            local url="${2:?noVNC URL is required}"
            local password_tmp
            local access_tmp

            install -d \
              -o root \
              -g root \
              -m 0700 \
              /etc/novnc

            install -d \
              -o desktop \
              -g desktop \
              -m 0700 \
              /home/desktop/.vnc

            password_tmp="$(
              mktemp /home/desktop/.vnc/.passwd.XXXXXX
            )"

            access_tmp="$(
              mktemp /etc/novnc/.access.env.XXXXXX
            )"

            if ! {
              printf '%s\n' "${password}" |
                /usr/bin/vncpasswd -f >"${password_tmp}"

              chown desktop:desktop "${password_tmp}"
              chmod 0600 "${password_tmp}"

              mv -f \
                "${password_tmp}" \
                "${NOVNC_PASSWORD_FILE}"

              {
                printf 'VNC_PASSWORD=%q\n' "${password}"
                printf 'NOVNC_URL=%q\n' "${url}"
              } >"${access_tmp}"

              chown root:root "${access_tmp}"
              chmod 0600 "${access_tmp}"

              mv -f \
                "${access_tmp}" \
                "${NOVNC_ACCESS_FILE}"
            }; then
              rm -f \
                "${password_tmp}" \
                "${access_tmp}"
              return 1
            fi

            rm -f \
              "${password_tmp}" \
              "${access_tmp}"
          }
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/libexec/novnc-common"

          cat >"${ROOTFS}/usr/local/libexec/novnc-firstboot" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          source /usr/local/libexec/novnc-common

          install -d \
            -m 0755 \
            /run/lock \
            /run/novnc

          exec 9>"${NOVNC_LOCK_FILE}"
          flock 9

          load_novnc_access

          if [[ ! "${VNC_PASSWORD}" =~ ^[A-Za-z0-9]{8}$ ]]; then
            VNC_PASSWORD="$(generate_vnc_password)"
          fi

          ipv4="$(wait_for_eth0_ipv4 60)"
          NOVNC_URL="$(make_novnc_url "${ipv4}")"

          write_novnc_access \
            "${VNC_PASSWORD}" \
            "${NOVNC_URL}"

          printf '%s\n' "${NOVNC_URL}" >/run/novnc/url
          chmod 0644 /run/novnc/url
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/libexec/novnc-firstboot"

          cat >"${ROOTFS}/usr/local/bin/novnc-info" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if (( $# != 0 )); then
            echo "Usage: novnc-info" >&2
            exit 2
          fi

          if (( EUID != 0 )); then
            exec sudo -- /usr/local/bin/novnc-info
          fi

          source /usr/local/libexec/novnc-common

          load_novnc_access

          if [[ -z "${VNC_PASSWORD}" ]]; then
            echo "noVNC credentials have not been initialized." >&2
            exit 1
          fi

          if ipv4="$(get_eth0_ipv4)"; then
            NOVNC_URL="$(make_novnc_url "${ipv4}")"
          fi

          tiger_status="$(
            systemctl is-active tigervnc.service 2>/dev/null || true
          )"

          novnc_status="$(
            systemctl is-active novnc.service 2>/dev/null || true
          )"

          printf 'noVNC URL: %s\n' "${NOVNC_URL:-unavailable}"
          printf 'VNC password: %s\n' "${VNC_PASSWORD}"
          printf 'Password state: initialized and persistent\n'
          printf 'TigerVNC service: %s\n' "${tiger_status:-unknown}"
          printf 'noVNC service: %s\n' "${novnc_status:-unknown}"
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/bin/novnc-info"

          cat >"${ROOTFS}/usr/local/bin/novnc-regenerate-password" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if (( $# != 0 )); then
            echo "Usage: novnc-regenerate-password" >&2
            exit 2
          fi

          if (( EUID != 0 )); then
            exec sudo -- /usr/local/bin/novnc-regenerate-password
          fi

          source /usr/local/libexec/novnc-common

          install -d \
            -m 0755 \
            /run/lock \
            /run/novnc

          exec 9>"${NOVNC_LOCK_FILE}"
          flock 9

          ipv4="$(wait_for_eth0_ipv4 30)"
          NOVNC_URL="$(make_novnc_url "${ipv4}")"
          VNC_PASSWORD="$(generate_vnc_password)"

          write_novnc_access \
            "${VNC_PASSWORD}" \
            "${NOVNC_URL}"

          printf '%s\n' "${NOVNC_URL}" >/run/novnc/url
          chmod 0644 /run/novnc/url

          systemctl restart tigervnc.service

          printf 'VNC password regenerated successfully.\n'
          printf 'noVNC URL: %s\n' "${NOVNC_URL}"
          printf 'New VNC password: %s\n' "${VNC_PASSWORD}"
          EOF

          chmod 0755 \
            "${ROOTFS}/usr/local/bin/novnc-regenerate-password"

          install -d \
            -o root \
            -g root \
            -m 0750 \
            "${ROOTFS}/etc/sudoers.d"

          cat >"${ROOTFS}/etc/sudoers.d/90-desktop-novnc" <<'EOF'
          desktop ALL=(root) NOPASSWD: /usr/local/bin/novnc-info
          desktop ALL=(root) NOPASSWD: /usr/local/bin/novnc-regenerate-password
          EOF

          chmod 0440 \
            "${ROOTFS}/etc/sudoers.d/90-desktop-novnc"

          cat >"${ROOTFS}/etc/systemd/system/firstboot.service" <<'EOF'
          [Unit]
          Description=Initialize persistent noVNC credentials and URL
          Wants=network-online.target
          After=network.target network-online.target
          Before=tigervnc.service novnc.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/libexec/novnc-firstboot
          RemainAfterExit=yes
          TimeoutStartSec=150

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >"${ROOTFS}/etc/systemd/system/tigervnc.service" <<'EOF'
          [Unit]
          Description=TigerVNC XFCE desktop on display :1
          Requires=firstboot.service
          After=firstboot.service network-online.target
          Before=novnc.service

          [Service]
          Type=simple
          User=desktop
          Group=desktop
          WorkingDirectory=/home/desktop
          Environment=HOME=/home/desktop
          Environment=USER=desktop
          Environment=LOGNAME=desktop
          Environment=DISPLAY=:1
          ExecStartPre=-/usr/bin/rm -f /tmp/.X1-lock /tmp/.X11-unix/X1
          ExecStart=/usr/bin/tigervncserver :1 -fg -localhost yes -geometry 1600x900 -depth 24 -SecurityTypes VncAuth -PasswordFile /home/desktop/.vnc/passwd -xstartup /home/desktop/.vnc/xstartup
          ExecStop=-/usr/bin/tigervncserver -kill :1
          Restart=on-failure
          RestartSec=3
          TimeoutStopSec=20
          KillMode=mixed
          NoNewPrivileges=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >"${ROOTFS}/etc/systemd/system/novnc.service" <<'EOF'
          [Unit]
          Description=noVNC web client and WebSocket proxy
          Requires=tigervnc.service
          After=tigervnc.service network-online.target

          [Service]
          Type=simple
          User=desktop
          Group=desktop
          WorkingDirectory=/home/desktop
          Environment=HOME=/home/desktop
          ExecStart=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
          Restart=on-failure
          RestartSec=3
          NoNewPrivileges=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target
          EOF

          chroot "${ROOTFS}" systemctl enable \
            networking.service \
            firstboot.service \
            tigervnc.service \
            novnc.service

          chown -R \
            1000:1000 \
            "${ROOTFS}/home/desktop"

          cat >"${DIST_DIR}/README.md" <<'EOF'
          # Debian 12 XFCE noVNC PVE LXC Template

          This template provides Debian 12 amd64, XFCE, Firefox ESR,
          TigerVNC, noVNC and websockify.

          Runtime configuration:

          - User: `desktop`
          - UID: `1000`
          - Desktop: XFCE
          - Resolution: `1600x900`
          - Browser: Firefox ESR
          - TigerVNC: `127.0.0.1:5901`
          - noVNC: `0.0.0.0:6080`
          - DHCP: disabled and not installed
          - IPv6: disabled
          - VNC password: generated at first boot
          - Password file: `/etc/novnc/access.env`
          - Password file mode: `0600`

          ## Build

          This project contains only:

          ```text
          .github/workflows/build.yml
          ```

          The workflow is manually triggered from GitHub Actions using
          `workflow_dispatch`.

          It does not automatically run on push or tag events.

          The build uses these domestic Debian mirrors:

          ```text
          https://mirrors.ustc.edu.cn/debian
          https://mirrors.ustc.edu.cn/debian-security
          ```

          ## Verify the archive

          ```bash
          sha256sum --check debian-12-xfce-novnc-amd64.tar.zst.sha256
          ```

          ## Install the template on PVE

          Copy the archive to a PVE node:

          ```bash
          install -m 0644 \
            debian-12-xfce-novnc-amd64.tar.zst \
            /var/lib/vz/template/cache/
          ```

          ## Create an unprivileged container

          Replace the example IP address, gateway, bridge and storage with
          values appropriate for your network:

          ```bash
          pct create 120 \
            local:vztmpl/debian-12-xfce-novnc-amd64.tar.zst \
            --unprivileged 1 \
            --ostype debian \
            --hostname xfce-novnc-120 \
            --cores 2 \
            --memory 4096 \
            --swap 512 \
            --rootfs local-lvm:16 \
            --net0 name=eth0,bridge=vmbr0,type=veth,firewall=1,ip=192.0.2.50/24,gw=192.0.2.1,ip6=manual \
            --onboot 1 \
            --startup order=30
          ```

          Start the container:

          ```bash
          pct start 120
          ```

          The `ip=` and `gw=` values are injected statically by PVE.
          Do not use `ip=dhcp`.

          ## View noVNC information

          On the PVE host:

          ```bash
          pct exec 120 -- novnc-info
          ```

          Example:

          ```text
          noVNC URL: http://192.0.2.50:6080/vnc.html?autoconnect=1&resize=scale
          VNC password: Ab12Cd34
          Password state: initialized and persistent
          TigerVNC service: active
          noVNC service: active
          ```

          The URL is also stored at:

          ```text
          /run/novnc/url
          ```

          Persistent credentials are stored at:

          ```text
          /etc/novnc/access.env
          ```

          ## Change the VNC password

          ```bash
          pct exec 120 -- novnc-regenerate-password
          ```

          The command generates a new eight-character VNC password,
          updates the persistent password file and restarts TigerVNC.

          The active VNC session will be disconnected.

          The command can also be executed inside the container:

          ```bash
          sudo novnc-regenerate-password
          ```

          ## Check services

          ```bash
          pct exec 120 -- systemctl status firstboot.service
          pct exec 120 -- systemctl status tigervnc.service
          pct exec 120 -- systemctl status novnc.service
          ```

          Check listeners:

          ```bash
          pct exec 120 -- ss -lntp
          ```

          Expected listeners:

          ```text
          127.0.0.1:5901
          0.0.0.0:6080
          ```

          ## Security

          The template intentionally contains no TLS or HTTPS configuration.

          Do not expose plain HTTP noVNC directly to the public Internet.

          Recommended protections:

          - Use an HTTPS reverse proxy.
          - Add reverse-proxy authentication.
          - Restrict port `6080` with the PVE firewall.
          - Permit access only from trusted networks.
          - Use Tailscale or WireGuard.
          - Use source IP allowlists.
          - Keep port `5901` blocked externally.

          TigerVNC is intentionally bound to `127.0.0.1` and should never
          be exposed directly.
          EOF

          install \
            -o root \
            -g root \
            -m 0644 \
            "${DIST_DIR}/README.md" \
            "${ROOTFS}/root/README.md"

          for script in \
            /home/desktop/.vnc/xstartup \
            /usr/local/bin/start-firefox-esr \
            /usr/local/bin/disable-display-power \
            /usr/local/libexec/novnc-common \
            /usr/local/libexec/novnc-firstboot \
            /usr/local/bin/novnc-info \
            /usr/local/bin/novnc-regenerate-password
          do
            bash -n \
              "${ROOTFS}${script}"
          done

          chroot "${ROOTFS}" visudo \
            --check \
            --file=/etc/sudoers.d/90-desktop-novnc

          chroot "${ROOTFS}" systemd-analyze verify \
            firstboot.service \
            tigervnc.service \
            novnc.service

          test "$(chroot "${ROOTFS}" id -u desktop)" = "1000"
          test "$(chroot "${ROOTFS}" id -g desktop)" = "1000"

          for command in \
            /usr/bin/firefox-esr \
            /usr/bin/tigervncserver \
            /usr/bin/vncpasswd \
            /usr/bin/websockify \
            /usr/bin/startxfce4 \
            /usr/bin/dbus-launch
          do
            if [[ ! -x "${ROOTFS}${command}" ]]; then
              echo "Required command is missing: ${command}" >&2
              exit 1
            fi
          done

          for package in \
            isc-dhcp-client \
            dhcpcd \
            dhcpcd5 \
            dhcpcd-base \
            network-manager
          do
            if chroot "${ROOTFS}" dpkg-query \
              --show \
              --showformat='${db:Status-Abbrev}' \
              "${package}" 2>/dev/null |
              grep -q '^ii'
            then
              echo "Forbidden network package remains installed: ${package}" >&2
              exit 1
            fi
          done

          if [[ -e "${ROOTFS}/etc/novnc/access.env" ]]; then
            echo "access.env must not be present in the template" >&2
            exit 1
          fi

          if [[ -e "${ROOTFS}/home/desktop/.vnc/passwd" ]]; then
            echo "VNC password file must not be present in the template" >&2
            exit 1
          fi

          test "$(stat -c '%a' "${ROOTFS}/etc/novnc")" = "700"
          test "$(stat -c '%a' "${ROOTFS}/etc/sudoers.d/90-desktop-novnc")" = "440"

          rm -f \
            "${ROOTFS}/etc/ssh/ssh_host_"* \
            "${ROOTFS}/root/.bash_history" \
            "${ROOTFS}/home/desktop/.bash_history" \
            "${ROOTFS}/var/lib/systemd/random-seed"

          rm -rf \
            "${ROOTFS}/root/.cache" \
            "${ROOTFS}/home/desktop/.cache" \
            "${ROOTFS}/home/desktop/.mozilla" \
            "${ROOTFS}/tmp/"* \
            "${ROOTFS}/var/tmp/"* \
            "${ROOTFS}/var/cache/apt/archives/"* \
            "${ROOTFS}/var/lib/apt/lists/"* \
            "${ROOTFS}/var/log/journal/"*

          find "${ROOTFS}/var/log" \
            -type f \
            -exec truncate --size 0 {} +

          truncate \
            --size 0 \
            "${ROOTFS}/etc/machine-id"

          rm -f \
            "${ROOTFS}/var/lib/dbus/machine-id"

          ln -s \
            /etc/machine-id \
            "${ROOTFS}/var/lib/dbus/machine-id"

          truncate \
            --size 0 \
            "${ROOTFS}/etc/hostname"

          rm -f \
            "${ROOTFS}/etc/resolv.conf"

          ln -s \
            /run/systemd/resolve/stub-resolv.conf \
            "${ROOTFS}/etc/resolv.conf"

          chroot "${ROOTFS}" apt-get clean

          chown -R \
            1000:1000 \
            "${ROOTFS}/home/desktop"

          tar \
            --create \
            --numeric-owner \
            --acls \
            --xattrs \
            --sort=name \
            --mtime='@0' \
            --file=- \
            --directory="${ROOTFS}" \
            . |
            zstd \
              --threads=0 \
              --ultra \
              -19 \
              --stdout \
              >"${ARCHIVE}"

          (
            cd "${DIST_DIR}"

            sha256sum \
              "$(basename "${ARCHIVE}")" \
              >"$(basename "${CHECKSUM}")"
          )

          chmod 0644 \
            "${ARCHIVE}" \
            "${CHECKSUM}" \
            "${DIST_DIR}/README.md"

          zstd \
            --test \
            "${ARCHIVE}"

          (
            cd "${DIST_DIR}"

            sha256sum \
              --check \
              "$(basename "${CHECKSUM}")"
          )

          test -s \
            "${ARCHIVE}"

          test -s \
            "${CHECKSUM}"

          echo "Build completed successfully."

          ls -lh \
            "${ARCHIVE}" \
            "${CHECKSUM}" \
            "${DIST_DIR}/README.md"

          BUILD_SCRIPT

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEMPLATE_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            dist/${{ env.TEMPLATE_NAME }}.tar.zst
            dist/${{ env.TEMPLATE_NAME }}.tar.zst.sha256
            dist/README.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.TEMPLATE_NAME }}.tar.zst
            dist/${{ env.TEMPLATE_NAME }}.tar.zst.sha256
            dist/README.md

      - name: Write build summary
        shell: bash
        run: |
          set -euo pipefail

          archive="dist/${TEMPLATE_NAME}.tar.zst"
          checksum="${archive}.sha256"

          {
            echo "## PVE LXC template"
            echo
            echo "- Template: \`${TEMPLATE_NAME}.tar.zst\`"
            echo "- Size: \`$(du -h "${archive}" | awk '{print $1}')\`"
            echo "- SHA256: \`$(awk '{print $1}' "${checksum}")\`"
            echo "- Base system: Debian 12 amd64"
            echo "- Desktop: XFCE"
            echo "- Resolution: 1600x900"
            echo "- Browser: Firefox ESR"
            echo "- TigerVNC: 127.0.0.1:5901"
            echo "- noVNC: 0.0.0.0:6080"
            echo "- Trigger: manual workflow_dispatch"
            echo
            echo "The generated README.md contains PVE installation and security instructions."
          } >>"${GITHUB_STEP_SUMMARY}"