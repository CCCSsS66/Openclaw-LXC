name: Build OpenClaw LXC Ubuntu 24.04 LTS Grok

##############################################################################
# OpenClaw LXC Ubuntu 24.04 模板构建工作流
# 针对官方稳定版 OpenClaw 2026.9.6（npm dist-tag: latest，发布于 2026-09-23）
# 整份脚本已按 2026.9.6 契约重写，不再以 2026.9.4 为基线。
#
# ---------------------------------------------------------------------------
# 2026.9.6 运行时契约（来自 docs.openclaw.ai / npm 包说明）
# ---------------------------------------------------------------------------
# 1) Node.js
#    engines: >=24.16.0 <25 || >=26.1.0
#    官方推荐 Node 26；本模板用 NodeSource 24.x LTS，构建时强制校验 24.16+。
#
# 2) 安装
#    npm install -g openclaw@<ver> --allow-scripts=openclaw
#    --allow-scripts 需要 npm 11.16+ / npm 12；旧 npm 会自动回退普通安装。
#
# 3) Gateway 前台命令
#    `openclaw gateway` 与 `openclaw gateway run` 等价（均为前台常驻）。
#    构建期仍先测 gateway run，失败再测 gateway，写入 /etc/openclaw-gateway-command。
#    本模板不用 `openclaw gateway start/install`：那会安装 OpenClaw 自管 systemd user
#    单元。LXC 使用系统级 systemd + 外部监管。
#
# 4) 外部监管（必须同时设置）
#    OPENCLAW_NO_RESPAWN=1
#      禁止 Gateway 进程内再拉起自己，避免与 systemd Restart=always 抢 PID。
#      该模式下 Control Plane 的 update.run 会被拒绝，更新必须走本模板的
#      openclaw-update（停服务 -> npm 换包 -> doctor -> 启服务）。
#    OPENCLAW_SERVICE_REPAIR_POLICY=external
#      doctor 不改 systemd 单元、不启停服务。
#    OPENCLAW_SUPERVISOR_MODE=external
#      CLI 的 gateway install/start/stop/uninstall 与自更新被拒绝。
#
# 5) systemd 单元硬性要求
#    Type=simple
#    Restart=always
#    RestartSec=5
#    RestartPreventExitStatus=78
#      78 = 无效配置；阻止坏配置重启风暴。
#    禁止 ExecStartPre、禁止 Restart=on-failure。
#
# 6) 2026.9.6 权限模型（三层，互不替代）
#    A. tools.profile
#       minimal | coding | messaging | full
#       full = 不按核心档案过滤，并纳入可选插件工具。
#       注意：profile=full 只决定“选出哪些工具”，不等于 Full Access 执行权。
#    B. tools.exec
#       正式字段是 tools.exec.mode:
#         deny | allowlist | ask | auto | full
#       mode=full 推导为 security=full + ask=off。
#       旧字段 tools.exec.security / tools.exec.ask 仍可能被部分版本接受，
#       Doctor 会迁移到 mode。本模板自适应：
#         mode+legacy -> mode-only -> legacy-only
#       tools.exec.host=gateway（LXC 内无独立 node，直接在网关主机执行）
#    C. agents.defaults.sandbox.mode
#       off | non-main | all
#       本模板 off：工具在宿主机（容器根）执行。
#    D. tools.elevated.enabled=true
#       exec 逃逸沙箱的开关；沙箱已 off 时基本是 no-op，但仍保留。
#       删除 allowFrom，避免把提权限制到特定聊天账号。
#
# 7) Gateway / Control UI
#    gateway.mode=local          非 local 会拒绝启动
#    gateway.port=18789
#    gateway.bind=lan            非 loopback，LXC eth0 可达
#    gateway.auth.mode=token
#    gateway.auth.token=${OPENCLAW_GATEWAY_TOKEN}
#    Control UI 非 loopback 必须有 allowedOrigins。
#    自适应 UI：
#      full  = enabled + allowedOrigins + allowInsecureAuth
#              + dangerouslyDisableDeviceAuth
#              + dangerouslyAllowHostHeaderOriginFallback
#      basic = enabled + allowedOrigins（无危险开关）
#      none  = 删除 controlUi
#
# 8) 模型协议（自定义 OpenAI 兼容端点）
#    models.providers.<id>.api 官方取值：
#      openai-completions（/v1/chat/completions 默认）
#      openai-responses
#      openai-chatgpt-responses
#      anthropic-messages / google-generative-ai / ...
#    openai-chat 是旧别名，部分版本仍接受。
#    探测顺序：openai-completions -> openai-chat -> openai-responses
#    apiKey 使用 ${OPENCLAW_PROVIDER_API_KEY}，明文在 .env。
#
# 9) 2026.9.5+ Atomic Updates
#    官方 `openclaw update` 在外部监管下会被拒绝。
#    本模板 openclaw-update 自己做：备份状态、换 Node/包、doctor --fix、
#    重选 Gateway 命令、重启并探针。失败回滚旧包 + 旧状态。
##############################################################################
on:
  workflow_dispatch:
    inputs:
      version:
        description: "模板版本号"
        required: true
        default: "auto"
      openclaw_version:
        description: "OpenClaw 版本，例如 latest、2026.9.6"
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: openclaw-lxc-ubuntu2404-${{ inputs.version }}-${{ inputs.openclaw_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            debootstrap \
            ubuntu-keyring \
            ca-certificates \
            curl \
            wget \
            gnupg \
            gzip \
            xz-utils \
            zstd \
            tar \
            jq \
            file \
            openssl \
            coreutils \
            util-linux \
            acl \
            attr \
            python3 \
            gh

          debootstrap --version
          gh --version
          python3 --version

      - name: Build and publish OpenClaw Ubuntu 24.04 LXC
        shell: bash
        run: |
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          VERSION="${INPUT_VERSION:-auto}"
          OPENCLAW_VERSION="${INPUT_OPENCLAW_VERSION:-latest}"

          if [ "$VERSION" = "auto" ]; then
            VERSION="$(date -u +'%Y.%m.%d-%H%M')"
          fi

          if ! printf '%s\n' "$VERSION" |
            grep -Eq '^[A-Za-z0-9._-]+$'
          then
            echo "错误：version 只能包含字母、数字、点、下划线和横线"
            exit 1
          fi

          if [ -z "$OPENCLAW_VERSION" ]; then
            echo "错误：OpenClaw 版本不能为空"
            exit 1
          fi

          IMAGE_PREFIX="openclaw-lxc-ubuntu2404"
          IMAGE_NAME="${IMAGE_PREFIX}-${VERSION}.tar.gz"

          WORK_DIR="$PWD/work"
          ROOTFS="$WORK_DIR/rootfs"
          DIST_DIR="$PWD/dist"

          INSTALL_SCRIPT="$WORK_DIR/install-inside-ubuntu2404.sh"
          MANAGER_SCRIPT="$WORK_DIR/openclaw-lxc-manager"

          mkdir -p "$WORK_DIR"
          mkdir -p "$DIST_DIR"

          cleanup_mounts() {
            set +e

            if [ -n "${ROOTFS:-}" ] && [ -d "$ROOTFS" ]; then
              sudo umount -R -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/sys" 2>/dev/null || true

              sudo umount -lf "$ROOTFS/dev/pts" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            fi
          }

          trap cleanup_mounts EXIT INT TERM

          echo "=================================================="
          echo "[1/9] 生成容器内部管理脚本（2026.9.6 契约）"
          echo "=================================================="

