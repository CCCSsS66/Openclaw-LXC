          sudo rm -f "$ROOTFS"/etc/ssh/ssh_host_* || true
          sudo rm -f "$ROOTFS/root/.bash_history" || true

          sudo rm -rf "$ROOTFS/var/tmp/"*

          cleanup_mounts
          trap - EXIT INT TERM

          if sudo findmnt -R "$ROOTFS" >/dev/null 2>&1; then
            echo "错误：rootfs 中仍然存在挂载点"
            sudo findmnt -R "$ROOTFS"
            exit 1
          fi

          sudo tee "$ROOTFS/etc/resolv.conf" >/dev/null <<'DNS_FILE'
          nameserver 223.5.5.5
          nameserver 119.29.29.29
          DNS_FILE

          echo "=================================================="
          echo "[8/9] 最终检查并打包"
          echo "=================================================="

          sudo grep -q \
            'VERSION_ID="24.04"' \
            "$ROOTFS/etc/os-release"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-lxc-manager"

          sudo test -x \
            "$ROOTFS/usr/local/sbin/openclaw-gateway-launch"

          sudo test -f \
            "$ROOTFS/etc/openclaw-gateway-command"

          sudo test -f \
            "$ROOTFS/etc/openclaw-control-ui-profile"

          sudo test -f \
            "$ROOTFS/etc/systemd/system/openclaw-firstboot.service"

          sudo test -f \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^User=root$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Group=root$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Type=simple$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^ExecStart=/usr/local/sbin/openclaw-gateway-launch$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Environment=OPENCLAW_NO_RESPAWN=1$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Environment=NODE_COMPILE_CACHE=/var/tmp/openclaw-compile-cache$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^Restart=always$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^RestartSec=5$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^RestartPreventExitStatus=78$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"

          if sudo grep -q \
            '^ExecStartPre=' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"
          then
            echo "错误：Gateway 服务中不允许存在 ExecStartPre"
            exit 1
          fi

          if sudo grep -q \
            '^Restart=on-failure$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"
          then
            echo "错误：Gateway 服务不能使用 Restart=on-failure"
            exit 1
          fi

          if ! sudo grep -q \
            '^RestartPreventExitStatus=78$' \
            "$ROOTFS/etc/systemd/system/openclaw-gateway.service"
          then
            echo "错误：Gateway 服务必须用 RestartPreventExitStatus=78 阻止无效配置重启循环"
            exit 1
          fi

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-api-setup"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-info"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-status"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-logs"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-restart"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-update"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-repair-max-permissions"

          sudo test -x \
            "$ROOTFS/usr/local/bin/openclaw-plugins"

          sudo test -f \
            "$ROOTFS/root/.openclaw/openclaw.json"

          sudo jq empty \
            "$ROOTFS/root/.openclaw/openclaw.json"

          sudo jq -e '
            .gateway.mode == "local" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .gateway.auth.mode == "token" and
            .gateway.auth.token == "${OPENCLAW_GATEWAY_TOKEN}" and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.host == "gateway" and
            (
              .tools.exec.mode == "full" or
              (
                .tools.exec.security == "full" and
                .tools.exec.ask == "off"
              )
            ) and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.allow? | not) and
            (.tools.deny? | not) and
            (.tools.exec.approvals? | not) and
            (.agents.defaults.tools? | not)
          ' "$ROOTFS/root/.openclaw/openclaw.json"

          sudo test \
            ! -e "$ROOTFS/root/.openclaw/.env"

          sudo test \
            ! -e "$ROOTFS/root/.openclaw/.lxc-initialized"

          sudo test -f \
            "$ROOTFS/etc/network/interfaces"

          sudo grep -Fq \
            'source /etc/network/interfaces.d/*' \
            "$ROOTFS/etc/network/interfaces"

          if sudo grep -R \
            'iface eth0 inet dhcp' \
            "$ROOTFS/etc/network/interfaces" \
            "$ROOTFS/etc/network/interfaces.d" \
            >/dev/null 2>&1
          then
            echo "错误：网络配置中发现 DHCP"
            exit 1
          fi

          sudo grep -q \
            'PasswordAuthentication yes' \
            "$ROOTFS/etc/ssh/sshd_config.d/99-openclaw-lxc.conf"

          sudo grep -q \
            'PermitRootLogin yes' \
            "$ROOTFS/etc/ssh/sshd_config.d/99-openclaw-lxc.conf"

          sudo grep -q \
            'net.ipv6.conf.all.disable_ipv6 = 1' \
            "$ROOTFS/etc/sysctl.d/99-openclaw-disable-ipv6.conf"

          sudo grep -q \
            'nameserver 223.5.5.5' \
            "$ROOTFS/etc/resolv.conf"

          rm -f "$DIST_DIR/$IMAGE_NAME"
          rm -f "$DIST_DIR/$IMAGE_NAME.sha256"

          sudo tar \
            --one-file-system \
            --numeric-owner \
            --xattrs \
            --acls \
            -cpf - \
            -C "$ROOTFS" . |
            gzip -9n >"$DIST_DIR/$IMAGE_NAME"

          sync

          test -s "$DIST_DIR/$IMAGE_NAME"

          file "$DIST_DIR/$IMAGE_NAME"
          gzip -t "$DIST_DIR/$IMAGE_NAME"
          tar -tzf "$DIST_DIR/$IMAGE_NAME" >/dev/null

          TEST_EXTRACT_DIR="$WORK_DIR/test-extract"

          sudo rm -rf "$TEST_EXTRACT_DIR"
          sudo mkdir -p "$TEST_EXTRACT_DIR"

          sudo tar \
            -xzf "$DIST_DIR/$IMAGE_NAME" \
            -C "$TEST_EXTRACT_DIR" \
            --numeric-owner \
            --acls \
            --xattrs \
            --warning=no-unknown-keyword

          sudo grep -q \
            'VERSION_ID="24.04"' \
            "$TEST_EXTRACT_DIR/etc/os-release"

          sudo test -x \
            "$TEST_EXTRACT_DIR/usr/local/sbin/openclaw-lxc-manager"

          sudo test -x \
            "$TEST_EXTRACT_DIR/usr/local/sbin/openclaw-gateway-launch"

          sudo test -f \
            "$TEST_EXTRACT_DIR/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^OPENCLAW_NO_RESPAWN=1$' \
            "$TEST_EXTRACT_DIR/etc/openclaw-lxc.env"

          sudo grep -q \
            '^Restart=always$' \
            "$TEST_EXTRACT_DIR/etc/systemd/system/openclaw-gateway.service"

          sudo grep -q \
            '^RestartPreventExitStatus=78$' \
            "$TEST_EXTRACT_DIR/etc/systemd/system/openclaw-gateway.service"

          sudo test -f \
            "$TEST_EXTRACT_DIR/root/.openclaw/openclaw.json"

          sudo test \
            ! -e "$TEST_EXTRACT_DIR/root/.openclaw/.env"

          sudo test \
            ! -e "$TEST_EXTRACT_DIR/root/.openclaw/.lxc-initialized"

          sudo jq -e '
            .gateway.auth.token == "${OPENCLAW_GATEWAY_TOKEN}" and
            .gateway.port == 18789 and
            .gateway.bind == "lan" and
            .tools.profile == "full" and
            .tools.elevated.enabled == true and
            .tools.exec.host == "gateway" and
            (
              .tools.exec.mode == "full" or
              (
                .tools.exec.security == "full" and
                .tools.exec.ask == "off"
              )
            ) and
            .agents.defaults.sandbox.mode == "off" and
            (.tools.exec.approvals? | not) and
            (.agents.defaults.tools? | not)
          ' "$TEST_EXTRACT_DIR/root/.openclaw/openclaw.json"

          sudo rm -rf "$TEST_EXTRACT_DIR"

          cd "$DIST_DIR"

          sha256sum "$IMAGE_NAME" >"$IMAGE_NAME.sha256"

          sha256sum -c "$IMAGE_NAME.sha256"
          gzip -t "$IMAGE_NAME"
          tar -tzf "$IMAGE_NAME" >/dev/null

          cat >README.md <<'RELEASE_README'
          # OpenClaw LXC Ubuntu 24.04 LTS (局域网最高权限直连版)

          ## 版本

          - OpenClaw：__OPENCLAW_VERSION__
          - Ubuntu：24.04 LTS Noble
          - Architecture：amd64
          - Node.js：24.16+ 或 26.1+（NodeSource 24.x LTS，兼容 OpenClaw 2026.9.6；官方推荐 Node 26）
          - Template version：__TEMPLATE_VERSION__
          - Gateway mode：__GATEWAY_MODE__

          ## 特性与权限

          - **无条件全部权限**：Tools Profile = Full, Elevated = True, Exec Mode = Full（兼容 legacy security/ask）, Host = Gateway, Sandbox = Off
          - **局域网免验证直连**：绑定 `lan` 接口，Control UI 动态放行当前 IP 及 hostname；优先尝试 full（InsecureAuth + DisableDeviceAuth），校验失败自动回退 basic / none
          - **自适应前台命令**：优先运行 `openclaw gateway run --port 18789`，不可用则回退 `openclaw gateway --port 18789`
          - **自适应 Exec 策略**：优先 `tools.exec.mode=full` + legacy `security/ask`，校验失败依次回退 mode-only / legacy
          - **模型协议自适应**：优先 `openai-completions`（官方对 /v1/chat/completions 的默认协议），校验失败回退 `openai-chat`、`openai-responses`
          - **外部监管**：`OPENCLAW_NO_RESPAWN=1` + `OPENCLAW_SERVICE_REPAIR_POLICY=external` + `OPENCLAW_SUPERVISOR_MODE=external`，由 systemd 负责重启
          - **安装兼容 2026.9.6+**：`npm install -g openclaw@... --allow-scripts=openclaw`

          ## 第一次使用

          ```bash
          openclaw-api-setup
          ```

          ## 显示地址和 Token

          ```bash
          openclaw-info
          ```

          ## 常用命令

          ```bash
          openclaw-status
          openclaw-logs
          openclaw-restart
          openclaw-plugins
          openclaw-update
          openclaw-update <版本号>
          openclaw-repair-max-permissions
          ```
          RELEASE_README

          sed -i \
            "s|__OPENCLAW_VERSION__|$ACTUAL_OPENCLAW_VERSION|g" \
            README.md

          sed -i \
            "s|__TEMPLATE_VERSION__|$VERSION|g" \
            README.md

          sed -i \
            "s|__GATEWAY_MODE__|$SELECTED_GATEWAY_MODE|g" \
            README.md

          ls -lh \
            "$IMAGE_NAME" \
            "$IMAGE_NAME.sha256" \
            README.md

          echo "=================================================="
          echo "[9/9] 上传 GitHub Release 并回下载校验 sha256 / tar"
          echo "=================================================="

          TAG="openclaw-lxc-ubuntu2404-${VERSION}"
          TITLE="OpenClaw LXC Ubuntu 24.04 LTS ${VERSION} / OpenClaw ${ACTUAL_OPENCLAW_VERSION}"

          gh auth status --hostname github.com || true

          if gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1
          then
            gh release edit \
              "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file README.md

            gh release upload \
              "$TAG" \
              "$IMAGE_NAME" \
              "$IMAGE_NAME.sha256" \
              README.md \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$IMAGE_NAME" \
              "$IMAGE_NAME.sha256" \
              README.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file README.md
          fi

          gh release view \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY"

          VERIFY_DIR="$(mktemp -d)"

          gh release download \
            "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$IMAGE_NAME" \
            --pattern "$IMAGE_NAME.sha256" \
            --dir "$VERIFY_DIR" \
            --clobber

          cd "$VERIFY_DIR"

          ls -lh \
            "$IMAGE_NAME" \
            "$IMAGE_NAME.sha256"

          sha256sum -c "$IMAGE_NAME.sha256"
          gzip -t "$IMAGE_NAME"
          tar -tzf "$IMAGE_NAME" >/dev/null

          cd /
          rm -rf "$VERIFY_DIR"

          echo "=================================================="
          echo "构建完成"
          echo "=================================================="
          echo "模板：$IMAGE_NAME"
          echo "系统：Ubuntu 24.04 LTS"
          echo "OpenClaw：$ACTUAL_OPENCLAW_VERSION"
          echo "Gateway mode：$SELECTED_GATEWAY_MODE"
          echo "Release Tag：$TAG"
          echo "Release 文件校验通过"
