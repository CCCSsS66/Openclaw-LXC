", "").replace(" ", "")

          Path(os.environ["GENERATED_INSTALL_PATH"]).write_text(
              base64.b64decode(raw).decode("utf-8"),
              encoding="utf-8",
          )
          PY_INSTALL

          chmod +x "$INSTALL_SCRIPT"

          bash -n "$INSTALL_SCRIPT"
          bash -n "$MANAGER_SCRIPT"

          echo "=================================================="
          echo "[3/9] debootstrap Ubuntu 24.04 LTS noble amd64 minbase"
          echo "=================================================="

          sudo rm -rf "$ROOTFS"
          sudo mkdir -p "$ROOTFS"

          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --components=main,restricted,universe,multiverse \
            noble \
            "$ROOTFS" \
            http://archive.ubuntu.com/ubuntu

          echo "=================================================="
          echo "[4/9] 挂载 chroot 环境"
          echo "=================================================="

          sudo mount -t proc proc "$ROOTFS/proc"

          sudo mount --rbind /sys "$ROOTFS/sys"
          sudo mount --make-rslave "$ROOTFS/sys"

          sudo mount --rbind /dev "$ROOTFS/dev"
          sudo mount --make-rslave "$ROOTFS/dev"

          sudo cp -L /etc/resolv.conf "$ROOTFS/etc/resolv.conf"

          printf 'OpenClaw\n' |
            sudo tee "$ROOTFS/etc/hostname" >/dev/null

          sudo tee "$ROOTFS/etc/hosts" >/dev/null <<'HOSTS_FILE'
          127.0.0.1 localhost
          127.0.1.1 OpenClaw

          ::1 localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters
          HOSTS_FILE

          echo "=================================================="
          echo "[5/9] 安装内部脚本并安装 OpenClaw"
          echo "=================================================="

          sudo mkdir -p "$ROOTFS/usr/local/sbin"

          sudo install \
            -m 0755 \
            "$MANAGER_SCRIPT" \
            "$ROOTFS/usr/local/sbin/openclaw-lxc-manager"

          sudo install \
            -m 0755 \
            "$INSTALL_SCRIPT" \
            "$ROOTFS/tmp/install-inside-ubuntu2404.sh"

          sudo chroot "$ROOTFS" \
            /bin/bash -n \
            /usr/local/sbin/openclaw-lxc-manager

          sudo chroot "$ROOTFS" \
            /bin/bash -n \
            /tmp/install-inside-ubuntu2404.sh

          sudo chroot "$ROOTFS" \
            /usr/bin/env \
            OPENCLAW_VERSION="$OPENCLAW_VERSION" \
            /bin/bash \
            /tmp/install-inside-ubuntu2404.sh

          echo "=================================================="
          echo "[6/9] 初始化 2026.9.6 最高权限配置并实测 Gateway 前台命令"
          echo "=================================================="

          sudo chroot "$ROOTFS" \
            /usr/local/sbin/openclaw-lxc-manager \
            build-init

          sudo chroot "$ROOTFS" \
            /usr/local/sbin/openclaw-lxc-manager \
            validate

          sudo chroot "$ROOTFS" \
            systemd-analyze verify \
            openclaw-firstboot.service \
            openclaw-gateway.service

          sudo chroot "$ROOTFS" \
            jq -e '
              .gateway.mode == "local" and
              .gateway.port == 18789 and
              .gateway.bind == "lan" and
              .gateway.auth.mode == "token" and
              .gateway.auth.token == "${OPENCLAW_GATEWAY_TOKEN}" and
              .tools.profile == "full" and
              .tools.elevated.enabled == true and
              .tools.exec.host == "gateway" and
              (
                .tools.exec.mode == "full" or
                (
                  .tools.exec.security == "full" and
                  .tools.exec.ask == "off"
                )
              ) and
              .agents.defaults.sandbox.mode == "off" and
              (.tools.allow? | not) and
              (.tools.deny? | not) and
              (.tools.exec.approvals? | not) and
              (.agents.defaults.tools? | not)
            ' /root/.openclaw/openclaw.json

          sudo chroot "$ROOTFS" \
            /usr/local/sbin/openclaw-lxc-manager \
            select-gateway-command

          sudo chroot "$ROOTFS" \
            /usr/local/sbin/openclaw-lxc-manager \
            smoke-test

          ACTUAL_OPENCLAW_VERSION="$(
            sudo jq -r \
              '.openclawVersion' \
              "$ROOTFS/etc/openclaw-build-info.json"
          )"

          SELECTED_GATEWAY_MODE="$(
            sudo tr -d '[:space:]' \
              <"$ROOTFS/etc/openclaw-gateway-command"
          )"

          echo "实际安装 OpenClaw：$ACTUAL_OPENCLAW_VERSION"
          echo "Gateway 运行模式：$SELECTED_GATEWAY_MODE"

          echo "=================================================="
          echo "[7/9] 重置首次启动状态并卸载 chroot"
          echo "=================================================="

          sudo chroot "$ROOTFS" \
            /usr/local/sbin/openclaw-lxc-manager \
            template-reset

          sudo rm -f \
            "$ROOTFS/tmp/install-inside-ubuntu2404.sh"

          sudo rm -f \
            "$ROOTFS/tmp/openclaw-gateway-"* \
            2>/dev/null ||
            true

          sudo rm -f "$ROOTFS/etc/machine-id"
          sudo touch "$ROOTFS/etc/machine-id"

