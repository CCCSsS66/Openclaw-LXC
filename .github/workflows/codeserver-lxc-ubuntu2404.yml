name: Build code-server LXC Ubuntu 24.04

##############################################################################
# Ubuntu 24.04 LTS / amd64 Proxmox LXC template: code-server
# Latest stable upstream release, Chinese locale, automatic startup, random
# first-boot password, static IPv4 only, smoke tests, archive validation,
# SHA-256 checksum and GitHub Release publishing.
##############################################################################

'on':
  workflow_dispatch:
    inputs:
      version:
        description: "模板版本号（auto = 使用 UTC 时间戳；code-server 始终安装最新正式版）"
        required: true
        default: "auto"

permissions:
  contents: write

concurrency:
  group: codeserver-lxc-ubuntu2404-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap ubuntu-keyring ca-certificates curl wget gnupg \
            gzip xz-utils zstd tar jq file openssl coreutils util-linux \
            acl attr python3 gh
          debootstrap --version
          gh --version
          python3 --version

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Build, verify and publish code-server LXC template
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          VERSION="${INPUT_VERSION:-auto}"
          if [ "$VERSION" = auto ]; then VERSION="$(date -u +'%Y.%m.%d-%H%M%S')"; fi
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid template version: $VERSION" >&2
            exit 1
          fi

          IMAGE_PREFIX=codeserver-lxc-ubuntu2404
          IMAGE_NAME="${IMAGE_PREFIX}-${VERSION}.tar.gz"
          WORK_DIR="$PWD/work"
          ROOTFS="$WORK_DIR/rootfs"
          DIST_DIR="$PWD/dist"
          VERIFY_DIR="$WORK_DIR/archive-check"
          DOWNLOAD_DIR="$WORK_DIR/release-download"
          MANAGER_SCRIPT="$WORK_DIR/code-server-lxc-manager"
          INSTALL_SCRIPT="$WORK_DIR/install-inside-ubuntu2404.sh"
          CODE_SERVER_DEB="$WORK_DIR/code-server.deb"
          mkdir -p "$WORK_DIR" "$DIST_DIR"
          for path in "$ROOTFS" "$VERIFY_DIR" "$DOWNLOAD_DIR" "$MANAGER_SCRIPT" "$INSTALL_SCRIPT" "$CODE_SERVER_DEB"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Refusing to overwrite build path: $path" >&2
              exit 1
            fi
          done
          for path in "$DIST_DIR/$IMAGE_NAME" "$DIST_DIR/$IMAGE_NAME.sha256" "$DIST_DIR/README.md"; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Refusing to overwrite artifact: $path" >&2
              exit 1
            fi
          done

          # Resolve the current non-prerelease upstream release and verify the
          # official amd64 Debian package against GitHub's published SHA-256.
          RELEASE_JSON="$(gh api repos/coder/code-server/releases/latest)"
          RELEASE_TAG="$(jq -er '.tag_name' <<<"$RELEASE_JSON")"
          CODE_SERVER_VERSION="${RELEASE_TAG#v}"
          if ! [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Unexpected code-server release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          DEB_NAME="code-server_${CODE_SERVER_VERSION}_amd64.deb"
          RELEASE_ASSET="$(jq -cer --arg name "$DEB_NAME" '.assets[] | select(.name == $name)' <<<"$RELEASE_JSON")"
          DEB_URL="$(jq -er '.browser_download_url' <<<"$RELEASE_ASSET")"
          DEB_DIGEST="$(jq -r '.digest // empty' <<<"$RELEASE_ASSET")"
          if [[ "$DEB_URL" != https://github.com/coder/code-server/releases/download/* ]]; then
            echo "Unexpected code-server package URL: $DEB_URL" >&2
            exit 1
          fi
          if [ -n "$DEB_DIGEST" ] && ! [[ "$DEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected code-server package digest: $DEB_DIGEST" >&2
            exit 1
          fi
          echo "Latest stable code-server release: $RELEASE_TAG"
          curl --fail --location --retry 5 --retry-all-errors --output "$CODE_SERVER_DEB" "$DEB_URL"
          if [ -n "$DEB_DIGEST" ]; then
            printf '%s  %s\n' "${DEB_DIGEST#sha256:}" "$CODE_SERVER_DEB" | sha256sum --check -
          else
            echo 'GitHub did not publish an asset digest; validating Debian package metadata.' >&2
          fi
          [ "$(dpkg-deb -f "$CODE_SERVER_DEB" Package)" = code-server ]
          [ "$(dpkg-deb -f "$CODE_SERVER_DEB" Architecture)" = amd64 ]
          [ "$(dpkg-deb -f "$CODE_SERVER_DEB" Version)" = "$CODE_SERVER_VERSION" ]

          cleanup_mounts() {
            if [ -d "$ROOTFS" ]; then
              sudo umount -R -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -R -lf "$ROOTFS/sys" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
              sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            fi
          }
          trap cleanup_mounts EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          cat >"$MANAGER_SCRIPT" <<'MANAGER_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 077

          CONFIG_FILE=/etc/code-server/config.yaml
          INFO_FILE=/root/code-server-info.txt
          MARKER_FILE=/var/lib/code-server/.lxc-initialized
          BUILD_INFO=/etc/code-server-build-info.json
          SERVICE=code-server.service
          PORT=8080

          log() { printf '[code-server-lxc] %s\n' "$*"; }
          die() { printf '[code-server-lxc][error] %s\n' "$*" >&2; exit 1; }
          require_root() { [ "$(id -u)" -eq 0 ] || die 'Run this command as root'; }
          get_ipv4() {
            ip -4 -o addr show scope global 2>/dev/null |
              awk 'NR == 1 { split($4, a, "/"); print a[1] }' || true
          }
          read_password() {
            [ -s "$CONFIG_FILE" ] || return 0
            sed -n 's/^password: "\([a-f0-9]*\)"$/\1/p' "$CONFIG_FILE" | tail -n 1
          }
          write_password() {
            local password="$1" tmp
            [[ "$password" =~ ^[a-f0-9]{64}$ ]] || die 'Refusing invalid password value'
            install -d -o root -g root -m 0700 /etc/code-server
            tmp="$(mktemp /etc/code-server/.config.yaml.XXXXXX)"
            cat >"$tmp" <<CONFIG_EOF
          bind-addr: 0.0.0.0:${PORT}
          auth: password
          password: "${password}"
          cert: false
          locale: zh-CN
          disable-telemetry: true
          disable-update-check: true
          disable-getting-started-override: true
          CONFIG_EOF
            chown root:root "$tmp"
            chmod 0600 "$tmp"
            mv -f "$tmp" "$CONFIG_FILE"
          }
          refresh_info() {
            local ipv4 password version tmp
            ipv4="$(get_ipv4)"
            password="$(read_password)"
            version="$(jq -r '.codeServerVersion // "unknown"' "$BUILD_INFO" 2>/dev/null || echo unknown)"
            tmp="$(mktemp /root/.code-server-info.XXXXXX)"
            {
              echo '============================================================'
              echo ' code-server - Ubuntu 24.04 LTS'
              echo '============================================================'
              printf 'code-server: %s\n' "$version"
              echo '系统语言环境：zh_CN.UTF-8；时区：Asia/Shanghai'
              echo
              echo '访问地址：'
              if [ -n "$ipv4" ]; then
                printf '  http://%s:%s/\n' "$ipv4" "$PORT"
              else
                echo '  尚无全局 IPv4；请在 Proxmox 中设置静态 IPv4 后执行 code-server-info。'
              fi
              echo
              echo '登录密码（仅 root 可读取）：'
              printf '  %s\n' "${password:-尚未生成（首次启动时自动生成）}"
              echo
              echo '网络策略：DHCP/RA/IPv6 自动配置已禁用；请使用静态 IPv4。'
              echo '安全提示：密码等同登录凭据；HTTP 不加密，请仅在可信网络使用或配置 TLS 反向代理。'
              echo
              echo '管理命令：code-server-info | code-server-status | code-server-logs'
              echo '          code-server-restart | code-server-password-reset'
              echo '工作目录：/srv/codeserver/workspace'
              echo '============================================================'
            } >"$tmp"
            chown root:root "$tmp"
            chmod 0600 "$tmp"
            mv -f "$tmp" "$INFO_FILE"
          }
          show_info() { refresh_info; cat "$INFO_FILE"; }
          firstboot() {
            install -d -o root -g root -m 0700 /etc/code-server
            install -d -o root -g root -m 0700 \
              /root/.config/code-server /root/.local/share/code-server \
              /var/lib/code-server
            install -d -o root -g root -m 0755 /srv/codeserver/workspace
            if [ -z "$(read_password)" ]; then
              write_password "$(openssl rand -hex 32)"
              log 'Generated a fresh 256-bit code-server password'
            fi
            refresh_info
            install -o root -g root -m 0600 /dev/null "$MARKER_FILE"
            log 'First boot initialized; login details follow (also available with code-server-info):'
            cat "$INFO_FILE"
          }
          build_init() {
            [ -n "$(read_password)" ] || write_password "$(openssl rand -hex 32)"
            refresh_info
          }
          wait_ready() {
            local port="${1:-$PORT}" response
            for _ in $(seq 1 60); do
              response="$(curl -fsS --connect-timeout 2 --max-time 5 "http://127.0.0.1:${port}/healthz" 2>/dev/null || true)"
              # /healthz reports "expired" until a browser connection has
              # caused a heartbeat; that is still a healthy HTTP response.
              if [ -n "$response" ] && jq -e \
                '(.status == "alive" or .status == "expired") and (.lastHeartbeat | type == "number")' \
                >/dev/null 2>&1 <<<"$response"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          smoke_test() {
            local home log_file pid='' port=18888
            home="$(mktemp -d /tmp/code-server-smoke-home.XXXXXX)"
            log_file=/tmp/code-server-smoke.log
            mkdir -p "$home/workspace" "$home/.config" "$home/.local/share"
            chown -R root:root "$home"
            if ss -H -lnt "sport = :${port}" 2>/dev/null | grep -q .; then
              die "Smoke-test port ${port} is already in use"
            fi
            setsid env \
              HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" \
              /usr/bin/code-server --config="$CONFIG_FILE" --bind-addr="127.0.0.1:${port}" \
              "$home/workspace" >"$log_file" 2>&1 &
            pid=$!
            cleanup() {
              if [ -n "$pid" ]; then
                kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
                for _ in $(seq 1 15); do
                  kill -0 "$pid" 2>/dev/null || break
                  sleep 1
                done
                kill -KILL -- "-$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
              rm -rf -- "$home"
            }
            trap cleanup EXIT
            if ! wait_ready "$port"; then
              cat "$log_file" >&2 || true
              die 'code-server failed its HTTP /healthz smoke test'
            fi
            kill -0 "$pid" 2>/dev/null || die 'code-server exited after becoming ready'
            log 'code-server HTTP /healthz smoke test passed'
            cleanup
            trap - EXIT
          }
          template_reset() {
            rm -f -- "$CONFIG_FILE" "$MARKER_FILE" "$INFO_FILE" /tmp/code-server-smoke.log
            log 'Removed build password, first-boot marker and root login details'
          }
          show_status() {
            echo '=== code-server systemd service ==='
            systemctl status "$SERVICE" --no-pager || true
            echo '=== Versions ==='
            /usr/bin/code-server --version || true
            /usr/bin/python3 --version || true
            echo '=== IPv4 listener ==='
            ss -lntp | grep ":${PORT}" || true
            show_info
          }
          reset_password() {
            write_password "$(openssl rand -hex 32)"
            systemctl restart "$SERVICE"
            wait_ready "$PORT" || die 'code-server did not become ready after password reset'
            show_info
          }

          require_root
          invoked="$(basename "$0")"
          if [ "$invoked" = code-server-lxc-manager ]; then
            command_name="${1:-help}"
            [ "$#" -eq 0 ] || shift
          else
            command_name="$invoked"
          fi
          case "$command_name" in
            firstboot) firstboot ;;
            build-init) build_init ;;
            smoke-test) smoke_test ;;
            template-reset) template_reset ;;
            code-server-info|info) show_info ;;
            code-server-status|status) show_status ;;
            code-server-logs|logs) exec journalctl -u "$SERVICE" -f ;;
            code-server-restart|restart)
              systemctl restart "$SERVICE"
              wait_ready "$PORT" || die 'code-server did not become ready'
              show_info
              ;;
            code-server-password-reset|password-reset) reset_password ;;
            *)
              cat <<'USAGE'
          code-server LXC manager (run as root)
            code-server-info             Show the URL and login password
            code-server-status           Show service, versions and address
            code-server-logs             Follow service logs
            code-server-restart          Restart code-server
            code-server-password-reset   Generate a new password and restart
          USAGE
              exit 1
              ;;
          esac
          MANAGER_EOF
          chmod 0755 "$MANAGER_SCRIPT"

          cat >"$INSTALL_SCRIPT" <<'INSTALL_EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          umask 022
          export DEBIAN_FRONTEND=noninteractive
          TEMPLATE_VERSION="${TEMPLATE_VERSION:?TEMPLATE_VERSION is required}"
          CODE_SERVER_VERSION="${CODE_SERVER_VERSION:?CODE_SERVER_VERSION is required}"

          # Some unprivileged Proxmox LXC containers do not allow APT to switch
          # its download helpers to _apt (seteuid fails with EPERM).
          echo 'APT::Sandbox::User "root";' >/etc/apt/apt.conf.d/99-lxc-root-acquire

          # Mainland China Ubuntu mirror, used both during provisioning and in the guest.
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -print0 |
            xargs -0 -r sed -i -E \
              's#https?://[^/]*(archive|security).ubuntu.com/ubuntu/?#https://mirrors.tuna.tsinghua.edu.cn/ubuntu#g'

          # Enable Ubuntu universe so Python virtualenv/development packages are available.
          cat >/etc/apt/sources.list.d/ubuntu-universe.sources <<'APT_UNIVERSE_EOF'
          Types: deb
          URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
          Suites: noble
          Components: universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
          Suites: noble-updates noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT_UNIVERSE_EOF

          cat >/usr/sbin/policy-rc.d <<'POLICY_EOF'
          #!/bin/sh
          exit 101
          POLICY_EOF
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl jq openssl iproute2 iputils-ping procps psmisc \
            util-linux sed gawk grep coreutils findutils tar gzip xz-utils \
            locales tzdata systemd systemd-sysv dbus dbus-user-session \
            python3 python3-venv python3-pip build-essential pkg-config \
            git wget unzip zip ripgrep fd-find

          # Install the verified official amd64 .deb and resolve its system dependencies.
          [ -s /root/code-server.deb ] || { echo 'Missing verified code-server package' >&2; exit 1; }
          [ "$(dpkg-deb -f /root/code-server.deb Package)" = code-server ]
          [ "$(dpkg-deb -f /root/code-server.deb Architecture)" = amd64 ]
          [ "$(dpkg-deb -f /root/code-server.deb Version)" = "$CODE_SERVER_VERSION" ]
          apt-get install -y --no-install-recommends /root/code-server.deb
          INSTALLED_CODE_SERVER_VERSION="$(dpkg-query -W -f='${Version}' code-server)"
          [ "$INSTALLED_CODE_SERVER_VERSION" = "$CODE_SERVER_VERSION" ]

          # Remove DHCP client software if it was pulled in by a dependency.
          for package in isc-dhcp-client isc-dhcp-common dhcpcd dhcpcd5 dhcpcd-base udhcpc network-manager; do
            if [ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" = installed ]; then
              apt-get purge -y "$package"
            fi
          done

          if ! grep -Eq '^#? *zh_CN.UTF-8 UTF-8$' /etc/locale.gen; then
            printf '%s\n' 'zh_CN.UTF-8 UTF-8' >>/etc/locale.gen
          fi
          sed -i -E 's/^# *zh_CN.UTF-8 UTF-8$/zh_CN.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LANGUAGE=zh_CN:zh
          ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          printf '%s\n' 'Asia/Shanghai' >/etc/timezone

          # Disable IPv6, RA, SLAAC, link-local and DHCPv6 at kernel level.
          install -d -m 0755 /etc/sysctl.d
          cat >/etc/sysctl.d/99-codeserver-lxc-network.conf <<'SYSCTL_EOF'
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
          net.ipv6.conf.eth0.disable_ipv6 = 1
          net.ipv6.conf.all.accept_ra = 0
          net.ipv6.conf.default.accept_ra = 0
          net.ipv6.conf.eth0.accept_ra = 0
          net.ipv6.conf.all.autoconf = 0
          net.ipv6.conf.default.autoconf = 0
          net.ipv6.conf.eth0.autoconf = 0
          net.ipv6.conf.all.use_tempaddr = 0
          net.ipv6.conf.default.use_tempaddr = 0
          SYSCTL_EOF
          # Keep systemd-networkd available for Proxmox-managed static IPv4.

          echo 'Acquire::Retries "3";' >/etc/apt/apt.conf.d/80-retries
          # The service intentionally runs as root so VS Code terminals open
          # with the root shell instead of an nologin service-account shell.
          # Keep authentication enabled and the config readable only by root.
          install -d -o root -g root -m 0700 /etc/code-server
          install -d -o root -g root -m 0700 \
            /root/.config/code-server /root/.local/share/code-server \
            /var/lib/code-server
          install -d -o root -g root -m 0755 /srv/codeserver/workspace

          install -d -o root -g root -m 0755 /usr/local/sbin /usr/local/bin /usr/local/libexec
          install -o root -g root -m 0755 /root/code-server-lxc-manager /usr/local/sbin/code-server-lxc-manager
          for command_name in code-server-info code-server-status code-server-logs code-server-restart code-server-password-reset; do
            ln -sfn /usr/local/sbin/code-server-lxc-manager "/usr/local/bin/${command_name}"
          done

          cat >/etc/systemd/system/code-server-firstboot.service <<'FIRSTBOOT_UNIT_EOF'
          [Unit]
          Description=Initialize code-server LXC instance and generate login password
          After=local-fs.target
          Before=code-server.service
          ConditionPathExists=!/var/lib/code-server/.lxc-initialized

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/code-server-lxc-manager firstboot
          RemainAfterExit=yes
          TimeoutStartSec=60

          [Install]
          WantedBy=multi-user.target
          FIRSTBOOT_UNIT_EOF

          cat >/etc/systemd/system/code-server.service <<'CODESERVER_UNIT_EOF'
          [Unit]
          Description=code-server browser-based development environment
          After=network.target code-server-firstboot.service
          Requires=code-server-firstboot.service
          StartLimitIntervalSec=300
          StartLimitBurst=10

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/srv/codeserver/workspace
          Environment=HOME=/root
          Environment=SHELL=/bin/bash
          Environment=LANG=zh_CN.UTF-8
          Environment=LC_ALL=zh_CN.UTF-8
          Environment=TZ=Asia/Shanghai
          ExecStart=/usr/bin/code-server --config=/etc/code-server/config.yaml /srv/codeserver/workspace
          Restart=on-failure
          RestartSec=5
          TimeoutStartSec=120
          TimeoutStopSec=30
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          LockPersonality=true
          ReadWritePaths=/root /srv/codeserver/workspace /var/lib/code-server

          [Install]
          WantedBy=multi-user.target
          CODESERVER_UNIT_EOF

          # Show login details only in the root login MOTD.
          install -d -o root -g root -m 0755 /etc/update-motd.d
          cat >/etc/update-motd.d/99-code-server-info <<'MOTD_EOF'
          #!/bin/sh
          [ "$(id -u)" -eq 0 ] || exit 0
          [ -x /usr/local/sbin/code-server-lxc-manager ] && /usr/local/sbin/code-server-lxc-manager info
          MOTD_EOF
          chmod 0755 /etc/update-motd.d/99-code-server-info

          printf '%s\n' codeserver >/etc/hostname
          cat >/etc/hosts <<'HOSTS_EOF'
          127.0.0.1 localhost
          127.0.1.1 codeserver
          HOSTS_EOF
          rm -f /etc/machine-id /var/lib/dbus/machine-id
          install -d -o root -g root -m 0755 /var/lib/dbus
          : >/etc/machine-id
          chmod 0444 /etc/machine-id
          ln -s /etc/machine-id /var/lib/dbus/machine-id

          jq -n \
            --arg templateVersion "$TEMPLATE_VERSION" \
            --arg codeServerVersion "$INSTALLED_CODE_SERVER_VERSION" \
            --arg pythonVersion "$(python3 --version 2>&1)" \
            --arg builtAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{templateVersion:$templateVersion,codeServerVersion:$codeServerVersion,pythonVersion:$pythonVersion,distribution:"Ubuntu 24.04 LTS",codename:"noble",architecture:"amd64",locale:"zh_CN.UTF-8",timezone:"Asia/Shanghai",builtAt:$builtAt}' \
            >/etc/code-server-build-info.json
          chmod 0644 /etc/code-server-build-info.json

          rm -f /usr/sbin/policy-rc.d
          rm -f /etc/resolv.conf
          : >/etc/resolv.conf
          chmod 0644 /etc/resolv.conf
          apt-get clean
          rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* /tmp/* /var/tmp/*
          # APT expects these writable queues to exist after the template is booted.
          install -d -o root -g root -m 0755 \
            /var/lib/apt/lists/partial /var/cache/apt/archives/partial
          rm -f /root/.bash_history /root/.wget-hsts
          rm -rf /root/.ssh
          echo "Provisioned code-server ${INSTALLED_CODE_SERVER_VERSION}, $(python3 --version 2>&1)"
          INSTALL_EOF
          chmod 0755 "$INSTALL_SCRIPT"

          echo '[1/6] debootstrap Ubuntu 24.04 noble amd64 from TUNA mirror'
          mkdir -p "$ROOTFS"
          sudo debootstrap --arch=amd64 --variant=minbase \
            --keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg \
            noble "$ROOTFS" https://mirrors.tuna.tsinghua.edu.cn/ubuntu

          echo '[2/6] Mount chroot filesystems'
          sudo install -d "$ROOTFS/dev/pts" "$ROOTFS/proc" "$ROOTFS/sys" "$ROOTFS/run"
          sudo rm -f "$ROOTFS/etc/resolv.conf"
          sudo install -m 0644 /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount --rbind /sys "$ROOTFS/sys"
          sudo mount --make-rslave "$ROOTFS/sys"
          sudo mount --rbind /dev "$ROOTFS/dev"
          sudo mount --make-rslave "$ROOTFS/dev"

          echo '[3/6] Install latest code-server and development environment'
          sudo install -o root -g root -m 0644 "$CODE_SERVER_DEB" "$ROOTFS/root/code-server.deb"
          sudo install -o root -g root -m 0755 "$MANAGER_SCRIPT" "$ROOTFS/root/code-server-lxc-manager"
          sudo install -o root -g root -m 0755 "$INSTALL_SCRIPT" "$ROOTFS/root/install-inside-ubuntu2404.sh"
          sudo chroot "$ROOTFS" /usr/bin/env \
            TEMPLATE_VERSION="$VERSION" CODE_SERVER_VERSION="$CODE_SERVER_VERSION" \
            /bin/bash /root/install-inside-ubuntu2404.sh
          sudo systemctl --root="$ROOTFS" enable code-server-firstboot.service code-server.service
          sudo chroot "$ROOTFS" systemd-analyze verify \
            /etc/systemd/system/code-server-firstboot.service \
            /etc/systemd/system/code-server.service
          sudo chroot "$ROOTFS" /bin/bash -n /usr/local/sbin/code-server-lxc-manager
          sudo chroot "$ROOTFS" /usr/bin/python3 -m json.tool /etc/code-server-build-info.json >/dev/null

          echo '[4/6] Initialize a temporary password and smoke-test code-server'
          sudo chroot "$ROOTFS" /usr/local/sbin/code-server-lxc-manager build-init
          sudo chroot "$ROOTFS" /usr/local/sbin/code-server-lxc-manager smoke-test
          sudo chroot "$ROOTFS" /usr/local/sbin/code-server-lxc-manager template-reset

          echo '[5/6] Clean template instance state and build residue'
          sudo rm -f "$ROOTFS/root/code-server-lxc-manager" \
            "$ROOTFS/root/install-inside-ubuntu2404.sh" "$ROOTFS/root/code-server.deb" \
            "$ROOTFS/etc/resolv.conf" "$ROOTFS/var/lib/systemd/random-seed"
          sudo install -o root -g root -m 0644 /dev/null "$ROOTFS/etc/resolv.conf"
          sudo find "$ROOTFS/var/log" -type f -exec truncate -s 0 {} \;
          sudo find "$ROOTFS" -xdev \( -name '.cache' -o -name '__pycache__' \) \
            -type d -prune -exec rm -rf -- {} +
          sudo rm -rf "$ROOTFS/var/lib/apt/lists"/* "$ROOTFS/var/cache/apt/archives"/*
          sudo rm -f "$ROOTFS/etc/ssh/ssh_host_"* 2>/dev/null || true
          sudo rm -f "$ROOTFS/etc/machine-id" "$ROOTFS/var/lib/dbus/machine-id"
          sudo install -o root -g root -m 0444 /dev/null "$ROOTFS/etc/machine-id"
          sudo ln -s /etc/machine-id "$ROOTFS/var/lib/dbus/machine-id"
          sudo sync
          cleanup_mounts
          trap - EXIT INT TERM

          sudo test ! -e "$ROOTFS/etc/code-server/config.yaml"
          sudo test ! -e "$ROOTFS/var/lib/code-server/.lxc-initialized"
          sudo test ! -e "$ROOTFS/root/code-server-info.txt"
          sudo test -L "$ROOTFS/etc/systemd/system/multi-user.target.wants/code-server.service"
          sudo grep -q 'disable_ipv6 = 1' "$ROOTFS/etc/sysctl.d/99-codeserver-lxc-network.conf"
          sudo grep -q 'accept_ra = 0' "$ROOTFS/etc/sysctl.d/99-codeserver-lxc-network.conf"
          for unit in systemd-networkd.service systemd-networkd.socket; do
            if [ -L "$ROOTFS/etc/systemd/system/$unit" ] && \
              [ "$(readlink "$ROOTFS/etc/systemd/system/$unit")" = /dev/null ]; then
              echo "Proxmox network unit is unexpectedly masked: $unit" >&2
              exit 1
            fi
          done
          for package in isc-dhcp-client isc-dhcp-common dhcpcd dhcpcd5 dhcpcd-base udhcpc network-manager; do
            if sudo chroot "$ROOTFS" dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null | grep -qx installed; then
              echo "Unexpected DHCP/network manager package in rootfs: $package" >&2
              exit 1
            fi
          done

          echo '[6/6] Pack, verify archive, checksum and publish Release'
          IMAGE_PATH="$DIST_DIR/$IMAGE_NAME"
          sudo tar --numeric-owner --acls --xattrs --xattrs-include='*' \
            --hard-dereference --sparse -czf "$IMAGE_PATH" -C "$ROOTFS" .

          python3 - "$IMAGE_PATH" <<'ARCHIVE_CHECK_EOF'
          import sys, tarfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          required = {
              'etc/systemd/system/code-server.service',
              'etc/systemd/system/code-server-firstboot.service',
              'etc/sysctl.d/99-codeserver-lxc-network.conf',
              'etc/code-server-build-info.json',
              'usr/bin/code-server',
          }
          seen = set()
          count = 0
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf:
                  count += 1
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe path in archive: {member.name!r}')
                  name = '/'.join(part for part in path.parts if part not in ('', '.', '/'))
                  if name:
                      seen.add(name)
                  if member.isfile():
                      stream = tf.extractfile(member)
                      if stream is None:
                          raise SystemExit(f'unreadable archive member: {member.name!r}')
                      size = 0
                      while chunk := stream.read(1024 * 1024):
                          size += len(chunk)
                      if size != member.size:
                          raise SystemExit(f'truncated archive member: {member.name!r}')
                  elif member.issym():
                      if not member.linkname:
                          raise SystemExit(f'empty symlink target: {member.name!r}')
                  elif member.islnk():
                      target = PurePosixPath(member.linkname)
                      if target.is_absolute() or '..' in target.parts:
                          raise SystemExit(f'unsafe hardlink target: {member.linkname!r}')
                  elif not (member.isdir() or member.ischr()):
                      raise SystemExit(f'unexpected archive entry: {member.name!r}')
          missing = required - seen
          if missing:
              raise SystemExit(f'missing required template files: {sorted(missing)}')
          if count < 1000:
              raise SystemExit(f'archive unexpectedly small: {count} entries')
          print(f'Validated and fully read {count} archive members')
          ARCHIVE_CHECK_EOF

          (cd "$DIST_DIR" && sha256sum "$IMAGE_NAME" >"$IMAGE_NAME.sha256")
          (cd "$DIST_DIR" && sha256sum --check "$IMAGE_NAME.sha256")
          python3 - "$IMAGE_PATH" <<'ARCHIVE_ROOT_EOF'
          import sys, tarfile
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              roots = {m.name.removeprefix('./').split('/', 1)[0] for m in archive}
          required = {'etc', 'usr', 'opt', 'var', 'srv', 'root'}
          if required - roots or 'rootfs' in roots:
              raise SystemExit(f'not a direct Proxmox rootfs archive: {roots}')
          print('Verified Proxmox rootfs archive layout')
          ARCHIVE_ROOT_EOF

          cat >"$DIST_DIR/README.md" <<README_EOF
          # code-server LXC - Ubuntu 24.04

          - Template: \`$VERSION\`
          - code-server: \`$CODE_SERVER_VERSION\` (latest stable upstream release at build time)
          - Base: Ubuntu 24.04 LTS (noble), amd64
          - Archive: \`$IMAGE_NAME\`

          ## Proxmox network setup (important)

          DHCP, IPv6, SLAAC and Router Advertisements are disabled. The guest does not request
          any IPv4/IPv6 address. In Proxmox CT network settings, assign a **static IPv4**
          address and gateway (or configure the equivalent static address on the host-managed
          veth). Do not select DHCP. IPv6 should be unset. Configure DNS statically in Proxmox.
          Without a static IPv4 the service runs, but there is no remote access URL.

          ## Access and first boot

          code-server starts automatically on TCP 8080. First boot generates a random 256-bit
          password. The first-boot journal and root login MOTD show the access URL and password;
          run \`code-server-info\` as root to display them again. Use \`code-server-status\` for
          service status, \`code-server-logs\` for logs, and \`code-server-password-reset\` to
          rotate the password. Password and saved login information are readable only by root.

          **Security warning:** code-server and its integrated terminal run as root with full
          container privileges. Keep it on a trusted network, use a strong password, and prefer
          access through a TLS reverse proxy. Do not expose port 8080 directly to the internet.

          The URL uses plain HTTP. Keep port 8080 on a trusted network or place code-server
          behind a TLS-terminating reverse proxy. Do not share the password. Some browser
          features require HTTPS or localhost secure context.

          ## Included environment

          Latest stable official code-server amd64 Debian package, Python 3 with venv/pip,
          build tools, Git, ripgrep, fd-find and common command-line utilities. Ubuntu packages
          use the Tsinghua Ubuntu mirror. Locale is zh_CN.UTF-8, timezone is Asia/Shanghai, and
          the initial workspace is \`/srv/codeserver/workspace\`.

          Verify the archive with \`$IMAGE_NAME.sha256\` before importing it.
          README generated at $(date -u +'%Y-%m-%dT%H:%M:%SZ').
          README_EOF

          ls -lh "$DIST_DIR/$IMAGE_NAME" "$DIST_DIR/$IMAGE_NAME.sha256" "$DIST_DIR/README.md"
          RELEASE_NAME="${IMAGE_PREFIX}-${VERSION}"
          gh auth status
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite: $RELEASE_NAME" >&2
            exit 1
          fi
          gh release create "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "code-server LXC Ubuntu 24.04 ${VERSION}" \
            --notes-file "$DIST_DIR/README.md" \
            "$DIST_DIR/$IMAGE_NAME" "$DIST_DIR/$IMAGE_NAME.sha256" "$DIST_DIR/README.md"
          mkdir -p "$DOWNLOAD_DIR"
          gh release download "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$DOWNLOAD_DIR" --pattern "$IMAGE_NAME" --pattern "$IMAGE_NAME.sha256"
          (cd "$DOWNLOAD_DIR" && sha256sum --check "$IMAGE_NAME.sha256" && cmp "$IMAGE_NAME" "$DIST_DIR/$IMAGE_NAME")
          gh release edit "$RELEASE_NAME" --draft=false
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_NAME}"
